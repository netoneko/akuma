[package]
name = "embed-tls-host"
version = "0.1.0"
edition = "2021"
publish = false

# A HOST reproduction of `libakuma-tls`'s TLS handshake, so a handshake failure
# can be diagnosed without Akuma, without the bare-metal box, and with the
# tracing `embedded-tls` already emits.
#
# Why this exists. `docs/archive/AMD64_TRASHCAN_ISSUES.md` §5 spent a session on
# "three TLS stacks, two cannot reach `api.z.ai`" with no way to see inside
# ours: `hget` printed "TLS handshake failed" and there was no arm of the
# investigation that did not need the trashcan. This crate is the control arm.
# If it fails here, on macOS, against the same host, then the kernel, the NIC
# and the whole amd64 port are not involved and must stop being suspected.
#
# NOT a workspace member: `userspace/` targets the no_std kernel
# (`x86_64-unknown-none` / `aarch64-unknown-none`) and this is an ordinary host
# program. Same opt-out `userspace/nca` and the nettest probes use.

[[bin]]
name = "embed-tls-host"
path = "src/main.rs"

[dependencies]
# The specimen. Pinned to the same major `libakuma-tls` depends on, with the
# same cipher suite and the same `NoVerify` — a divergence in any of those three
# would make this probe's answer inapplicable to the thing it stands in for.
# `std` + `log` are embedded-tls's own defaults and are the entire point: they
# are what turn `DecodeError` into a line naming the message it choked on.
embedded-tls = { version = "0.19", features = ["std", "log", "alloc"] }
embedded-io = { version = "0.7", features = ["std"] }
embedded-io-adapters = { version = "0.7", features = ["std"] }
rand = "0.8"
rand_core = "0.6"
env_logger = "0.11"
log = "0.4"

[workspace]

# The SAME pinned rev `userspace/Cargo.toml` builds the shipped stack from, so
# this probe stands in for `libakuma-tls` rather than merely resembling it. If
# these two ever drift, the probe's answer stops applying to the thing it is
# meant to exonerate or convict.
[patch.crates-io]
embedded-tls = { git = "https://github.com/netoneko/embedded-tls", rev = "6721038ba5874587b432fd82011168e85fa166b5" }

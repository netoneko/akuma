[workspace]

[package]
name = "litter-hub"
version = "0.1.0"
edition = "2021"

# Ordinary std binary. It is NOT part of a litter — it's the relay process
# every meow agent connects *outbound* to (see `litter-wire`'s module doc and
# `userspace/meow/docs/LITTER_EXPERIMENT.md` "Where this is headed"), so it
# runs on the host (or wherever is reachable from every agent container),
# alongside `ollama`/`llama-server`, not inside Akuma. Split into `lib.rs` +
# a thin `main.rs` so `cargo test` can drive a real `HubState` and a real
# `std::net::TcpListener` on an OS-assigned port, end to end, with no Docker
# and no meow binary involved — same reason `sshd`/`box` split their pure
# logic into a `--lib` half (root CLAUDE.md "Testing").
[dependencies]
litter-wire = { path = "../litter-wire" }

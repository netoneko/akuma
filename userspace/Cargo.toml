[workspace]
resolver = "2"
# NOTE (self-hosting): the submodule-backed members — meow, tcc, llama.cpp,
# nca — are temporarily removed from the workspace so the first-party crates build
# without every submodule checked out. Cargo requires *every* listed member's
# Cargo.toml to be present just to load the workspace, so a missing submodule
# blocked building even unrelated crates like `hello`. Re-add them (or build them
# standalone) once the submodule + dep story for in-VM builds is settled.
members = [
    "libakuma",
    "akuma-ssh-crypto",
    "libakuma-tls",
    "apk-tools",
    "box",
    "echo2",
    "elftest",
    "forkprobe",
    "fpcprobe",
    "shareprobe",
    "ext2probe",
    "hello",
    "paws",
    "herd",
    "httpd",
    "stackstress",
    "termtest",
    "allocstress",
    "tar",
    "sshd",
    "wavplay",
    "scratch",
    "hget",
    "wall",
]

# selfhost_repro is intentionally NOT a member: it is a throwaway crate built
# only *inside* the VM (via its own --manifest-path) to reproduce the
# proc-macro2 build-script deadlock (docs §7f). Exclude it so the host workspace
# never tries to build it.
exclude = [
    "selfhost_repro",
]

# Mirrors the root workspace so `akuma-ssh-crypto` keeps the lint level it had
# under crates/ before moving here (its only consumer is userspace/sshd).
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pedantic/nursery lints allowed workspace-wide — too noisy to enforce on all crates
doc_markdown = "allow"
items_after_statements = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
wildcard_imports = "allow"
option_if_let_else = "allow"
too_many_lines = "allow"
if_not_else = "allow"
future_not_send = "allow"
# Hex literals in kernel: MMIO/protocol constants use intentional groupings
unreadable_literal = "allow"
# let-else: 200 complex patterns not auto-fixable
manual_let_else = "allow"
# Style preferences not worth enforcing
too_many_arguments = "allow"
struct_field_names = "allow"
cast_precision_loss = "allow"
trivially_copy_pass_by_ref = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
branches_sharing_code = "allow"
same_item_push = "allow"
used_underscore_binding = "allow"
slow_vector_initialization = "allow"
significant_drop_in_scrutinee = "allow"
pointers_in_nomem_asm_block = "allow"

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kernel_profile_size)', 'cfg(kernel_profile_extreme)', 'cfg(kernel_smp)', 'cfg(ext2_fs_cache)'] }

[profile.release]
panic = "abort"
lto = true
opt-level = "z"        # optimize for size (smallest code); userspace is mostly I/O-bound
codegen-units = 1      # better cross-unit optimization under LTO, smaller output
strip = true           # drop symbol tables from the shipped ELF
overflow-checks = false # no checked-arith branches; reduces code size and frame depth

# `embedded-tls` comes from our fork, pinned by revision.
#
# The fork is upstream `main` (0.19.0) plus exactly two deviations:
#
# 1. `pub mod extensions` / `pub mod handshake`, so a `TlsVerifier` can be
#    implemented outside the crate without pulling in webpki/ring. This predates
#    the kernel's built-in SSH server being removed (2026-08-10) and is kept
#    deliberately. Upstream has since made the certificate and
#    certificate_verify *fields* public itself, so that part of the original
#    patch is gone and only the module visibility is still ours.
# 2. `SupportedGroups::parse` skips code points it does not recognize, as
#    RFC 8446 §4.2.7 and §9.3 require. Without it every `hget`/`meow`/`box`
#    handshake to `api.z.ai` died with `TlsError::DecodeError`, because that
#    server's advisory group list ends with `0x0029` (`curveSM2`) — *after*
#    secp256r1 had already been agreed.
#
# Upgrading does not remove the need for (2): upstream `main` still has the same
# `_ => Err(ParseError::InvalidData)`. The fix exists upstream only inside the
# unmerged PR #188 (TLS 1.3 server support, 52 files), and issue #163 tracks the
# gap — so our implementation is copied from that PR line for line, including the
# `NamedGroup::of` split, to merge trivially if it ever lands.
#
# `rev`, not `branch`: a moving branch would silently change what the kernel's
# TLS stack is built from between one build and the next.
#
# The rev is on the fork's `akuma-0.19` branch, based on upstream `ec5f0d5` —
# version 0.19.0 with all-crates.io dependencies — and **deliberately not on the
# fork's `main`**, which tracks upstream latest. One commit after `ec5f0d5`
# upstream "Port[ed] to embassy-crypto", replacing p256/aes-gcm/sha2/rand_core
# with `embassy-crypto`, a **git dependency on the embassy monorepo** at a pinned
# rev, and moving the RNG from a value passed to `TlsContext` to an ambient one
# the application installs. Neither is wanted here: this is a no_std userspace
# whose randomness is a `getrandom` syscall, and an ambient RNG that nobody
# installed fails by producing no entropy — the worst failure mode a TLS stack
# has. Upstream published no v0.17/v0.19 git tags (the newest is v0.16.2), which
# is why this pins a commit rather than a tag.
# `docs/archive/AMD64_TRASHCAN_ISSUES.md` §5.2.
[patch.crates-io]
embedded-tls = { git = "https://github.com/netoneko/embedded-tls", rev = "6721038ba5874587b432fd82011168e85fa166b5" }

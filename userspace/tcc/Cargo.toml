[workspace]

[package]
name = "tcc"
version = "0.9.27"
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
strip = true
overflow-checks = false

[dependencies]
libakuma = { path = "../libakuma" }

[build-dependencies]
cc = "1.0"

[workspace]

[package]
name = "tcc"
version = "0.9.27"
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
strip = true
overflow-checks = false

[dependencies]
# aarch64-only. `libakuma` is written against `aarch64-unknown-linux-musl`
# (its syscall wrappers assume libc's `linux-musl` ABI and error-number
# layout) and does not build for `x86_64-unknown-none`, which has no libc at
# all. amd64's `main.rs` uses `amd64_shim` instead — a local module with the
# same function names, so the rest of the file is arch-agnostic; see that
# module's header.
[target.'cfg(target_arch = "aarch64")'.dependencies]
libakuma = { path = "../libakuma" }

[build-dependencies]
cc = "1.0"

[package]
name = "libakuma"
version = "0.1.0"
edition = "2021"

[features]
default = ["chunked-allocator"]
chunked-allocator = []
# `net-async` pulls embedded-io-async, which ships a build.rs that probes rustc —
# a slow/sticky step for in-VM self-host builds. It only gates the
# `embedded_io_async::Error` impl in net.rs. OFF by default so the common case
# (e.g. `hello`, `httpd`) skips the build-script crate; consumers that use the
# async IO traits (e.g. `sshd`) opt in with `features = ["net-async"]`.
net-async = ["dep:embedded-io-async"]
# Use standard Linux ABI for OS-specific helpers that otherwise read from the
# Akuma kernel's process-info page (address 0x1000). Enable when building for
# a standard Linux target (e.g. aarch64-unknown-linux-musl) to avoid a segfault
# on the unmapped low page. Currently gates: getpid() → syscall 172.
linux-abi = []
# Let a program's own unit tests link libakuma on a std host. Drops exactly the
# four items that make that impossible: the `_start` entry (ELF `.section`
# syntax, which a Mach-O assembler rejects outright), `#[global_allocator]`
# (backed by Akuma's mmap — a host test would issue raw syscalls), and
# `#[panic_handler]` / `#[alloc_error_handler]` (both collide with std's). Everything else still compiles, so
# the program's pure logic is testable; **calling** a syscall wrapper from a
# test is still wrong — on a host it is a real syscall with an Akuma number.
# Enable it only from `[dev-dependencies]` (resolver 2 keeps dev-only features
# out of the shipped binary): see `userspace/herd/Cargo.toml`.
host-test = []

[dependencies]
talc = "4"
embedded-io-async = { version = "0.6", default-features = false, optional = true }
# `reboot(2)`'s magic/cmd constants — shared with both kernels' `sc-reboot`
# decode (`crates/akuma-syscalls-glue/src/reboot.rs`, `amd64/src/reboot.rs`)
# rather than a second hardcoded copy here. `default-features = false` drops
# the `psci` feature (and its `akuma-psci` dependency, AArch64 `smc`/`hvc`
# asm) — userspace only ever *issues* the syscall, never performs the reset.
akuma-boot = { path = "../../crates/akuma-boot", default-features = false }
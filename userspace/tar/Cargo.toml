[package]
name = "tar"
version = "0.1.0"
edition = "2021"

# The extractor is a library first: `box` links it directly rather than
# spawning /bin/tar, which for the whole life of `box pull` was silently a
# busybox applet symlink. See src/lib.rs.
[lib]
name = "akuma_tar"
path = "src/lib.rs"

[[bin]]
name = "tar"
path = "src/main.rs"
required-features = ["akuma"]

[features]
default = ["akuma"]
# Off for host unit tests of the pure `format` module, which is where header
# parsing (modes, typeflags, path safety) lives.
akuma = ["dep:libakuma"]

[dependencies]
libakuma = { path = "../libakuma", features = ["chunked-allocator"], optional = true }
miniz_oxide = { version = "0.7", features = ["with-alloc"] }
crc32fast = { version = "1.3", default-features = false }

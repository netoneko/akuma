[package]
name = "kami"
version = "0.1.0"
edition = "2021"
description = "紙 (kami, paper): headless Chromium on /dev/fb0 — PNG screencast over CDP, blitted to the framebuffer"
publish = false

# Standalone: a Linux std binary (cross-built for x86_64-unknown-linux-musl),
# not a libakuma member of the userspace workspace.
[workspace]

[dependencies]
# Both already in userspace/Cargo.lock; nothing new to vet.
libc = "0.2.180"
miniz_oxide = "0.8.9"
# `kami tui`: the page's layout painted into the terminal (src/tui/). Off by
# default; build with `--features tui`.
ratatui = { version = "0.30", optional = true }
serde_json = { version = "1", optional = true }
unicode-width = { version = "0.2", optional = true }

[features]
default = []
tui = ["dep:ratatui", "dep:serde_json", "dep:unicode-width"]

[profile.release]
opt-level = 3
debug = false
panic = "abort"

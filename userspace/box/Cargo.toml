[package]
name = "box"
version = "0.1.0"
edition = "2021"

[dependencies]
libakuma = { path = "../libakuma", features = ["chunked-allocator"] }
libakuma-tls = { path = "../libakuma-tls" }
# Layer extraction is linked in, not spawned as /bin/tar — see tar/src/lib.rs.
akuma-tar = { package = "tar", path = "../tar" }

[[bin]]
name = "box"
path = "src/main.rs"

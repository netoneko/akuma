# Load-bearing — see ../stdlib/.cargo/config.toml for why (cargo walks UP and
# would otherwise inherit the curl probe's Alpine triple, then the repo root's
# no_std `aarch64-unknown-none`).
[build]
target = "aarch64-unknown-linux-musl"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
rustflags = ["-C", "link-arg=-static"]

# The same declaration for the amd64 bare-metal box, so `ARCH=x86_64
# ../build-musl.sh` needs nothing but this file and the cross toolchain. The
# `[build] target` above stays aarch64 — that is the default machine — and
# `build-musl.sh` passes `--target` to pick this one, which is why both have to
# be spelled out here rather than only the default.
[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"
rustflags = ["-C", "link-arg=-static"]

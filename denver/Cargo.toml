[package]
name = "denver"
version = "0.1.0"
edition = "2024"
description = "Denver: the teaching kernel over akuma-jvm-kernel - the Shanghai pattern's next student. Phase 0 scaffold: boots tokio through the jvm-kernel front crate; uname says denver."
# `uname -n` is the package name (`Kernel::new(start_info, CARGO_PKG_NAME, ...)`).

[lints]
workspace = true

[dependencies]
akuma-jvm-kernel = { path = "../akuma-jvm-kernel", features = ["no-tests"] }

[features]
# The JIT-permitting W^X relaxation (PHASE-2-WX, G1): the policy this kernel exists to carry,
# relayed 1:1 down the front crate. Off by default (R6): the phase-0 default build (console,
# disk, net, smp) is unchanged; the gate kernel is `--features wx-relaxed` (rig: denver-wx).
wx-relaxed = ["akuma-jvm-kernel/wx-relaxed"]
# The legacy vsyscall page (PHASE-2-VDSO, G3): the ABI HotSpot hardcodes, relayed 1:1 down the
# front crate. Off by default (R6); the gate kernel is `--features wx-relaxed,vsyscall`
# (rig: denver-vdso).
vsyscall = ["akuma-jvm-kernel/vsyscall"]
# Per-pid /proc address-space diagnostics (PHASE-2-PROCFS, G4): /proc/<pid>/maps and
# /proc/<pid>/auxv so a fault rip gets an owner. Off by default (R6); the gate kernel is
# `--features wx-relaxed,vsyscall,procfs-diag` (rig: denver-procfs).
procfs-diag = ["akuma-jvm-kernel/procfs-diag"]

# The fault-path evidence tables (PHASE-2-NULLSTORE, D34): the syscall ring,
# the instruction-bytes and mmap-slab dumps at a ring-3 kill, now also relayed
# into the denver gate kernel. Off by default (R6); the gate kernel is
# `--features wx-relaxed,vsyscall,procfs-diag,trace-err` (rig: denver-nullstore).
trace-err = ["akuma-jvm-kernel/trace-err"]
# The legacy fold's frame restoration (PHASE-2-NULLFIX, G9): the six caller
# argument registers a folded syscall clobbered go home before the return —
# the NULL store at musl fstatat's copy-out was this bug (the JVM's saved buf
# in r8 came back zeroed). Off by default (R6); the gate kernel is
# `--features wx-relaxed,vsyscall,procfs-diag,trace-err,fold-regpreserve`
# (rig: denver-nullfix).
fold-regpreserve = ["akuma-jvm-kernel/fold-regpreserve"]
# The release sweep's lazy-record clearing (PHASE-2-HEAPRO): the released range's
# P=0 records the present-only walk skipped were re-served by the not-present
# fault arm; a stale file record read back RO and the next write died at
# code=0x7 unmarked — PHASE-2-NULLFIX's java death. Off by default (R6); the gate
# kernel is `--features wx-relaxed,vsyscall,procfs-diag,trace-err,fold-regpreserve,lazy-release-sweep`
# (rig: denver-heapro).
lazy-release-sweep = ["akuma-jvm-kernel/lazy-release-sweep"]
# sysinfo(2) (PHASE-2-MEMINFO, G7): musl's sysconf(_SC_PHYS_PAGES) performs sysinfo
# (nr 99) and HotSpot's heap sizing died on the ENOSYS (`Too small maximum heap`, a
# clean exit=1). Off by default (R6); the gate kernel is
# `--features wx-relaxed,vsyscall,procfs-diag,trace-err,fold-regpreserve,lazy-release-sweep,sysinfo`
# (rig: denver-meminfo).
sysinfo = ["akuma-jvm-kernel/sysinfo"]
# getcpu(2) (PHASE-2-GETCPU, G2): the raw-syscall gap — musl's `sched_getcpu`
# performs nr 168 and got ENOSYS (`GETCPU RED ENOSYS` since PHASE-1; the vsyscall
# stub's -38 only softened HotSpot's own path). Served with the caller's core.
# Off by default (R6); the gate kernel is
# `--features wx-relaxed,vsyscall,procfs-diag,trace-err,fold-regpreserve,lazy-release-sweep,sysinfo,getcpu`
# (rig: denver-getcpu).
getcpu = ["akuma-jvm-kernel/getcpu"]

[[bin]]
name = "denver"
path = "src/main.rs"

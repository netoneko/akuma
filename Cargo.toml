cargo-features = ["panic-immediate-abort"]

[workspace]
members = [".", "crates/*"]
default-members = [
    ".",
    "crates/akuma-exec",
    "crates/akuma-ext2",
    "crates/akuma-isolation",
    "crates/akuma-net",
    "crates/akuma-rump",
    "crates/akuma-smp",
    "crates/akuma-terminal",
    "crates/akuma-vfs",
]
exclude = ["userspace"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pedantic/nursery lints allowed workspace-wide — too noisy to enforce on all crates
doc_markdown = "allow"
items_after_statements = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
wildcard_imports = "allow"
option_if_let_else = "allow"
too_many_lines = "allow"
if_not_else = "allow"
future_not_send = "allow"
# Hex literals in kernel: MMIO/protocol constants use intentional groupings
unreadable_literal = "allow"
# let-else: 200 complex patterns not auto-fixable
manual_let_else = "allow"
# Style preferences not worth enforcing
too_many_arguments = "allow"
struct_field_names = "allow"
cast_precision_loss = "allow"
trivially_copy_pass_by_ref = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
branches_sharing_code = "allow"
same_item_push = "allow"
used_underscore_binding = "allow"
slow_vector_initialization = "allow"
significant_drop_in_scrutinee = "allow"
pointers_in_nomem_asm_block = "allow"

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kernel_profile_extreme)', 'cfg(kernel_tests)', 'cfg(kernel_smp)', 'cfg(ext2_fs_cache)'] }

[package]
name = "akuma"
version = "0.0.7"
edition = "2024"
license = "BSD-2-Clause"

[[bin]]
name = "akuma"
bench = false
test = false

[profile.release]
panic = "abort"


# The only size-optimised profile (the `size` profile was removed 2026-08-10: it
# had no unique feature, no acceptance coverage, and was the sole reason
# `kernel_profile_size` was emitted for two profiles). `build.rs` keys the
# extreme behaviour off the `extreme` FEATURE, not the profile — they are
# selected together by scripts/build_extreme_size.sh.
[profile.extreme-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "immediate-abort"

# Multikernel build (docs/MULTIKERNEL.md §11). Inherits `release` codegen; carries
# any SMP-specific knobs later. The profile sets codegen, the `smp` FEATURE gates
# the code — they are selected together by scripts/build_smp.sh:
#   cargo build --profile release-smp --features smp
# Off by default until the §10 acceptance test passes; `cargo build --release`
# is unaffected and the single-core path stays the only path.
[profile.release-smp]
inherits = "release"

# Real (shared-kernel) SMP build (docs/reference/subsystems/smp-shared.md). Inherits
# `release` codegen; the `smp-shared` FEATURE gates the code. Selected together:
#   cargo build --profile release-smp-shared --features smp-shared
# (scripts/build_smp_shared.sh). Mutually exclusive with `smp` (build.rs panics if
# both are set). `cargo build --release` is unaffected — single-core stays the default.
[profile.release-smp-shared]
inherits = "release"

# Devbox build (overlays/devbox). Inherits `release` codegen (so it carries `rump`
# + `sound`); the DISTINCTION from release is entirely in the `devbox` FEATURE set,
# selected together by scripts/build_devbox.sh / overlays/devbox/run.sh:
#   cargo run --profile devbox --features devbox
# The devbox makes the NetBSD rump stack the DEFAULT network stack for box 0 (the
# root box every process starts in) and drops the built-in smoltcp SSH server, so
# the only stack you touch — and the only sshd — is rump. See the `devbox` feature.
[profile.devbox]
inherits = "release"

# DWARF debug-info variant of `release-smp-shared`, for source-level lldb debugging
# against the gdbstub (see docs/reference/scripts/multi-vm.md) instead of raw
# addresses. OFF BY DEFAULT: nothing selects this profile unless explicitly
# requested — `cargo build --profile release-smp-shared-debug --features
# smp-shared,devbox-smoltcp,no-tests` (or whatever feature set you're debugging).
# `cargo build --profile release-smp-shared` (the real target) is byte-for-byte
# unaffected.
#
# Only use this on a bug you can ALREADY reproduce reliably. `lockprobe.py`
# deliberately symbolicates off `.symtab` and skips DWARF entirely because full
# debug info changes the loaded image by ~100 KB, which can shift a
# timing-sensitive race (see docs/reference/build-profiles.md). This profile
# exists for the opposite situation: you have a live repro and want lldb to show
# you source lines/locals instead of raw PC/LR values — a convenience, not a
# hunting tool.
[profile.release-smp-shared-debug]
inherits = "release-smp-shared"
debug = true

[features]
default = [
    "smoltcp",
    "sound",
    "rump",
    "fs-cache",
    "sc-aio", "sc-sysv-ipc", "sc-framebuffer", "sc-containers",
    "sc-timerfd", "sc-eventfd", "sc-pidfd", "sc-epoll",
]
no-tests = ["akuma-net/small-sockets"]
# Allow ONLY rump_tests to compile even when `no-tests` is set — used by the
# devbox to verify rump regression guards at boot without pulling in the full
# test suite (which requires default features smoltcp types etc.).
rump-tests = []

# Multikernel / one-kernel-per-core (docs/MULTIKERNEL.md). NOT in `default`: all
# secondary-core bringup, the per-core descriptor, PSCI CPU_ON, the message bus
# and forwarding stubs live behind `cfg(kernel_smp)`, which build.rs emits only
# when this feature is set (via CARGO_FEATURE_SMP). Paired with the `release-smp`
# profile by scripts/build_smp.sh. With it off, the default build is byte-for-byte
# single-core. Pulls in the pure, host-testable coordination crate `akuma-smp`
# (descriptor, lock-free MPSC inbox, memory-reclaim protocol) only under this
# feature, so the default build never even compiles it.
smp = ["dep:akuma-smp"]

# Real (shared-kernel) SMP / classic symmetric multiprocessing. NOT in `default`:
# all shared-kernel secondary bringup + the shared scheduler/locking live behind
# `cfg(kernel_smp_shared)`, which build.rs emits only when this feature is set (via
# CARGO_FEATURE_SMP_SHARED). Paired with the `release-smp-shared` profile. The
# INVERSE of `smp`: instead of replicating per-core state, all cores share one
# kernel image, one PMM/heap, and one run queue under real cross-core locks.
# Mutually exclusive with `smp` (build.rs enforces). See
# docs/reference/subsystems/smp-shared.md and docs/archive/SMP_SHARED.md.
# Includes `no-bkl-network` (BKL-free native net syscalls) by default since
# 2026-07-24: validated at SMP=4 under a real BitTorrent swarm + ssh hammer
# (0 wedges, 0 corruption) after the socket-refcount / wait_until / pipe-SIGPIPE
# fixes. To A/B against the BKL-held net path, remove it from this list.
# Includes `no-bkl-vfs` (BKL-free VFS syscalls) since 2026-07-25 — same pattern
# as net: every piece of VFS state already carries its own spinlock, so the BKL
# is redundant for fs syscalls. Remove from this list to A/B.
# Includes `no-bkl-process` (BKL-free fork page-copy) since 2026-07-31: the CoW
# fault handler already edited the parent's PTEs BKL-free under the address
# space's `as_lock`, so the BKL was redundant for fork's copy too. Validated at
# SMP=4 (3 boots × 10 rounds fork-hammer: 0 faults, 0 partial child output, 0
# `[BKL] stuck`) and contention-confirmed by a same-source `bkl-profile` A/B
# (`clone` 19.5% → 2.5%, 8.6× fewer spins). Remove from this list to A/B.
# Includes `no-bkl-irq` (BKL-free timer-IRQ dispatch, Phase 7a) since
# 2026-08-01: the timer is the only device IRQ this kernel registers, and its
# handler's state (the alarm queue's own Spinlock, per-thread preemption-
# watchdog atomics, raw GIC MMIO) no longer needs the BKL. Validated at SMP=2/4
# boot self-test (0 PANIC/WILD/SPURIOUS, the BKL-hold-state invariant test
# passing) and a same-binary `bkl-profile` A/B on the contention regimen
# (`irq/sched` 24.7% → 10.2%, 6/6 digests exact both sides). Remove from this
# list to A/B.
smp-shared = ["akuma-exec/smp-shared", "akuma-net/smp-shared", "no-bkl-network", "no-bkl-vfs", "no-bkl-process", "no-bkl-mm", "no-bkl-drivers", "no-bkl-irq"]

# Run the native (smoltcp) network syscalls WITHOUT the Big Kernel Lock — the
# first subsystem carved out of the BKL (docs/archive/BKL_FINE_GRAINED_LOCKING_PLAN.md
# Phase 2). Only meaningful together with `smp-shared` (and included in it by
# default): build.rs emits `cfg(kernel_no_bkl_network)` from
# CARGO_FEATURE_NO_BKL_NETWORK, and the net syscall entry points then DROP the
# BKL for their duration, relying on the existing fine-grained NETWORK /
# SOCKET_TABLE / fd-table spinlocks for cross-core mutual exclusion instead
# (PreemptGuard additionally masks IRQs for those holds — see
# crates/akuma-net/src/runtime.rs). A no-op (byte-for-byte unchanged) on every
# build that doesn't set both features.
no-bkl-network = ["akuma-exec/no-bkl-network", "akuma-net/no-bkl-network"]

# Run the VFS syscalls WITHOUT the Big Kernel Lock — Phase 4 of
# docs/archive/BKL_FINE_GRAINED_LOCKING_PLAN.md, the second subsystem carved out
# of the BKL (mirrors `no-bkl-network`). Only meaningful together with
# `smp-shared` (and included in it by default): build.rs emits
# `cfg(kernel_no_bkl_vfs)` from CARGO_FEATURE_NO_BKL_VFS, and the fs syscall
# entry points then DROP the BKL for their duration, relying on the existing
# fine-grained MOUNT_TABLE / Ext2Filesystem::state (RwSpinlock) / block_cache /
# BLOCK_DEVICE / fd-table spinlocks for cross-core mutual exclusion.
# PreemptGuard (lifted to `akuma_exec::sync` from akuma-net) additionally masks
# IRQs for the ext2/block-device holds — the same hardening that closed the
# SMP=4 ABBA wedge in net's Phase 2. A no-op (byte-for-byte unchanged) on every
# build that doesn't set both features.
no-bkl-vfs = ["akuma-exec/no-bkl-vfs", "akuma-ext2/no-bkl-vfs", "akuma-net/no-bkl-vfs"]

# Run `fork_process`'s CoW share/demote pass WITHOUT the Big Kernel Lock — Phase 3 of
# docs/archive/BKL_FINE_GRAINED_LOCKING_PLAN.md, the third subsystem carved out (after
# net and vfs) and the first that is NOT about I/O: `clone` was the largest remaining
# non-irq/sched BKL holder once every syscall attribution had ever named was converted.
# build.rs emits `cfg(kernel_no_bkl_process)` from CARGO_FEATURE_NO_BKL_PROCESS, and
# `fork_process` then drops the BKL for the page-copy window, relying on the address
# space's own `as_lock` — the SAME lock the CoW fault handler already takes BKL-free —
# held in bounded chunks around every parent-page-table access, plus the existing
# COW_REFCOUNTS / PMM / allocator spinlocks. Steps 5–8 (ProcessInfo, THREAD_CONTEXTS
# capture, thread spawn, register+READY) stay fully BKL-held: they touch state with no
# inner lock, where the BKL IS the lock.
#
# Included in `smp-shared` since 2026-07-31 (same as net and vfs). To A/B against the
# BKL-held fork path, drop it from the `smp-shared` list above and rebuild — and note
# that alternating feature sets is exactly the workflow the stale-`.bin` bug in
# scripts/cargo_runner.sh used to corrupt (fixed 2026-07-31; see
# docs/archive/BKL_PROCESS_CARVE_OUT.md §9.8). There is also a runtime kill switch,
# `smp_shared::set_process_bkl_drop_enabled(false)`, which needs no rebuild.
# A no-op (byte-for-byte unchanged) on every build that doesn't set both features.
no-bkl-process = ["akuma-exec/no-bkl-process"]

# Run the memory-management syscalls (`mprotect`/`madvise`/`munmap`/`mremap`/`mmap`)
# WITHOUT the Big Kernel Lock — Phase 5 of
# docs/archive/BKL_FINE_GRAINED_LOCKING_PLAN.md, the fourth subsystem carved out.
# Included in `smp-shared` since 2026-08-01 (same as net/vfs/process). Unlike
# net/vfs/process, this phase's own audit found two real gaps rather than
# rediscovering an existing lock: `ProcessMemory::free_regions` was a plain
# unguarded `Vec` (fixed by folding it under the existing `Process::vm_lock`, see
# `Process::vm_alloc_mmap`/`vm_free_mmap`), and `sys_mmap`'s OOM/reclaim sweep
# mutated page tables with no `as_lock` hold at all (fixed by taking a per-page
# `as_lock_hold` in `reclaim_clean_file_pages`). With those closed, every piece of
# state these syscalls touch — `Process::as_lock` (page tables), `Process::vm_lock`
# (`mmap_regions` + the mmap free-list), `LAZY_REGION_TABLE`, PMM/FRAME_TRACKER, and
# `SHARED_FILE_MAPPINGS` — already carries its own fine-grained lock independent of
# the BKL. build.rs emits `cfg(kernel_no_bkl_mm)` from CARGO_FEATURE_NO_BKL_MM.
# Unlike net/vfs/process, attribution has never named an mm syscall as a real
# contention target (`mmap` was 2.4% of the last measured pool, itself since cut
# 67% by the `netpoll_drain` carve, §20 of BKL_VFS_CARVE_OUT.md) — this phase is
# plan-driven, not evidence-driven. A no-op (byte-for-byte unchanged) on every
# build that doesn't set both features. Unlike net/vfs/process, none of the
# underlying locks (`as_lock`, `vm_lock`, `LAZY_REGION_TABLE`, PMM) need to know
# this feature exists — their IRQ-masking is already unconditional (`as_lock` on
# `kernel_smp_shared` alone, the rest always-on), not conditionally gated on being
# reachable from a BKL-free window the way `PreemptGuard` is for net/vfs (see
# BKL_VFS_CARVE_OUT.md §19.3) — so this is a bin-crate-only feature with nothing
# to forward into `akuma-exec`.
no-bkl-mm = []

# Run the device-driver syscalls (`getrandom`, `read`/`pread64` on `/dev/urandom`,
# `write` on `/dev/dsp`, and the `fb_*` framebuffer syscalls) WITHOUT the Big Kernel
# Lock — Phase 6 of docs/archive/BKL_FINE_GRAINED_LOCKING_PLAN.md, the fifth
# subsystem carved out. Included in `smp-shared` since 2026-08-01 (same as
# net/vfs/process/mm). Like the preceding phases, every piece of state these
# syscalls touch already carries its own fine-grained Spinlock — `RNG_DEVICE`
# (virtio-rng, polling), `SOUND_DEVICE` (virtio-sound, polling), and `FB_STATE`
# (ramfb framebuffer) — so the BKL is redundant for them. The block device
# (`BLOCK_DEVICE`) and network device (`NETWORK`) are already BKL-free via
# `no-bkl-vfs` / `no-bkl-network`; this phase covers the remaining drivers.
# build.rs emits `cfg(kernel_no_bkl_drivers)` from CARGO_FEATURE_NO_BKL_DRIVERS.
# Like `no-bkl-mm`, none of the underlying driver locks need to know this feature
# exists — their Spinlock acquisition is already unconditional — so this is a
# bin-crate-only feature with nothing to forward into `akuma-exec`. A no-op
# (byte-for-byte unchanged) on every build that doesn't set both features.
# Note: virtio-gpu does not exist in this codebase; graphics output is via QEMU
# ramfb (a fw_cfg-backed RAM framebuffer, not a virtio device).
no-bkl-drivers = []

# Run the timer IRQ (27) dispatch WITHOUT the Big Kernel Lock — Phase 7a of
# docs/archive/BKL_FINE_GRAINED_LOCKING_PLAN.md §7 (see
# docs/archive/BKL_PHASE7_AUDIT.md §2.3/§5). The timer is the only device IRQ this
# kernel registers (`irq::register_handler(27, timer::timer_irq_handler)`), and its
# handler no longer touches anything the BKL alone protects: the alarm queue has its
# own `Spinlock` (this same phase), the preemption watchdog and fork-in-progress
# check are per-thread/global atomics, and the GIC ack/EOI/SGI-trigger calls are raw
# MMIO — all already cross-core safe independent of the BKL. build.rs emits
# `cfg(kernel_no_bkl_irq)` from CARGO_FEATURE_NO_BKL_IRQ. Unlike net/vfs/process/mm,
# this isn't a syscall-entry carve-out (no dropped-BKL "window" — the device-IRQ
# path in `rust_irq_handler_with_sp` simply never calls `enter_kernel`/
# `reconcile_for_spsr` at all, so there is nothing to reconcile: no context switch
# happens on this path, and the interrupted thread's own BKL hold state is left
# completely untouched). Included in `smp-shared` since 2026-08-01, after the boot
# self-test suite (SMP=2/4) and a same-binary `bkl-profile` A/B on the contention
# regimen validated it (`irq/sched` 24.7% → 10.2%, 6/6 digests exact both sides,
# 0 stuck/RECOVERED/PANIC/WILD/SPURIOUS both sides) — see
# docs/archive/BKL_PHASE7A_TIMER_IRQ_CARVE_OUT.md §5. Remove from the `smp-shared`
# list to A/B against the BKL-held path.
no-bkl-irq = []

# BKL-hold attribution (measurement builds only — never ship it). Enables the
# per-tag BKL profiler in `akuma_exec::sync` for the whole boot and makes the
# async-main loop print a periodic `[BKLPROF]` delta histogram: which syscall /
# fault / IRQ-scheduler excursion the *holding* core was in while peers spun.
# This is the input that decides whether more BKL carve-outs are worth it (the
# Phase 0 estimate that scheduler/IRQ holds ~70% of contended time was never
# measured under a real userspace workload). Costs a shared-line store on every
# kernel entry, so it perturbs timing-sensitive tests — keep it out of
# `smp-shared` and enable it explicitly:
#   cargo build --profile release-smp-shared --features devbox-smoltcp,no-tests,bkl-profile
bkl-profile = []

# Rump-kernel support: a raw L2 packet path so a userspace NetBSD rump TCP/IP
# stack can send/receive Ethernet frames. Binds a SECOND virtio-net device
# (NIC1) and exposes it as /dev/net/tap0 (open/read/write whole frames + a
# no-op TUN/TAP ioctl), leaving NIC0 on the native smoltcp stack. Included in
# `default` so only the RELEASE profile carries it; the size/extreme profiles
# build with --no-default-features and omit it (it targets roomy VMs, not the
# 4 MB floor). NIC1 itself only exists when the QEMU runner is started with
# RUMP_NIC=1; without it, tap init no-ops and /dev/net/tap0 returns ENODEV.
rump = ["akuma-net/rump", "dep:akuma-rump"]
# The native smoltcp TCP/IP stack (NIC0): the in-kernel socket syscalls, DNS/HTTP,
# and the built-in SSH server are all built on it. In `default`; the devbox build
# drops it (rump is the only stack) via --no-default-features, which compiles the
# whole smoltcp path — and the smoltcp-coupled built-in SSH — out. Enables the
# matching akuma-net feature.
smoltcp = ["dep:smoltcp", "akuma-net/smoltcp"]

# virtio-sound output driver (src/audio.rs + /dev/dsp). Enabled by default;
# dropped by the size/extreme profiles' `--no-default-features` builds. Pulls in
# virtio-drivers' `alloc` feature, which gates its `sound` module. Designed to be
# small/bounded enough to opt back into `extreme` (4 MB) via `--features sound`.
sound = ["virtio-drivers/alloc"]

# Use the legacy GICv2 MMIO interrupt-controller driver (src/gic.rs) instead of
# the default GICv3 driver (src/gic_v3.rs). GICv2 works under QEMU TCG
# (`-machine virt` defaults to gic-version=2) but faults under QEMU HVF on Apple
# Silicon, where only the GICv3 system-register CPU interface exists. Build the
# kernel with `gic-version=3` in the QEMU command line when using the default
# (GICv3) driver — see scripts/cargo_runner.sh.
gic-v2 = []

# Profile discriminator (NOT a syscall gate). build_extreme_size.sh enables it so
# build.rs can pick a tighter IMAGE_SIZE / STACK_BOTTOM than the `size` profile.
# build.rs reads it via CARGO_FEATURE_EXTREME and emits cfg(kernel_profile_extreme).
# Forwarded to akuma-exec and akuma-ext2 so their build.rs emits the same cfg
# (warm-stack floor + kernel-stack right-sizing in akuma-exec; block-cache gate
# in akuma-ext2).
extreme = ["akuma-exec/extreme", "akuma-ext2/extreme"]

# Large RAM-sized ext2 block cache with clock eviction (crates/akuma-ext2). Keeps
# the read-only toolchain resident across the many process spawns in a self-host
# `cargo build`, instead of re-reading it off virtio-blk per spawn. The cache cap
# is auto-derived from detected RAM at mount (`min(25% RAM, 512 MB)`, src/fs.rs).
#
# In `default` since 2026-08-02. Without it `akuma-ext2` falls back to
# `BlockRingCache`: 64 slots / 256 KB, FIFO, linear-scan lookup. That is far
# smaller than a single demand-fault's 1 MB readahead, so a fault evicts its own
# double-indirect blocks ~4x while filling, and every page of a >4 MB file costs
# two extra indirect block reads off virtio-blk. Measured on the rustc workload
# (`docs/archive/BKL_RUSTC_SCALING_BASELINE.md`): `rustc --version` — zero
# compilation — spent 1.43 s in 118 instruction-abort demand-page faults, 12.1 ms
# each, against `librustc_driver` (63 MB) + `libLLVM` (176 MB).
#
# The `size`/`extreme` builds pass --no-default-features and do not re-add this,
# so they are unaffected. Never combined with `extreme` (the 4 MB profile has no
# cache at all) — akuma-ext2's build.rs gates the cfg on that.
fs-cache = ["akuma-ext2/fs-cache"]

# Per-family syscall gates. Default-on so `cargo build`/`run`/`test` keep every
# syscall; the minimal builds use --no-default-features and re-add what they want.
# Tier 1 — pure dead weight, no akuma-exec callbacks.
sc-aio          = []
sc-sysv-ipc     = []
sc-framebuffer  = []
sc-containers   = []
sc-timerfd      = []
# Tier 2 — each needs a no-op ExecRuntime callback stub when off (see main.rs).
sc-eventfd      = []
sc-pidfd        = []
sc-epoll        = []

# ── devbox: rump as the DEFAULT network stack + no built-in SSH ──────────────
# Register the NetBSD rump TCP/IP stack as the default stack for box 0 (the root
# box every process starts in), rather than only for an explicit `stack=rump`
# herd box. When on, the kernel at boot marks box 0 rump and brings up its
# rump_server (over /dev/net/tap0, so it needs RUMP_NIC=1) — see
# `rump_proxy::start_default_stack`. Every unboxed process's AF_INET syscalls
# then route to rump with no herd box + no `join_box` needed. Implies `rump`.
rump-default = ["rump"]

# Disable the built-in (in-kernel, smoltcp) SSH server so the ONLY sshd is the
# userspace /bin/sshd started by herd. Drives `config::ENABLE_USERSPACE_SSHD`
# (src/config.rs) via cfg!(feature = ...). Off by default (the normal image
# keeps its built-in SSH). The devbox needs this: with rump the default stack,
# the built-in server (which is smoltcp-only) would be the one thing still on
# the native stack.
userspace-sshd = []

# The devbox meta-feature: rump is the default stack and there is no built-in
# SSH. Selected with `--features devbox` (+ the `devbox` profile). Phase 2 will
# additionally build this with `--no-default-features` to compile `smoltcp` (and
# the smoltcp-coupled built-in SSH) out entirely; for now it layers on top of the
# default set, so the build still carries smoltcp but never routes box 0 to it.
devbox = ["rump-default", "userspace-sshd"]

# ── devbox-smoltcp: the DEFAULT devbox going forward ─────────────────────────
# A dev image on the NATIVE smoltcp stack (NOT rump — rump_server work is
# deferred), with the built-in in-kernel SSH dropped (`userspace-sshd` → the
# userspace /bin/sshd from herd serves SSH over smoltcp instead) and real
# shared-kernel SMP (`smp-shared`). The INVERSE of `devbox` (rump-default):
# keep smoltcp, drop the built-in ssh, add real SMP. Built with the
# `release-smp-shared` profile by scripts/build_devbox_smoltcp.sh and layered on
# the default (smoltcp-carrying) feature set. Because smoltcp stays in, the
# `userspace-sshd` compile guard in main.rs is satisfied. See
# docs/reference/subsystems/smp-shared.md and overlays/devbox/README.md.
devbox-smoltcp = ["userspace-sshd", "smp-shared"]

[lints]
workspace = true

[dependencies]
akuma-terminal = { path = "crates/akuma-terminal" }
akuma-vfs = { path = "crates/akuma-vfs" }
akuma-ext2 = { path = "crates/akuma-ext2" }
akuma-net = { path = "crates/akuma-net", default-features = false }
akuma-exec = { path = "crates/akuma-exec" }
# Kernel-side sysproxy client (rumpsp wire + Linux↔NetBSD translation); only the
# `rump` feature needs it directly (akuma-net already pulls it for rump_tap).
akuma-rump = { path = "crates/akuma-rump", optional = true }
akuma-isolation = { path = "crates/akuma-isolation" }
# Pure, host-testable multikernel coordination (descriptor, MPSC ring, reclaim
# protocol). Optional — only the `smp` feature pulls it in (cfg(kernel_smp) code).
akuma-smp = { path = "crates/akuma-smp", optional = true }
talc = "4"
spinning_top = "0.3"
fdt = "0.1"
smoltcp = { version = "0.12.0", default-features = false, features = ["proto-ipv4", "socket-tcp", "socket-udp", "socket-dns", "medium-ethernet", "alloc", "async", "socket-dhcpv4"], optional = true }
virtio-drivers = { version = "0.7", default-features = false }
arm_pl031 = { version = "0.2", default-features = false }
embedded-io-async = { version = "0.6", default-features = false }


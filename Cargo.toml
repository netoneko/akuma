# `akuma-fbcon` (anti-aliased console fonts, baked by its `build.rs` from IBM Plex Mono and the
# Spleen submodule) is a workspace member but NOT a default member: only the amd64 kernel draws
# text on a framebuffer, so an AArch64 `cargo build`/`test` must not bake fonts or need the
# `crates/akuma-fbcon/vendor/spleen` submodule. It still builds as `amd64`'s dependency; test it
# with `cargo test -p akuma-fbcon --target $(rustc -vV | sed -n 's/^host: //p')`.

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pedantic/nursery lints allowed workspace-wide — too noisy to enforce on all crates
doc_markdown = "allow"
items_after_statements = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
wildcard_imports = "allow"
option_if_let_else = "allow"
too_many_lines = "allow"
if_not_else = "allow"
future_not_send = "allow"
# Hex literals in kernel: MMIO/protocol constants use intentional groupings
unreadable_literal = "allow"
# let-else: 200 complex patterns not auto-fixable
manual_let_else = "allow"
# Style preferences not worth enforcing
too_many_arguments = "allow"
struct_field_names = "allow"
cast_precision_loss = "allow"
trivially_copy_pass_by_ref = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
branches_sharing_code = "allow"
same_item_push = "allow"
used_underscore_binding = "allow"
slow_vector_initialization = "allow"
significant_drop_in_scrutinee = "allow"
pointers_in_nomem_asm_block = "allow"

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kernel_profile_extreme)', 'cfg(kernel_tests)', 'cfg(ext2_fs_cache)'] }

[package]
name = "akuma"
version = "0.0.9"
edition = "2024"
license = "BSD-2-Clause"
# Disambiguates `cargo run` at the workspace root now that akuma-scheduler's
# `sched-sim` bin sits in `default-members` alongside this package — without
# it, `cargo run` (bare, the command CLAUDE.md and every `overlays/devbox/run*.sh`
# script actually invoke) refuses to guess between the two and errors out.
default-run = "akuma"

[[bin]]
name = "akuma"
bench = false
test = false

[profile.release]
panic = "abort"
# ThinLTO across the whole graph, not just within each crate. Without it a call
# from `src/` into `crates/akuma-*` crosses a codegen-unit boundary and is inlined
# only if the callee carries `#[inline]` — which just ~10% of `crates/`' `pub fn`
# do, while the hot paths (mmu, the fault helpers, the Phase 7e accessors) all
# live there. Fat is measurably better on image size but peaks at ~1.1 GB of
# linker memory against thin's ~780 MB, which is the difference between building
# on a 1 GB machine and not — and this kernel builds itself (acceptance 10).
# `extreme-size` overrides this with `lto = true` (fat): it is size-gated, built
# rarely, and never self-hosted. Measurements: docs/archive/LTO_RELEASE_PROFILE.md
lto = "thin"


# The only size-optimised profile (the `size` profile was removed 2026-08-10: it
# had no unique feature, no acceptance coverage, and was the sole reason
# `kernel_profile_size` was emitted for two profiles). `build.rs` keys the
# extreme behaviour off the `extreme` FEATURE, not the profile — they are
# selected together by scripts/build_extreme_size.sh.
[profile.extreme-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

# DWARF debug-info variant of `release`, for source-level lldb debugging
# against the gdbstub (see docs/reference/scripts/multi-vm.md) instead of raw
# addresses. OFF BY DEFAULT: nothing selects this profile unless explicitly
# requested — `cargo build --profile release-debug --features
# smp-shared,devbox-smoltcp,no-tests` (or whatever feature set you're debugging).
# `cargo build --release` (the real target) is byte-for-byte unaffected.
#
# Only use this on a bug you can ALREADY reproduce reliably. `lockprobe.py`
# deliberately symbolicates off `.symtab` and skips DWARF entirely because full
# debug info changes the loaded image by ~100 KB, which can shift a
# timing-sensitive race (see docs/reference/build-profiles.md). This profile
# exists for the opposite situation: you have a live repro and want lldb to show
# you source lines/locals instead of raw PC/LR values — a convenience, not a
# hunting tool.
[profile.release-debug]
inherits = "release"
debug = true

[features]
# Compile the `[syscall]`/`[FORK-DBG]`/AIO-stub debug traces in. OFF by default.
#
# It is a FEATURE and not just `src/config.rs` const because three AIO stubs are
# `FastPath::Leaf` only when their trace compiles out (`akuma-syscalls`'
# `flat_when_untraced`), and `FastPath` membership must be constant within a
# build. `config::SYSCALL_DEBUG_INFO_ENABLED` is derived from this feature, and
# `src/syscall/mod.rs` const-asserts the two agree.
# Temporary leak-attribution instrumentation across the allocator and the MMU.
# OFF by default; build with `--features leak-instr` (and
# `-C force-frame-pointers=yes` for the call-chain attribution) when chasing a
# heap leak. docs/archive/SELFHOST_KERNEL_HEAP_LEAK.md.
leak-instr = ["akuma-kernel-glue/leak-instr"]

# PMM pressure instrumentation: the `[PMM-BUDGET]` budget line (per-consumer
# page counts beside the PMM free count) and `[PMM-USER-OOM]`, which is the
# discriminator between "a user fault could not be served" and a corruption
# SIGSEGV. OFF by default; build with `--features pmm-instr` while a memory
# question is open. See docs/archive/ERET_ELR_CLOBBER_ENTER_USER_MODE.md and
# the 2026-09-03 2 GB self-host measurement.
pmm-instr = ["akuma-kernel-glue/pmm-instr"]

syscall-debug-info = [
    "akuma-syscalls/debug-info",
    "akuma-syscalls-time/debug-info",
    "akuma-exec/debug-info",
    # SYSCALL_DEBUG_INFO_ENABLED is `cfg!(feature = "syscall-debug-info")`, so the
    # crate needs the feature or the const reads false regardless of this one.
    "akuma-config/syscall-debug-info",
]

default = [
    # Real (shared-kernel) SMP is the default since 2026-08-10 — this is *the* SMP.
    # The multikernel (one-kernel-per-core) alternative was removed 2026-08-10 —
    # see docs/archive/TRIM_FAT_MULTIKERNEL.md.
    "smp-shared",
    "smoltcp",
    "sound",
    "fs-cache",
    "sc-aio", "sc-sysv-ipc", "sc-containers",
    "sc-timerfd", "sc-eventfd", "sc-pidfd", "sc-epoll",
    # Linux reboot(2) -> PSCI SYSTEM_RESET/SYSTEM_OFF. In `default` since
    # 2026-08-25 — see the `sc-reboot` feature definition below for why it was
    # gated and why that reason no longer applies.
    "sc-reboot",
]
no-tests = ["akuma-exceptions/no-tests", "akuma-exec/no-tests", "akuma-syscalls-glue/no-tests", "akuma-kernel-core/no-tests", "akuma-kernel-glue/no-tests", "akuma-kernel-tests-aarch64/no-tests"]

# Target Firecracker's aarch64 microVM instead of QEMU `virt`.
#
# Selects the machine description in `src/platform.rs`: guest RAM at 2 GiB, the
# PL011 at 0x4000_2000, virtio-mmio on a 0x1000 stride from 0x4000_3000 with
# INTID base 32, and the 0x4000_0000 identity block mapped Device
# (it is Firecracker's MMIO window, not RAM). Also moves KERNEL_PHYS_BASE to
# 0x8030_0000 — Firecracker loads at `get_kernel_start()` (0x8020_0000) plus the
# Image header's text_offset (1 MiB).
#
# The device *physical* addresses this sets are a bootstrap map only; the real
# ones come from the FDT at runtime, because Firecracker's GIC redistributor base
# depends on vCPU count. See docs/archive/FIRECRACKER_PORT.md.
platform-firecracker = ["akuma-config/platform-firecracker", "akuma-virtio/platform-firecracker", "akuma-kernel-glue/platform-firecracker", "akuma-kernel-tests-aarch64/platform-firecracker"]


# Real (shared-kernel) SMP / classic symmetric multiprocessing. NOT in `default`:
# all shared-kernel secondary bringup + the shared scheduler/locking live behind
# `cfg(kernel_smp_shared)`, which build.rs emits only when this feature is set (via
# CARGO_FEATURE_SMP_SHARED). Built with plain `--release`. Every core shares one
# kernel image, one PMM/heap, and one run queue under real cross-core locks. See
# docs/reference/subsystems/smp-shared.md and docs/archive/SMP_SHARED.md. The
# experimental one-kernel-per-core alternative (`smp`) was removed 2026-08-10 —
# docs/archive/TRIM_FAT_MULTIKERNEL.md.
# Also runs five syscall families without the Big Kernel Lock — network, VFS,
# fork's page copy, mm and the drivers (Phases 2-6 of
# docs/archive/BKL_FINE_GRAINED_LOCKING_PLAN.md) — and turns on the IRQ masking
# in `PreemptGuard` that makes that safe. Each was its own `no-bkl-*` feature until
# 2026-11-11, when they were folded in: every shipped build had all of them on,
# and A/B is the runtime toggles in `akuma_bkl::policy` (same binary, no
# rebuild). `docs/archive/AKUMA_FEATURE_AUDIT.md` F2.
# Measurement only: `test_epoll_socket_waker` prints when its waker started, when it called
# `wake_all`, when the waiter returned, and on which cores (`[epoll-waker-trace]`). Off everywhere.
epoll-waker-trace = ["akuma-kernel-tests-aarch64/epoll-waker-trace"]
smp-shared = ["akuma-exec/smp-shared", "akuma-vfs-glue/smp-shared", "akuma-exceptions/smp-shared", "akuma-gic/smp-shared", "akuma-net/smp-shared", "akuma-primitives/smp-shared", "akuma-ext2/smp-shared", "akuma-syscalls-glue/smp-shared", "akuma-kernel-core/smp-shared", "akuma-kernel-glue/smp-shared", "akuma-kernel-tests-aarch64/smp-shared"]

# BKL-hold attribution (measurement builds only — never ship it). Enables the
# per-tag BKL profiler in `akuma_exec::sync` for the whole boot and makes the
# async-main loop print a periodic `[BKLPROF]` delta histogram: which syscall /
# fault / IRQ-scheduler excursion the *holding* core was in while peers spun.
# This is the input that decides whether more BKL carve-outs are worth it (the
# Phase 0 estimate that scheduler/IRQ holds ~70% of contended time was never
# measured under a real userspace workload). Costs a shared-line store on every
# kernel entry, so it perturbs timing-sensitive tests — keep it out of
# `smp-shared` and enable it explicitly:
#   cargo build --release --features devbox-smoltcp,no-tests,bkl-profile
bkl-profile = ["akuma-kernel-core/bkl-profile", "akuma-kernel-glue/bkl-profile", "akuma-kernel-tests-aarch64/bkl-profile"]

# Device-level NIC instrumentation (measurement builds only — never ship it).
# Forwards `akuma-net/net-profile`, which counts per-packet RX/TX/poll timing
# and bytes at the virtio-net boundary, and makes the async-main loop print a
# windowed `[NICSTAT]` delta line. This is the input for "why is a network round
# trip N microseconds" — the BKL profiler above answers "which syscall held the
# lock", which is a different question and cannot separate device time from
# stack time. Costs two CNTVCT reads per packet, so it perturbs the very path it
# measures: read the RATIOS between counters, not the absolute throughput of a
# run made with it on. Enable explicitly:
#   cargo build --release --features devbox-smoltcp,no-tests,net-profile
# Parsed by scripts/benchmarks/bench_nic_rtt.py.
net-profile = ["akuma-net/net-profile", "akuma-kernel-core/net-profile", "akuma-kernel-glue/net-profile", "akuma-kernel-tests-aarch64/net-profile"]

# Per-stage `read(2)` fixed-cost attribution (measurement builds only — never
# ship it). Makes `sys_read`'s `File` arm, `handle_syscall` and the EL0 handler
# time themselves and print a `[READPROF]` line every 1024 file reads: which
# part of the ~17 us that a warm 8 KB read costs is validation, fd lookup, the
# staging allocation, ext2, the user copy, or the two wrappers around them.
# The BKL profiler answers "which syscall held the lock" and `net-profile`
# answers "how long was the device busy"; neither can split a single syscall.
# Costs two CNTVCT reads per stage on the read path and is single-core only
# (the wrapper spans are handed up by one flag) — run it with `SMP=1`:
#   cargo build --release --features read-profile
# Read `cal=` before believing any stage: it is the cost of the measurement.
read-profile = ["akuma-syscalls-glue/read-profile"]



# Rump-kernel support: a raw L2 packet path so a userspace NetBSD rump TCP/IP
# stack can send/receive Ethernet frames. Binds a SECOND virtio-net device
# (NIC1) and exposes it as /dev/net/tap0 (open/read/write whole frames + a
# no-op TUN/TAP ioctl), leaving NIC0 on the native smoltcp stack. OFF by
# default since 2026-11-11; build with `--features rump` (acceptance 11) or
# `rump-default` (the rump devbox). A rump build always runs the rump
# regression guards at boot, `no-tests` or not (`rump-tests` folded in). NIC1
# itself only exists when the QEMU runner is started with RUMP_NIC=1; without
# it, tap init no-ops and /dev/net/tap0 returns ENODEV.
rump = ["akuma-net/rump", "dep:akuma-rump", "akuma-syscalls-glue/rump", "akuma-kernel-glue/rump", "akuma-kernel-tests-aarch64/rump"]

# Linux `reboot(2)` -> PSCI SYSTEM_RESET/SYSTEM_OFF (src/syscall/reboot.rs).
# In `default` since 2026-08-25 (so plain `release` carries it too; nr 142 was
# ENOSYS there before). Originally gated devbox-only because the plan was to
# land it together with a self-hosted kexec-style warm reboot — kexec was
# scoped and rejected (docs/archive/AKUMA_BOOT_EXTRACTION.md; the running-kernel
# state is the wrong shape for `boot.rs`'s clean-boot assumptions), leaving a
# plain PSCI reset with no kexec counterpart to cluster with, so there's no
# reason left to keep it out of `default`. `extreme-size` still excludes it
# (that build passes `--no-default-features` with its own explicit feature
# list, which doesn't name `sc-reboot`) — the 4 MB floor has no self-host
# workflow to serve. Exists for the self-host workflow
# (docs/runbooks/selfhost-kernel-build.md): rebuild the kernel in-guest, dd it
# over the file backing both `-kernel` and a virtio-blk drive
# (scripts/cargo_runner.sh's KERNEL_DROPOFF), then reboot(2) straight into the
# new build instead of a host-side extract + relaunch cycle.
#
# No longer depends on `smp-shared`, as of 2026-09-01. It used to: `reboot.rs`
# called `crate::smp_shared::system_reset` for the PSCI SMC/HVC plumbing, and
# that module only exists under `smp-shared` (`#[cfg(kernel_smp_shared)]`,
# src/main.rs), so any `--no-default-features` build listing `sc-reboot` without
# it failed with "cannot find `smp_shared` in `crate`". The coupling was a build
# fix, never a capability choice — `smp_shared` owned the conduit only because
# it needed `CPU_ON` for secondary bring-up.
#
# `system_reset`/`system_off` now live in `akuma-boot`, over the `akuma-psci`
# conduit, so the syscall no longer names `smp_shared` at all
# (`docs/archive/AKUMA_SMP_SHARED_SPLIT.md`). NOTE this means `devbox`
# (rump-only, deferred) no longer picks up `smp-shared` transitively — it never
# asked for it, but if that build is ever meant to have real SMP it must now say
# so explicitly.
sc-reboot = ["dep:akuma-boot", "akuma-vfs-glue/sc-reboot", "akuma-syscalls-glue/sc-reboot"]
# The native smoltcp TCP/IP stack (NIC0): the in-kernel socket syscalls, DNS/HTTP,
# and the built-in SSH server are all built on it. In `default`; the devbox build
# drops it (rump is the only stack) via --no-default-features, which compiles the
# whole smoltcp path — and the smoltcp-coupled built-in SSH — out. Enables the
# matching akuma-net feature.
smoltcp = ["dep:smoltcp", "akuma-net/smoltcp", "akuma-syscalls-glue/smoltcp", "akuma-kernel-core/smoltcp", "akuma-kernel-glue/smoltcp", "akuma-kernel-tests-aarch64/smoltcp"]

# virtio-sound output driver (src/audio.rs + /dev/dsp). Enabled by default;
# dropped by the size/extreme profiles' `--no-default-features` builds. The one
# thing that still compiles `virtio-drivers` (through `akuma-virtio/sound`): blk
# and net are driven in-tree. Designed to be small/bounded enough to opt back
# into `extreme` (4 MB) via `--features sound`.
sound = ["akuma-virtio/sound", "akuma-kernel-glue/sound", "akuma-kernel-tests-aarch64/sound"]

# Use the legacy GICv2 MMIO interrupt-controller driver (src/gic.rs) instead of
# the default GICv3 driver (src/gic_v3.rs). GICv2 works under QEMU TCG
# (`-machine virt` defaults to gic-version=2) but faults under QEMU HVF on Apple
# Silicon, where only the GICv3 system-register CPU interface exists. Build the
# kernel with `gic-version=3` in the QEMU command line when using the default
# (GICv3) driver — see scripts/cargo_runner.sh.

# Profile discriminator (NOT a syscall gate). build_extreme_size.sh enables it so
# build.rs can pick a tighter IMAGE_SIZE / STACK_BOTTOM than the `size` profile.
# build.rs reads it via CARGO_FEATURE_EXTREME and emits cfg(kernel_profile_extreme).
# Forwarded to akuma-exec and akuma-ext2 so their build.rs emits the same cfg
# (warm-stack floor + kernel-stack right-sizing in akuma-exec; block-cache gate
# in akuma-ext2).
extreme = ["akuma-exec/extreme", "akuma-ext2/extreme", "akuma-primitives/extreme", "akuma-vfs-glue/extreme", "akuma-config/extreme", "akuma-syscalls-glue/extreme", "akuma-kernel-core/extreme", "akuma-kernel-glue/extreme", "akuma-kernel-tests-aarch64/extreme"]

# Large RAM-sized ext2 block cache with clock eviction (crates/akuma-ext2). Keeps
# the read-only toolchain resident across the many process spawns in a self-host
# `cargo build`, instead of re-reading it off virtio-blk per spawn. The cache cap
# is auto-derived from detected RAM at mount (`min(RAM/8, 384 MB)`, src/fs.rs).
#
# In `default` since 2026-08-02. Without it `akuma-ext2` falls back to
# `BlockRingCache`: 64 slots / 256 KB, FIFO, linear-scan lookup. That is far
# smaller than a single demand-fault's 1 MB readahead, so a fault evicts its own
# double-indirect blocks ~4x while filling, and every page of a >4 MB file costs
# two extra indirect block reads off virtio-blk. Measured on the rustc workload
# (`docs/archive/BKL_RUSTC_SCALING_BASELINE.md`): `rustc --version` — zero
# compilation — spent 1.43 s in 118 instruction-abort demand-page faults, 12.1 ms
# each, against `librustc_driver` (63 MB) + `libLLVM` (176 MB).
#
# The `size`/`extreme` builds pass --no-default-features and do not re-add this,
# so they are unaffected. Never combined with `extreme` (the 4 MB profile has no
# cache at all) — akuma-ext2's build.rs gates the cfg on that.
fs-cache = ["akuma-ext2/fs-cache", "akuma-kernel-tests-aarch64/fs-cache"]

# Per-family syscall gates. Default-on so `cargo build`/`run`/`test` keep every
# syscall; the minimal builds use --no-default-features and re-add what they want.
# Tier 1 — pure dead weight, no akuma-exec callbacks.
sc-aio          = ["akuma-syscalls-glue/sc-aio"]
sc-sysv-ipc     = ["dep:akuma-syscalls-ipc", "akuma-vfs-glue/sc-sysv-ipc", "akuma-syscalls-glue/sc-sysv-ipc"]
sc-containers   = ["akuma-vfs-glue/sc-containers", "akuma-syscalls-glue/sc-containers", "akuma-isolation/containers", "akuma-kernel-tests-aarch64/sc-containers"]
sc-timerfd      = ["akuma-syscalls-glue/sc-timerfd"]
# Tier 2 — each needs a no-op ExecRuntime callback stub when off (see main.rs).
sc-eventfd      = ["akuma-syscalls-glue/sc-eventfd", "akuma-kernel-glue/sc-eventfd"]
sc-pidfd        = ["akuma-syscalls-glue/sc-pidfd", "akuma-kernel-glue/sc-pidfd", "akuma-kernel-tests-aarch64/sc-pidfd"]
sc-epoll        = ["akuma-syscalls-glue/sc-epoll", "akuma-kernel-glue/sc-epoll", "akuma-kernel-tests-aarch64/sc-epoll"]

# ── devbox: rump as the DEFAULT network stack + no built-in SSH ──────────────
# Register the NetBSD rump TCP/IP stack as the default stack for box 0 (the root
# box every process starts in), rather than only for an explicit `stack=rump`
# herd box. When on, the kernel at boot marks box 0 rump and brings up its
# rump_server (over /dev/net/tap0, so it needs RUMP_NIC=1) — see
# `rump_proxy::start_default_stack`. Every unboxed process's AF_INET syscalls
# then route to rump with no herd box + no `join_box` needed. Implies `rump`.
rump-default = ["rump", "akuma-kernel-glue/rump-default"]

# Disable the built-in (in-kernel, smoltcp) SSH server so the ONLY sshd is the
# userspace /bin/sshd started by herd. Drives `config::ENABLE_USERSPACE_SSHD`
# (src/config.rs) via cfg!(feature = ...). Off by default (the normal image
# keeps its built-in SSH). The devbox needs this: with rump the default stack,
# the built-in server (which is smoltcp-only) would be the one thing still on
# the native stack.
userspace-sshd = ["akuma-config/userspace-sshd"]
# The minimal self-hosting kernel (docs/archive/MINIMAL_SELF_HOSTING_EXPERIMENT.md):
# the composition root's name in the tree. Build with --no-default-features plus a
# platform feature (scripts/build_taoxichuan_fc.sh). One line per stage that pulls a crate.
taoxichuan = ["no-tests", "extreme", "userspace-sshd"]


# ── devbox-smoltcp: the DEFAULT devbox going forward ─────────────────────────
# A dev image on the NATIVE smoltcp stack (NOT rump — rump_server work is
# deferred), with the built-in in-kernel SSH dropped (`userspace-sshd` → the
# userspace /bin/sshd from herd serves SSH over smoltcp instead) and real
# shared-kernel SMP (`smp-shared`). The INVERSE of `devbox` (rump-default):
# keep smoltcp, drop the built-in ssh, add real SMP. Built with the
# plain `--release` by scripts/build_devbox_smoltcp.sh and layered on
# the default (smoltcp-carrying) feature set — which is also where it now gets
# `sc-reboot` from, since unlike `devbox` this build does NOT pass
# `--no-default-features`. Because smoltcp stays in, the
# `userspace-sshd` compile guard in main.rs is satisfied. See
# docs/reference/subsystems/smp-shared.md and overlays/devbox/README.md.
devbox-smoltcp = ["userspace-sshd", "smp-shared"]

[lints]
workspace = true

[dependencies]
# The safe-to-execute AArch64 instructions (barriers, cache/TLB maintenance, core
# parking, DAIF, read-only system registers) behind safe `#[inline(always)]`
# functions, so the trivially-dischargeable `unsafe` blocks live in one crate
# instead of at every call site. Zero dependencies of its own.
# The kernel's compile-time tunables. A crate rather than `src/config.rs` so
# crates fold against the consts instead of being handed them at runtime — see
# its header for why that mattered and why it is not in `akuma-primitives`.
akuma-config = { path = "crates/akuma-config" }
akuma-cpu = { path = "crates/akuma-cpu" }
akuma-tty = { path = "crates/akuma-tty" }
akuma-vfs = { path = "crates/akuma-vfs" }
akuma-ext2 = { path = "crates/akuma-ext2" }
# The recoverable lock protocol — the kernel registers its waiter-side backstop in
# `src/fs.rs` (the one upward wire, AKUMA_EXT2_CLEANUP.md §4.5).
akuma-locks-rw = { path = "crates/akuma-locks-rw" }
akuma-net = { path = "crates/akuma-net", default-features = false }
# The AF_UNIX state machine. A dependency in its own right, not reached through
# akuma-net: it is IPC over pipes with no NIC, no IP and no smoltcp, and the
# rump-only devbox needs it whether or not the native stack is compiled in.
akuma-net-unix = { path = "crates/akuma-net-unix" }
# The readiness wait loop as a pure state machine. Used directly by
# `src/syscall/poll.rs` (epoll_pwait / pselect6 / ppoll) as well as through
# akuma-net's `wait_until`, so the kernel depends on it in its own right.
akuma-net-yarn = { path = "crates/akuma-net-yarn" }
# virtio Hal + MMIO probe + the block/rng/audio drivers.
akuma-virtio = { path = "crates/akuma-virtio" }
# `elf-loader`: this kernel loads binaries through `akuma-exec` (execve, spawn).
akuma-exec = { path = "crates/akuma-exec", features = ["elf-loader"] }
# The exception path: vector table, EL0/EL1 trap handlers, EL0 syscall entry,
# CoW breaks, demand paging, signal delivery. Extracted from
# `src/exceptions.rs` 2026-09-01 — `docs/archive/AKUMA_EXCEPTIONS_EXTRACTION.md`.
# It cannot take `#![forbid(unsafe_code)]` (a vector table is hand-written asm
# by definition); its stated safety contract lives at the top of its lib.rs,
# in the shape `akuma-net-nic`'s DMA contract and `akuma-gic`'s MMIO contract
# use. Reaches kernel-core state (the syscall dispatcher, the IRQ dispatcher,
# the EL0-trap diagnostic, config tunables) exclusively through the
# `ExceptionHooks`/`ExceptionsConfig` registrations in `src/main.rs`.
akuma-exceptions = { path = "crates/akuma-exceptions" }
# The Chief: observe/decide/hysteresis primitives shared by every self-tuning
# policy in the tree (timer-tick demotion, file-page cache cap, netpoll wake
# rate). Takes reports, issues verdicts, never touches hardware.
# The shared read-only file-page cache, extracted from `src/file_page_cache.rs`
# 2026-09-01. `src/file_page_cache.rs` remains as a shim that supplies the
# `src/config.rs` tunables and re-exports the rest.
# Reached directly, not through `akuma_exec::bkl`: `src/smp_shared.rs` re-exports
# `akuma_bkl::policy` (the BKL-drop toggles), and routing a policy module through
# the exec crate that does not read it would be indirection for its own sake.
# The GICv3 driver, consolidated from `src/gic.rs` + `src/gic_v3.rs` + the
# redistributor half of `src/smp_shared.rs` on 2026-09-01.
# The PSCI conduit (smc/hvc). A sibling of `akuma-boot` rather than part of it:
# `akuma-boot` decodes `reboot(2)` under `#![forbid(unsafe_code)]`, and an `smc`
# would have cost it that ban.
akuma-psci = { path = "crates/akuma-psci" }

akuma-gic = { path = "crates/akuma-gic" }
akuma-bkl = { path = "crates/akuma-bkl" }
akuma-fpcache = { path = "crates/akuma-fpcache" }
akuma-kacho = { path = "crates/akuma-kacho" }
# The unsafe-free half of this bin crate: config/timer/irq/pmm/fs shims, klog,
# boot-time SNTP, the bkl-profile/net-profile dumps. Extracted 2026-09-01 so it
# could carry `#![forbid(unsafe_code)]` — see its lib.rs header for the three
# modules that moved to `akuma-kernel-glue` instead (they call into
# `smp_shared`/`console`, which cannot live in a `forbid` crate).
akuma-kernel-core = { path = "crates/akuma-kernel-core" }
# The unsafe half: boot assembly, secondary-core bring-up, the UART console,
# the platform/machine description, the rump sysproxy client, and the
# kernel_main/async-main orchestration. Extracted 2026-09-01, on top of
# `akuma-kernel-core`. `src/` keeps only the crate-root-mandatory items
# (global allocator, alloc-error handler, panic handler) and `entry!`.
akuma-kernel-glue = { path = "crates/akuma-kernel-glue" }
# The arch-neutral front: `entry!` defines `rust_start` and hands it to glue's `start`.
akuma-kernel = { path = "crates/akuma-kernel" }
# The boot self-test suite, moved out of `src/`; `entry!`'s `before_main` registers it. Its
# features are flags forwarded from this manifest's same-named ones.
akuma-kernel-tests-aarch64 = { path = "crates/akuma-kernel-tests-aarch64" }
# Physical memory manager: bitmap allocator, frame tracking, UAF quarantine,
# free/CoW event ledgers. `src/pmm.rs` is now a thin shim over this crate.
akuma-alloc = { path = "crates/akuma-alloc" }
akuma-uart = { path = "crates/akuma-uart" }
akuma-pmm = { path = "crates/akuma-pmm" }
# The exception entry module's GPR-transparency probe, called by the boot suite.
akuma-entry = { path = "crates/akuma-entry" }
# FreshFrame: staged pages in the CoW-break boot test.
akuma-phys = { path = "crates/akuma-phys" }
# The dependency-free leaf: `OnceCopy`, the one stack writer + `safe_print!`.
akuma-primitives = { path = "crates/akuma-primitives" }
# Kernel-side sysproxy client (rumpsp wire + Linux↔NetBSD translation); only the
# `rump` feature needs it directly (akuma-net already pulls it for rump_tap).
akuma-rump = { path = "crates/akuma-rump", optional = true }
# Linux reboot(2) ABI decode for the devbox-only `sc-reboot` syscall
# (src/syscall/reboot.rs); the PSCI SMC call itself stays in smp_shared.rs.
# Named `-boot`, not `-reboot`: a natural future home for src/boot.rs's logic too.
akuma-boot = { path = "crates/akuma-boot", optional = true }
akuma-isolation = { path = "crates/akuma-isolation", default-features = false }
# Machine description read from the FDT at run time. Required, not optional:
# Firecracker's GIC redistributor base moves with `vcpu_count`, so no
# compile-time constant can address it (docs/reference/firecracker/README.md
# §3.3). Platform-neutral — it parses QEMU virt's tree too.
akuma-firecracker = { path = "crates/akuma-firecracker" }
# The one place a boot pointer becomes a device tree. Every FDT consumer in the
# kernel (RAM detection, the device map, SMP topology) goes through it, so the
# `unsafe` that materialises the blob exists once instead of in each of them.
akuma-fdt = { path = "crates/akuma-fdt" }
talc = "4"
spinning_top = "0.3"

# The `log` facade, so `src/klog.rs` can install a console sink for the
# statements `akuma-net`/smoltcp already emit. `default-features = false` drops
# `std`; no `max_level_*` feature here on purpose — filtering is the sink's job,
# and a compile-time cap cannot be undone at runtime.
log = { version = "0.4", default-features = false }
smoltcp = { version = "0.12.0", default-features = false, features = ["proto-ipv4", "socket-tcp", "socket-udp", "medium-ethernet", "alloc", "async", "socket-dhcpv4"], optional = true }
akuma-timer = { path = "crates/akuma-timer" }
# Time syscalls (clock_gettime/settime, itimers, adjtimex) and the boot-time
# SNTP fallback for platforms with no RTC (Firecracker) — extracted from
# src/syscall/time.rs, see docs/archive/MISSING_NTP_SYSCALLS.md.
akuma-syscalls-time = { path = "crates/akuma-syscalls-time" }
# The Linux/aarch64 syscall ABI: the `nr::` number table, the repr(C) wire
# structs and their layout assertions, and the flag tables — all host-tested,
# none of which was possible while they lived in this bin crate
# (proposals/syscall-abi-and-shape-crates.md). Not optional: `nr::` is the
# dispatch table, so every build target needs it.
akuma-syscalls-linux = { path = "crates/akuma-syscalls-linux" }
# Crate 2 of the same pair: the SHAPE of an excursion — the generic
# prologue/epilogue decisions `handle_syscall` makes around the family dispatch,
# with the effects left here. Pure data and `const fn`s, so it inlines away;
# that is a requirement, not a happy accident (docs/archive/
# AKUMA_EXTRACT_SYSCALLS.md §7 — the dispatch is the hottest function here).
akuma-syscalls = { path = "crates/akuma-syscalls" }

# The syscall dispatcher and its families. Was `src/syscall/` — see
# docs/archive/SRC_SYSCALL_EXTRACTION.md.
akuma-syscalls-glue = { path = "crates/akuma-syscalls-glue", default-features = false, features = ["exec", "akuma-native"] }

# Per-pid syscall trace rings behind `/proc/<pid>/syscalls`. Split out of
# `src/syscall/` so `src/vfs/proc.rs` can read them without `src/vfs/` depending
# on `src/syscall/`, which reads 37 symbols back the other way — see
# docs/archive/SRC_SYSCALL_EXTRACTION_SURVEY.md Blocker 1.
akuma-syscalls-log = { path = "crates/akuma-syscalls-log" }

# The kernel-side VFS layer (mount table, per-box namespaces, /proc). Was
# `src/vfs/`; see docs/archive/SRC_SYSCALL_EXTRACTION_SURVEY.md.
akuma-vfs-glue = { path = "crates/akuma-vfs-glue" }

# The SysV message-queue family. Split out for the same cycle as -log: /proc
# lists the queues. Optional and gated on `sc-sysv-ipc` exactly as the module it
# replaced was, so `extreme-size` (--no-default-features) still compiles none of
# it — the crate split must not quietly re-add ~440 lines to the 4 MB floor.
akuma-syscalls-ipc = { path = "crates/akuma-syscalls-ipc", optional = true }
# The futex family's pure logic: op decode, the (tgid, uaddr) waiter table, the
# deadline algebra, the WAKE_OP opcode and the wait loop's outcome decision. A
# family implementation on the akuma-syscalls-time model (AKUMA_EXTRACT_SYSCALLS.md
# §8), taken first because every futex bug in docs/archive/ is a property of one
# of those four things and each one previously cost a -j4 self-host build to find.
akuma-syscalls-signal = { path = "crates/akuma-syscalls-signal" }
akuma-syscalls-sync = { path = "crates/akuma-syscalls-sync" }
# The epoll/poll/select family's pure logic: the fd-state -> event-bits
# readiness map, the interest list and its epoll_ctl errno set, the EPOLLET
# armed-state decision, and the ppoll/pselect6 wire marshalling. The second
# family implementation (AKUMA_EXTRACT_SYSCALLS.md §8.2), taken because every
# epoll incident in BUG_FIX_LIST.md except the lock inversion is one of those
# four things, and each one previously cost a live VM and a network client to
# find. The wait loop is NOT here — it is `akuma-net-yarn`, and this extraction
# stops at the readiness edge.
akuma-syscalls-poll = { path = "crates/akuma-syscalls-poll" }

# The memory family's pure decisions: mmap's mapping-kind plan and MAP_FIXED
# validation, mremap's move-vs-expand decision, madvise's advice decode and
# MADV_DONTNEED's per-page rule, munmap's sizing, membarrier's command decode.
# The third family (AKUMA_EXTRACT_MMAP.md §7). Unlike the region bookkeeping in
# `akuma-mmap`, this crate never sees a `MmapRegion` — the mapping-kind decision
# is a function of the argument bits alone, which is what keeps it a leaf beside
# `-sync` and `-poll` rather than a dependant of `akuma-exec`.
akuma-syscalls-mem = { path = "crates/akuma-syscalls-mem" }
akuma-reclock = { path = "crates/akuma-reclock" }
embedded-io-async = { version = "0.6", default-features = false }


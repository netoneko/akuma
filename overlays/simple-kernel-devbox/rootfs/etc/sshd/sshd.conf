# simple-kernel-devbox userspace sshd config (/etc/sshd/sshd.conf; parsed by
# userspace/sshd).
#
# Auth model: a DEFAULT sshd build (userspace/build.sh --sshd-only, what
# bootstrap.sh stages) IGNORES disable_key_verification and always requires
# publickey auth — ed25519 only, RSA is rejected (see
# userspace/sshd/src/auth.rs; docs/reference/subsystems/ssh.md § Auth model).
# The flag only takes effect in an `insecure-disable-key-verification` build,
# which this image deliberately does NOT use.
#
# bootstrap.sh stages your host's ~/.ssh/id_ed25519.pub (or
# $SIMPLE_KERNEL_SSH_PUBKEY) into /etc/sshd/authorized_keys at image-build
# time. To swap keys later, mount the image with the same docker trick
# bootstrap.sh uses and rewrite that one file.
disable_key_verification = false

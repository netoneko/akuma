# simple-kernel-devbox sshd — the ONLY sshd on the image (the built-in in-kernel
# SSH server does not exist in the tree; it was deleted 2026-08-10, see
# docs/archive/BUILTIN_SSH_REMOVAL.md).
#
# The kernel this image boots is built with the `no-tests`
# feature set (overlays/simple-kernel-devbox/run.sh), so box 0 is on the NATIVE
# smoltcp stack and /bin/sshd runs UNBOXED (no `boxed`, no `join_box`): its
# listen/accept — and every process spawned from the session (shells, cargo,
# apk) — rides smoltcp like any other process. QEMU forwards host :2222 ->
# guest :22 (scripts/cargo_runner.sh default):
#   ssh -o StrictHostKeyChecking=no -p 2222 root@localhost
#
# start_delay_ms = 0 is correct here for the same reason it is for the
# devbox-smoltcp enabled config: smoltcp's network init runs synchronously in
# kernel_main and prints "Network Initialization Done" before herd is even
# started, so there is nothing to wait out. restart=true backstops any
# residual race.
command = /bin/sshd
args = --port 22 --shell /bin/sh
start_delay_ms = 0
restart = true
max_retries = 0

# Dependency set vendored into the rust image's offline registry cache
# (/opt/cargo-vendor, wired by /root/.cargo/config.toml). A service that uses
# other crates (or other versions) cannot build offline: extend this list and
# rebuild the image. Cargo.lock is committed so the vendored tree is the same
# every build.
[package]
name = "eco-rust-deps"
version = "0.0.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[[bin]]
name = "unused"
path = "src/main.rs"

[workspace]

# Throwaway guest to trace codex's exec_command SIGTERM: the running host kernel as the guest, with the
# kernel's own syscall trace on (strace_err = every failing call; strace_nr = every kill/tkill/tgkill).
# Image is the RAM-copied vm-dev root, so nothing persists. ssh on host port 2224.
vm = true
vm_type = kvm
vm_kernel = /boot/akuma-amd64
vm_disk = /boot/akuma-dev-root-ssh.img
vm_ram_mib = 1536
vm_vcpus = 2
vm_forward = 2224:22
vm_outbound = true
vm_cmdline = init=/bin/sshd initargs=--port,22 smp=2 strace_err strace_nr=62,200,234
restart = false

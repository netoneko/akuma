# codex's code-mode host as a long-lived gRPC service on :47200 (loopback). codex spawning it
# itself over grpc+stdio:// dies on first use here; codex is pointed at this one instead
# (CODE_MODE_HOST=http://127.0.0.1:47200, features.code_mode_host=true in ~/.codex/config.toml).
command = /bin/sh
args = /usr/local/bin/codex-code-mode-host-serve
restart = true
restart_delay = 3000
env = HOME=/root

# vm-serve with two virtual processors on two dedicated host cores (kernel: kvmcores=1-7).
# Cores 2 and 4, not 2 and 3: on the ryzen adjacent cores are SMT siblings of one physical core
# and two guest loops on them ran at 63% each (9.3 s against 5.9 s); on 2,4 they ran in 6.1 s.
vm = true
vm_type = kvm
vm_kernel = /boot/akuma-guest
vm_disk = /boot/akuma-serve-root.img
vm_ram_mib = 768
vm_vcpus = 2
vm_cores = 2,4
vm_forward = 2223:22
vm_cmdline = init=/bin/busybox initargs=sh,/etc/guest.sh
restart = true
restart_delay_ms = 5000

# The power-saving daemon: /proc/power once a second, the console dim
# staircase on /dev/power. A keystroke resets `idle_ms` in the kernel, so the
# screen comes straight back; the daemon only steps down while nobody is
# typing. Its stdout is the decision log — one line per change
# (/var/log/herd/powersaved.log under herd). Tunables are argv:
#   after_ms=120000        move the first step
#   stage=ms:pct (repeat)  replace the whole staircase
#   period_ms=n            the poll period
#   base_pct=n             brightness while someone is active (default 100)
#
# ryzen runs at 80 %: the idle staircase (60 / 30 / 10) steps down from there, and a
# keystroke or a touch restores to 80, not 100.
command = /bin/powersaved
args = base_pct=80
restart = true
restart_delay = 5000

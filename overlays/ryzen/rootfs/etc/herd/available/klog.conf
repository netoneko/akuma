# Keep the kernel log on p3 while the box is up (menu entry 12): a hang still
# leaves its last five seconds in /var/log/ryzen/klog-N.dmesg, and the boot's
# [herd] lifecycle lines survive the ring wrapping in herd-N.log. /bin/klogd
# (userspace/klogd) replaced the busybox loop etc/ryzen/klog.sh.
command = /bin/klogd
restart = true
restart_delay = 5000

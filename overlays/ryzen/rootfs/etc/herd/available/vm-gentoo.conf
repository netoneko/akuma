# Gentoo (p7, the partition it already lives on) as a herd service on Akuma's hypervisor, used IN
# PLACE: the guest's writes are p7's, there is no RAM copy (so the reserve only has to hold the
# 768 MiB of guest RAM). The hypervisor lends p7 to the guest through a second, bounds-checked NVMe
# window and refuses the host's own partition. p7 needs /akuma-kvm-init.sh (overlays/ryzen/gentoo/)
# and must not be mounted anywhere else while the guest runs (Pop: unmounted; the old `gentoo` herd
# box lives in /opt/gentoo/root on p3 and is disabled). Back it up first: its filesystem is
# "clean with errors" and this config is never a repair.
# OpenSSH on the guest's port 4444 is host port 2223. AMD SVM only; boot entry 30 (kvmctl
# kvmmem=4096). One VM at a time: enable this OR vm-serve.conf. Copy to p3's herd/enabled/ by hand.
vm = true
vm_type = kvm
vm_kernel = /boot/akuma-guest
vm_disk = /dev/nvme0n1p7
vm_ram_mib = 768
vm_vcpus = 1
vm_forward = 2223:4444
vm_cmdline = init=/usr/bin/bash initargs=/akuma-kvm-init.sh
restart = true
restart_delay_ms = 5000

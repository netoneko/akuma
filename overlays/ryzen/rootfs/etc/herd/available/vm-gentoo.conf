# Gentoo (box 0's image, copied into RAM: its writes die with the guest) as a herd service on
# Akuma's hypervisor. OpenSSH on the guest's port 4444 is host port 2223. AMD SVM only; boot
# entry 30 (kvmctl kvmmem=4096: the 768 MiB of RAM and the image's copy both come out of it).
# One VM at a time: enable this OR vm-serve.conf. Copy to p3's herd/enabled/ by hand.
vm = true
vm_type = kvm
vm_kernel = /boot/akuma-guest
vm_disk = /boot/gentoo-guest.img
vm_disk_ram = true
vm_ram_mib = 768
vm_vcpus = 1
vm_forward = 2223:4444
vm_cmdline = init=/usr/bin/bash initargs=/akuma-kvm-init.sh
restart = true
restart_delay_ms = 5000

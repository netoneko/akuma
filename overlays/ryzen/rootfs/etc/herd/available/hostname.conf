# Name the machine `akuma-ryzen`, so `uname -n` / `hostname` tell it apart from the KVM guest
# it hosts (`akuma-kvm`, set by that guest's /etc/guest.sh). The kernel keeps the name in one
# global (sethostname(2)), so one oneshot is the whole job. Copy to p3's herd/enabled/ by hand
# (p3 does not take rootfs/).
command = /bin/busybox
args = hostname akuma-ryzen
oneshot = true

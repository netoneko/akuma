# The Akuma guest (sshd on its port 22, busybox) as a herd service: `herd` creates the VM through
# /dev/kvm0, supervises it, restarts it, and logs its console to /var/log/herd/vm-serve.log.
# ssh -p 2223 root@<host> reaches the guest's sshd. AMD SVM only; boot entry 30 (kvmctl).
# One VM at a time: enable this OR vm-gentoo.conf, not both. Copy to p3's herd/enabled/ by hand
# (p3 does not take rootfs/).
vm = true
vm_type = kvm
vm_kernel = /boot/akuma-guest
vm_disk = /boot/akuma-serve-root.img
vm_ram_mib = 768
vm_vcpus = 1
vm_forward = 2223:22
vm_cmdline = init=/bin/busybox initargs=sh,/etc/guest.sh
restart = true
restart_delay_ms = 5000

# The shell on the laptop's screen (menu entries 12 and 20 show it; herdr runs in it).
# HOME=/root is stated here on purpose: herd's default console environment has
# HOME=/, and /etc/akuma-dev.env only does `HOME=${HOME:-/root}`, so a console
# shell and everything started from it (herdr, claude, goose) kept its config in
# `/` while ssh sessions used /root — two places for every dotfile.
command = /bin/sh
console = true
restart = true
restart_delay = 1000
env = TERM=xterm-256color
env = HOME=/root
env = ENV=/etc/console.rc

# Embedded into overlays/ryzen's standalone grubx64.efi by install.sh (and by
# qemu.sh for the rehearsal). The default is entry 14, Akuma on wifi with 8
# cores (smp=8; 16 wedged the BKL on the metal, 2026-10-07), for use: nothing to select. (Until 2026-10-07 it was entry 0, which
# returns to Pop by itself; `arm.sh` with no argument still boots the default.)
# 16 cores needed the 8-core table limits in akuma-bkl/akuma-mmu/akuma-exec-core
# raised (docs/archive/AKUMA_AMD64_SMP_WIDTH.md); with an older kernel pick entry
# 12 (nosmp). The menu waits 5 s for a person.
#
# `root=/dev/nvme0n1p3` falls back to the RAM image (the module) whenever p3
# holds no ext2 — the mount checks the superblock magic before any write.
#
# The kernel comes from p3, Akuma's own root: `/boot/akuma-amd64`, which
# `kinstall` (scripts/install_kernel_amd64.sh) writes from inside Akuma. Akuma
# has no FAT, so the ESP copy can only be written from Pop; with the kernel on
# p3, build → kinstall → `reboot -f` needs no Pop round trip. p3 is found by its
# ext2 label; when the label or the file is missing (e.g. qemu.sh's rehearsal
# disk), `akk` stays the ESP copy, which `install.sh` still writes. Entries 21
# and 22 are the fallbacks: p3's `.prev` and the ESP copy. `akk` is exported
# because a menuentry body only sees exported variables.
insmod part_gpt
insmod fat
insmod ext2
insmod multiboot2
insmod all_video
search --no-floppy --file --set=root /EFI/akuma/akuma-amd64
set akk=/EFI/akuma/akuma-amd64
search --no-floppy --label --set=akp3 AKUMA-RYZEN
if [ -n "${akp3}" ]; then
    if [ -f "(${akp3})/boot/akuma-amd64" ]; then
        set akk="(${akp3})/boot/akuma-amd64"
    fi
fi
export akk
export akp3
# Entry 28's kernel: a kernel under test, left beside the live one as p3's
# `/boot/akuma-amd64.verify` (written from Pop), else `akk` — so the entry is
# harmless on a box with no `.verify`, and the rehearsal (qemu.sh, whose p3 has
# none) boots the freshly built kernel through `akk`.
set akv=${akk}
if [ -n "${akp3}" ]; then
    if [ -f "(${akp3})/boot/akuma-amd64.verify" ]; then
        set akv="(${akp3})/boot/akuma-amd64.verify"
    fi
fi
export akv
set timeout=5
set default=14
# One-shot entry selection, like systemd-boot's: `arm.sh <n>` writes
# next_entry=<n> into this grubenv from Pop; it is consumed here, so the boot
# after uses entry 0 again.
if [ -f /EFI/akuma/grubenv ]; then
    load_env --file /EFI/akuma/grubenv
    if [ -n "${next_entry}" ]; then
        set default="${next_entry}"
        set next_entry=
        save_env --file /EFI/akuma/grubenv next_entry
    fi
fi
menuentry "Akuma/amd64 unattended, NVMe root p3 (nosmp, logs, reboots to Pop; delay = NVMe stage)" {
    multiboot2 ${akk} init=/bin/herd initargs=daemon,--service,/etc/herd/enabled/sshd.conf,--service,/etc/herd/available/autoreboot.conf root=/dev/nvme0n1p3 wdt nosmp fbverbose
    module2 /EFI/akuma/root.img
}

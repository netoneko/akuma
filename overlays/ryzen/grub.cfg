# Embedded into overlays/ryzen's standalone grubx64.efi by install.sh (and by
# qemu.sh for the rehearsal). Entry 0 is what an unarmed, unwatched one-shot
# boots: it returns to Pop by itself. The menu waits 5 s for a person.
#
# `root=/dev/nvme0n1p3` falls back to the RAM image (the module) whenever p3
# holds no ext2 — the mount checks the superblock magic before any write.
insmod part_gpt
insmod fat
insmod multiboot2
insmod all_video
search --no-floppy --file --set=root /EFI/akuma/akuma-amd64
set timeout=5
set default=0
menuentry "Akuma/amd64 unattended, NVMe root p3 (nosmp, logs, reboots to Pop; delay = NVMe stage)" {
    multiboot2 /EFI/akuma/akuma-amd64 init=/bin/herd initargs=daemon,--service,/etc/herd/enabled/sshd.conf,--service,/etc/herd/available/autoreboot.conf root=/dev/nvme0n1p3 nosmp fbverbose
    module2 /EFI/akuma/root.img
}
menuentry "Akuma/amd64 NVMe root p3 (nosmp, verbose)" {
    multiboot2 /EFI/akuma/akuma-amd64 init=/bin/herd root=/dev/nvme0n1p3 nosmp fbverbose
    module2 /EFI/akuma/root.img
}
menuentry "Akuma/amd64 unattended, RAM root (nosmp, reboots to Pop; delay = NVMe stage)" {
    multiboot2 /EFI/akuma/akuma-amd64 init=/bin/herd initargs=daemon,--service,/etc/herd/enabled/sshd.conf,--service,/etc/herd/available/autoreboot.conf nosmp fbverbose
    module2 /EFI/akuma/root.img
}
menuentry "Akuma/amd64 self-tests, RAM root (nosmp)" {
    multiboot2 /EFI/akuma/akuma-amd64.tests init=/bin/herd nosmp fbverbose
    module2 /EFI/akuma/root.img
}
menuentry "Akuma/amd64 headless, NVMe root p3 (nofb, nosmp, logs, reboots; delay = NVMe stage)" {
    multiboot2 /EFI/akuma/akuma-amd64 init=/bin/herd initargs=daemon,--service,/etc/herd/enabled/sshd.conf,--service,/etc/herd/available/autoreboot.conf root=/dev/nvme0n1p3 nofb nosmp
    module2 /EFI/akuma/root.img
}
menuentry "Akuma/amd64 NVMe root p3 (SMP)" {
    multiboot2 /EFI/akuma/akuma-amd64 init=/bin/herd root=/dev/nvme0n1p3 fbverbose
    module2 /EFI/akuma/root.img
}
menuentry "Back to firmware (reboot)" {
    reboot
}

# Install this instance's launch key as an sshd authorized key, once per boot.
# The script and its reasons: /sbin/instance-key.
#
# Unboxed and as root on purpose: the kernel lets only uid 0 in the host box
# reach the metadata address. sshd reads authorized_keys on every login
# attempt, so there is no ordering to arrange between this and sshd.
command = /bin/sh
args = /sbin/instance-key
oneshot = true
restart = false
start_delay_ms = 0

# Public resolvers reached via the default route -> rump -> QEMU SLIRP -> internet.
# (SLIRP's built-in forwarder 10.0.2.3 returns empty answers behind some host VPNs.)
# In the devbox these UDP DNS queries go through the rump stack, since meow is built with
# --features linux-net (ordinary UDP-socket DNS, intercepted into the rump box).
nameserver 8.8.8.8
nameserver 1.1.1.1

# Devbox userspace sshd config (/etc/sshd/sshd.conf; parsed by userspace/sshd).
#
# disable_key_verification: only takes effect in a binary built with the
# `insecure-disable-key-verification` Cargo feature (off by default — see
# userspace/sshd/src/auth.rs). A default build (userspace/build.sh --sshd-only,
# what bootstrap.sh uses) IGNORES this flag and always requires publickey auth,
# so leave it false here — it's inert either way, but false says what actually
# happens. To connect you must drop your own ed25519 pubkey (RSA is rejected)
# in /etc/sshd/authorized_keys — see docs/runbooks/build-devbox.md § Connect.
disable_key_verification = false

# Devbox userspace sshd config (/etc/sshd/sshd.conf; parsed by userspace/sshd).
#
# disable_key_verification: this is a LOCAL dev VM reachable only via the host
# port-forward (run.sh: host 2223 → guest 22 on the rump NIC), so accept the
# connection without a public key in /etc/sshd/authorized_keys — matching the
# documented `ssh -o StrictHostKeyChecking=no -p 2223 root@localhost` flow with
# no key setup. The host key is auto-generated on first boot at
# /etc/sshd/id_ed25519. To require a key instead, set this false and drop your
# pubkey in /etc/sshd/authorized_keys.
disable_key_verification = false

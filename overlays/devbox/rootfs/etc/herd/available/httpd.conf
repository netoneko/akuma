# Static HTTP server on 8080, serving /public (CGI from /public/cgi-bin).
#
# Port resolution in userspace/httpd is HTTP_PORT, then argv[1], then the
# DEFAULT_HTTP_PORT of 8080; it is spelled out here so the listen port is visible
# in the service file rather than only in the binary.
#
# UNBOXED, for the same reason sshd is (see sshd.conf): box 0's network stack is
# the default, so bind/accept route there with no herd box involved.
#
# It serves whatever /public holds. An image whose profile ships no /public still
# starts the server -- it answers 404 rather than failing -- so this is safe to
# enable regardless of profile.
command = /bin/httpd
args = 8080
# Same rationale as sshd's delay: let box 0's stack finish coming up before the
# bind, with restart as the backstop for whatever race is left.
start_delay_ms = 10000
restart = true
max_retries = 0

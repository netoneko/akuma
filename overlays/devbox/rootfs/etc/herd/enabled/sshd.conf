# Devbox sshd INSIDE the rump box: its listen/accept, the login shell, and everything you
# run in the session are sysproxy-routed to the box's rump_server (SSH-over-rump). Reach it
# from the host on the port forwarded onto the rump NIC:
#   ssh -o StrictHostKeyChecking=no -p 2223 root@localhost
#
# Single kernel: NO `core =` pin (that path needs a secondary core / SMP). This is the only
# sshd on the devbox — the base image's native httpd/sshd/core2 configs are pruned by
# overlays/devbox/bootstrap.sh so nothing runs on the native smoltcp stack.
command = /bin/sshd
args = --port 22 --shell /bin/sh
join_box = rumpnet
# Wait for the rump_server DHCP handshake to settle before binding.
start_delay_ms = 10000
restart = true
max_retries = 0

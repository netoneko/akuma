# Devbox sshd — the ONLY sshd on the image (the built-in in-kernel SSH server is
# compiled off via the `userspace-sshd` feature; see overlays/devbox/run.sh).
#
# It runs UNBOXED (no `boxed`, no `join_box`): the devbox kernel makes the rump
# stack the DEFAULT for box 0 (the root box every process starts in), so sshd's
# listen/accept — and every process you spawn from the session (shells, curl,
# cargo, meow) — is automatically routed to box 0's rump_server over the kernel
# sysproxy channel. No herd rump box is needed anymore; the kernel brings the
# rump_server up at boot (rump-default). Reach it from the host on the port
# forwarded onto the rump NIC (run.sh sets RUMP_NIC=1 → host 2223 → guest 22):
#   ssh -o StrictHostKeyChecking=no -p 2223 root@localhost
command = /bin/sshd
args = --port 22 --shell /bin/sh
# Wait for box 0's rump_server DHCP handshake (~5s: rump_init + DHCP) to settle
# before binding; restart backstops any remaining race.
start_delay_ms = 10000
restart = true
max_retries = 0

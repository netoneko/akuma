# Devbox networking: the ONLY stack. herd owns one boxed rump_server; the kernel wires a
# sysproxy channel onto its fd 3 and routes this box's AF_INET syscalls to it
# (stack = rump -> SET_BOX_STACK). sshd joins this box (see sshd.conf), so your SSH session
# and everything you spawn from it (shells, curl, cargo, meow) is networked through the
# NetBSD rump TCP/IP stack, not native smoltcp.
#   --net    bring up virt0 + DHCP over /dev/net/tap0 (needs RUMP_NIC=1; run.sh sets it)
#   --fd 3   serve the sysproxy protocol on fd 3 (the kernel installs the channel there)
#
# box_root is "/" (unlike the isolated /srv/rumpbox demo): the WHOLE disk is the devbox, so
# the full toolchain and /src tree are visible in the SSH session with no duplication.
command = /bin/rump_server
args = --net --fd 3
boxed = true
box_root = /
stack = rump
# No auto-restart: if rump_server dies, its sysproxy channel + per-box proxy are orphaned
# and a correct restart must re-establish them. Reboot the VM instead for now.
restart = false
max_retries = 0

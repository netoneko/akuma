# Stage 7 (taoxichuan s7): the guest dials the host LAN IP through the
# gateway's outbound relay (vm_outbound). hostrelay= on the cmdline is
# inert since 11fe2194 deleted its parse - kept to mirror the documented
# snapshot. One kvm0 VM at a time: vm-serve-mc is stopped while this runs.
# Tracked template: boot_dev.sh copies this to BOTH /etc/herd/available/
# and /etc/herd/enabled/ before disable+enable, so a clobbered conf on
# disk can never silently drop vm_outbound again (RESULT-D finding 1).
vm = true
vm_type = kvm
vm_kernel = /boot/akuma-guest-dev
vm_disk = /boot/akuma-dev-root-ssh.img
vm_ram_mib = 768
vm_vcpus = 1
vm_forward = 2224:22
vm_outbound = true
vm_cmdline = init=/bin/sshd initargs=--port,22 hostrelay=192.168.1.159
restart = false

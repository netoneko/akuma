[package]
name = "akuma-kernel-core"
version = "0.1.0"
edition = "2024"
description = "Unsafe-free half of the bin crate: config/timer/irq/pmm/vfs-fs shims, klog, boot-time SNTP, and the profiling dumps. The unsafe half (main.rs, smp_shared.rs, console.rs, boot.rs, platform.rs) stays in src/ for now."

[dependencies]
akuma-config = { path = "../akuma-config" }
akuma-cpu = { path = "../akuma-cpu" }
akuma-exec = { path = "../akuma-exec" }
akuma-ext2 = { path = "../akuma-ext2" }
akuma-fpcache = { path = "../akuma-fpcache" }
akuma-net = { path = "../akuma-net", default-features = false }
akuma-pmm = { path = "../akuma-pmm" }
akuma-primitives = { path = "../akuma-primitives" }
akuma-vfs-glue = { path = "../akuma-vfs-glue" }
log = { version = "0.4", default-features = false }
spinning_top = "0.3"
smoltcp = { version = "0.12.0", default-features = false, features = ["proto-ipv4", "socket-tcp", "socket-udp", "medium-ethernet", "alloc", "async", "socket-dhcpv4"], optional = true }

# The AArch64 machine half: the GIC (`irq::register_handler`, the scheduler SGI in
# `timer`) and the boot-time machine map (`platform`). Target-gated so the crate
# builds for `x86_64-unknown-none` too, where amd64 consumes its neutral modules
# (`klog`, `config`, `fs`, `pmm`, ...); the modules that name these are gated on
# `all(target_os = "none", target_arch = "aarch64")` in `lib.rs`.
[target.'cfg(target_arch = "aarch64")'.dependencies]
akuma-gic = { path = "../akuma-gic" }
akuma-boot-aarch64 = { path = "../akuma-boot-aarch64" }
# What `console` (PL011, the dmesg ring), `timer` (CNTV), `platform` (FDT) and
# `ntp_boot` (CNTV uptime) name, and `platform::fdt_facts`'s `Facts`; neutral crates, used here only by those modules.
akuma-dmesg = { path = "../akuma-dmesg" }
akuma-machine-facts = { path = "../akuma-machine-facts" }
akuma-fdt = { path = "../akuma-fdt" }
akuma-firecracker = { path = "../akuma-firecracker" }
akuma-syscalls-time = { path = "../akuma-syscalls-time" }
akuma-timer = { path = "../akuma-timer" }
akuma-uart = { path = "../akuma-uart" }

[features]
# See akuma-kernel-glue's `pmm-instr`: gates the `fpcache::len` re-export.
pmm-instr = []
# Mirrors the root package's own toggles of the same name — each needs to
# reach this crate's build.rs so `kernel_tests`/
# `kernel_smp_shared` come out the same here as in the bin crate. See
# `build.rs`.
no-tests = []
# `trigger_sgi_self` (timer.rs) is itself `#[cfg(kernel_smp_shared)]` inside
# akuma-gic, gated on akuma-gic's OWN feature — forward this one, unlike the
# other toggles above, which only need to reach this crate's own build.rs.
smp-shared = ["akuma-gic/smp-shared"]
net-profile = ["akuma-net/net-profile"]
# `platform.rs` selects the machine description at compile time. The cfg it
# reads is `feature = "platform-firecracker"` on THIS package, so the toggle has
# to exist here and be forwarded from every crate above (see
# `akuma-kernel-glue/Cargo.toml`) — a missing forward silently picks QEMU virt.
platform-firecracker = ["akuma-boot-aarch64/platform-firecracker"]
bkl-profile = []
smoltcp = ["dep:smoltcp", "akuma-net/smoltcp"]

[lints]
workspace = true

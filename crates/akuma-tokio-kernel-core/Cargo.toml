[package]
name = "akuma-tokio-kernel-core"
version = "0.1.0"
edition = "2024"
description = "The arch-neutral half of akuma-tokio-kernel: what a tokio kernel decides without naming its machine (the boot command line's tokens, the init program, the kernel's identity, the unserved-syscall note, the evidence rings). Each architecture's machine half builds on it (B21)."

[lints]
workspace = true

[features]
# Writable `MAP_SHARED` file pages over the PMM's share count and glue's write observers
# (`shmpages`). Off for host tests: it reaches the kernel's PMM and physmap.
shmpages = ["dep:akuma-fpcache-rw", "dep:akuma-pmm", "dep:akuma-mmu", "dep:akuma-vfs-glue", "dep:spinning_top"]
# Demand paging over the machine's `mmu::UserPages` (`lazy`): the fill, the reservation and
# the inode pins. Reaches the file-page cache, the PMM and the root filesystem.
lazy = ["shmpages", "dep:akuma-fpcache", "dep:akuma-vfs", "dep:akuma-mmap"]
# ext2 as the root filesystem: `shmpages::inode_freed`, ext2's inode-freed hook.
disk = ["shmpages", "dep:akuma-fpcache"]

[dependencies]
akuma-primitives = { path = "../akuma-primitives" }
akuma-user-layout = { path = "../akuma-user-layout" }
akuma-fpcache-rw = { path = "../akuma-fpcache-rw", optional = true }
akuma-fpcache = { path = "../akuma-fpcache", optional = true }
akuma-vfs = { path = "../akuma-vfs", optional = true }
akuma-mmap = { path = "../akuma-mmap", optional = true }
akuma-pmm = { path = "../akuma-pmm", optional = true }
akuma-mmu = { path = "../akuma-mmu", optional = true }
akuma-vfs-glue = { path = "../akuma-vfs-glue", optional = true }
spinning_top = { version = "0.3", optional = true }

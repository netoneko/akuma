[package]
name = "akuma-tokio-kernel-core"
version = "0.1.0"
edition = "2024"
description = "The arch-neutral half of akuma-tokio-kernel: what a tokio kernel decides without naming its machine (the boot command line's tokens, the init program, the kernel's identity, the unserved-syscall note, the evidence rings). Each architecture's machine half builds on it (B21)."

[lints]
workspace = true

[features]
# Syscall middleware (`akuma-middleware`, B22): the loader and `mprotect`/`mmap` ask its exec policy. Off by default.
middleware = ["dep:akuma-middleware"]
# Writable `MAP_SHARED` file pages over the PMM's share count and glue's write observers
# (`shmpages`). Off for host tests: it reaches the kernel's PMM and physmap.
shmpages = ["dep:akuma-fpcache-rw", "dep:akuma-pmm", "dep:akuma-mmu", "dep:akuma-vfs-glue", "dep:spinning_top"]
# Demand paging over the machine's `mmu::UserPages` (`lazy`): the fill, the reservation and
# the inode pins. Reaches the file-page cache, the PMM and the root filesystem.
lazy = ["shmpages", "dep:akuma-fpcache", "dep:akuma-vfs", "dep:akuma-mmap", "dep:akuma-syscalls-linux", "dep:akuma-syscalls-mem", "dep:akuma-cow", "dep:akuma-user-tree", "dep:akuma-elf-exec"]
# Processes (`proc`): the slot ring, fork/clone/exec/exit over `akuma-exec`'s
# `fork_process`, and who owns which page-table root until the reap.
process = ["lazy", "dep:akuma-exec", "dep:akuma-threading", "dep:akuma-syscalls-glue", "dep:akuma-syscalls-proc"]
# ext2 as the root filesystem: `shmpages::inode_freed`, ext2's inode-freed hook.
disk = ["shmpages", "dep:akuma-fpcache"]
# The socket layer (`net`): `akuma-net`'s runtime table, the poll pump, the DHCP wait.
net = ["dep:akuma-net"]
# Build-time ban on dynamically linked images: `akuma-elf-exec`'s `refuse-dynamic` (`program()` says `ExecErr::Dynamic`, whose errno is
# EPERM) and the loader's mapping of it. No middleware, no hook, no dispatch arm. Off by default; images only (see `ExecErr::Dynamic`).
refuse-dynamic-elf = ["akuma-elf-exec?/refuse-dynamic"]
# Trace builds: the poll pump's lap meter (`[netlap]`).
trace-err = []

[dependencies]
akuma-middleware = { path = "../akuma-middleware", optional = true }
akuma-primitives = { path = "../akuma-primitives" }
akuma-user-layout = { path = "../akuma-user-layout" }
akuma-fpcache-rw = { path = "../akuma-fpcache-rw", optional = true }
akuma-fpcache = { path = "../akuma-fpcache", optional = true }
akuma-vfs = { path = "../akuma-vfs", optional = true }
akuma-mmap = { path = "../akuma-mmap", optional = true }
akuma-syscalls-linux = { path = "../akuma-syscalls-linux", optional = true }
akuma-syscalls-mem = { path = "../akuma-syscalls-mem", optional = true }
akuma-cow = { path = "../akuma-cow", optional = true }
akuma-pmm = { path = "../akuma-pmm", optional = true }
akuma-mmu = { path = "../akuma-mmu", optional = true }
akuma-vfs-glue = { path = "../akuma-vfs-glue", optional = true }
spinning_top = { version = "0.3", optional = true }
akuma-user-tree = { path = "../akuma-user-tree", optional = true }
akuma-elf-exec = { path = "../akuma-elf-exec", optional = true }
akuma-exec = { path = "../akuma-exec", optional = true }
akuma-threading = { path = "../akuma-threading", features = ["hooked"], optional = true }
akuma-syscalls-glue = { path = "../akuma-syscalls-glue", default-features = false, optional = true }
akuma-syscalls-proc = { path = "../akuma-syscalls-proc", optional = true }
akuma-net = { path = "../akuma-net", optional = true }

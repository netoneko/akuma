[package]
name = "akuma-entry"
version = "0.1.0"
edition = "2024"
description = "The kernel's entry points: boot assembly, the secondary-core trampoline, and the linker symbols. The one crate that cannot forbid unsafe_code, so akuma-kernel-glue above it can."

[dependencies]
akuma-bkl = { path = "../akuma-bkl" }
akuma-boot-aarch64 = { path = "../akuma-boot-aarch64" }
akuma-cpu = { path = "../akuma-cpu" }
akuma-exceptions = { path = "../akuma-exceptions" }
akuma-exec = { path = "../akuma-exec" }
akuma-fdt = { path = "../akuma-fdt" }
# `Frame::read_bytes` for the exception services; `IrqFrame` for the IRQ-frame service.
akuma-phys = { path = "../akuma-phys" }
akuma-trap-aarch64 = { path = "../akuma-trap-aarch64" }
akuma-gic = { path = "../akuma-gic" }
# `console`, `platform` and `timer`. This edge is why `console.rs`/`platform.rs`
# moved DOWN into that crate rather than staying beside the assembly: they hold
# no `unsafe`, and keeping them here would have dragged them under this crate's
# missing ban for no reason.
akuma-kernel-core = { path = "../akuma-kernel-core" }
akuma-primitives = { path = "../akuma-primitives" }
akuma-psci = { path = "../akuma-psci" }
akuma-vectors-aarch64 = { path = "../akuma-vectors-aarch64", optional = true }
# The hooked secondary start's registered half (`smp_shared::register_hooked_secondary`).
akuma-not-even-once = { path = "../akuma-not-even-once", optional = true }

[features]
# Mirrors the root package's toggles that this crate's own build.rs and modules
# read. `smp-shared` gates the entire secondary-core half.
extreme = []
no-tests = []
smp-shared = ["akuma-boot-aarch64/secondary", "akuma-gic/smp-shared", "akuma-kernel-core/smp-shared", "akuma-exceptions/smp-shared"]
platform-firecracker = ["akuma-kernel-core/platform-firecracker", "akuma-boot-aarch64/platform-firecracker"]
# M6 (multiarch attempt 0): the root kernel's front end on `akuma-vectors-aarch64` (`hooked`),
# for the hooked scheduler. Default off.
hooked-sched = ["dep:akuma-vectors-aarch64", "dep:akuma-not-even-once", "akuma-exceptions/hooked-sched", "akuma-exec/hooked-sched"]

[lints]
workspace = true

[package]
name = "akuma-sched-amd64"
version = "0.1.0"
edition = "2024"
description = "The machine half of the amd64 scheduler: the per-slot machine table (page-table root, trap stack, user context, FP state, pinning, affinity), and the switch / can_run / prepare_task_slot hooks akuma-threading asks for - generic over a Platform each kernel implements. Extracted from amd64/src/sched.rs so Taoxichuan and the metal kernel run the same code."

[lints]
workspace = true

# The crate is `#![cfg(target_arch = "x86_64")]`: on the host it is empty, and these would be
# unused dependencies.
[target.'cfg(target_arch = "x86_64")'.dependencies]
akuma-primitives = { path = "../akuma-primitives" }
akuma-fpu-amd64 = { path = "../akuma-fpu-amd64" }
akuma-cpu = { path = "../akuma-cpu" }
akuma-affinity = { path = "../akuma-affinity" }
# The hook table `hooks::<P>()` builds, and the user-context type it carries.
akuma-threading = { path = "../akuma-threading" }
akuma-exec-core = { path = "../akuma-exec-core" }

[package]
name = "akuma-tokio-kernel"
version = "0.1.0"
edition = "2024"
description = "A whole Akuma kernel that runs unmodified Linux binaries, tokio programs included, from one short main.rs: the entry macro, the Kernel builder, and the default devices as features. The machine half is per architecture (akuma-tokio-kernel-amd64)."
# Relays the machine half's linker script to the kernel binary (see build.rs).
links = "akuma_tokio_kernel"

[lints]
workspace = true

[features]
# Every default device. A kernel that wants fewer turns `default-features` off and names its own.
default = ["console", "disk", "net", "smp"]
# COM1 (`Kernel::console`).
console = ["akuma-tokio-kernel-amd64/console", "akuma-tokio-kernel-aarch64/console"]
# ext2 on the first virtio-blk device as the root filesystem (`Kernel::disk`).
disk = ["akuma-tokio-kernel-amd64/disk", "akuma-tokio-kernel-aarch64/disk"]
# The first virtio-net device with DHCP (`Kernel::net`); without it, loopback only.
net = ["akuma-tokio-kernel-amd64/net", "akuma-tokio-kernel-aarch64/net"]
# Application processors from `smp=N` (`Kernel::smp`).
smp = ["akuma-tokio-kernel-amd64/smp", "akuma-tokio-kernel-aarch64/smp"]
# What busybox and bash call and no tokio program does (`akuma-runtime-tokio`'s `shell`).
shell = ["akuma-tokio-kernel-amd64/shell", "akuma-tokio-kernel-aarch64/shell"]
# aarch64 under Firecracker (its memory map differs from QEMU virt's; the binary must also link at
# 0x8030_0000). amd64 boots Firecracker through PVH and needs nothing.
platform-firecracker = ["akuma-tokio-kernel-aarch64/platform-firecracker"]
# Compile the boot self-tests of the shared crates out.
no-tests = ["akuma-tokio-kernel-amd64/no-tests", "akuma-tokio-kernel-aarch64/no-tests"]
# Name every syscall that answers a negative errno on the console.
trace-err = ["akuma-tokio-kernel-amd64/trace-err", "akuma-tokio-kernel-aarch64/trace-err"]
# The PMM's use-after-free instruments: quarantine, premature-free check, CoW ledger (amd64).
pmm-forensics = ["akuma-tokio-kernel-amd64/pmm-forensics"]

# Refuse every dynamically linked image at build time, with EPERM: the elf crate says no, so there is no hook and no dispatch arm.
# Independent of `middleware`. Images only (execve, a `#!` interpreter, init); off by default.
refuse-dynamic-elf = ["akuma-tokio-kernel-amd64/refuse-dynamic-elf", "akuma-tokio-kernel-aarch64/refuse-dynamic-elf"]
# Syscall middleware (`Kernel::middleware`, `akuma_tokio_kernel::middleware`, B22). Off by default.
middleware = ["akuma-tokio-kernel-amd64/middleware", "akuma-tokio-kernel-aarch64/middleware", "dep:akuma-tokio-kernel-core"]

# The machine half, chosen by the target. `target_os = "none"` too: `cfg(target_arch)` alone is the
# *host's* under `cargo test`, and the machine halves build only for the kernel targets.
[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
akuma-tokio-kernel-amd64 = { path = "../akuma-tokio-kernel-amd64" }

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
akuma-tokio-kernel-aarch64 = { path = "../akuma-tokio-kernel-aarch64" }

[dependencies]
akuma-tokio-kernel-core = { path = "../akuma-tokio-kernel-core", features = ["middleware"], optional = true }

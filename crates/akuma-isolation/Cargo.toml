[package]
name = "akuma-isolation"
version = "0.1.0"
edition = "2024"
description = "Process isolation primitives: mount namespaces, network namespaces, SubdirFs"

[lints]
workspace = true

[dependencies]
akuma-vfs = { path = "../akuma-vfs" }
# `Pid` and `with_irqs_disabled`, both for the box registry (moved here from
# `akuma-exec` 2026-08-30). Both are safe items, so this crate keeps `forbid`.
akuma-primitives = { path = "../akuma-primitives" }
spinning_top = "0.3"

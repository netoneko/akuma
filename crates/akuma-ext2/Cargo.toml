[package]
name = "akuma-ext2"
version = "0.1.0"
edition = "2024"
description = "Ext2 filesystem implementation for no_std kernels"

[lints]
workspace = true

[features]
extreme = []
# Large, RAM-sized, clock-eviction block cache (replaces the tiny 64-slot ring).
# Keeps the read-only toolchain (.so + rlibs) resident across the hundreds of
# rustc/cc/ld spawns in a self-host build instead of re-streaming it off disk.
# Off by default; opt in via the kernel's `fs-cache` feature. See
# docs/AKUMA_SELF_HOSTING.md §7a/§7b.
fs-cache = []
# Run the ext2 paths without the Big Kernel Lock (Phase 4 of
# docs/archive/BKL_FINE_GRAINED_LOCKING_PLAN.md), forwarded from the bin crate.
# Wraps the `state` (RwSpinlock) holds — and therefore, transitively, every
# `block_cache` access, which is only ever reached with a state guard held — in
# `akuma_exec::sync::PreemptGuard`, so a core running an fs syscall WITHOUT the
# BKL can never be caught holding an ext2 inner lock while a nested IRQ
# hard-spins on the BKL (the AB-BA wedge `no-bkl-network` hit at SMP=4).
# Forwarded to `akuma-primitives` so the guard's IRQ-masking half is active even
# in a graph that does not include `akuma-exec` (e.g. `cargo test -p akuma-ext2`);
# previously this relied on cargo unifying `akuma-exec`'s copy of the feature.
no-bkl-vfs = ["akuma-primitives/no-bkl-vfs"]

[dependencies]
akuma-vfs = { path = "../akuma-vfs" }
# `OnceCopy` (the lock-free thread hooks) + `PreemptGuard` (the IRQ-masking
# inner-lock guard under `no-bkl-vfs`). These two symbols were the ENTIRE reason
# this crate depended on `akuma-exec` — the 23.8k-line execution crate, for a
# ~40-line RAII guard and a ~40-line cell. Both live in the dependency-free leaf
# now, so that edge is gone: see
# docs/archive/TRIMMING_FAT_EMBARASSING_DUPLICATIONS.md 5.55 / 5.555.
akuma-primitives = { path = "../akuma-primitives" }
spinning_top = "0.3"

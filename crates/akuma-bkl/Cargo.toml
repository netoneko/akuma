[package]
name = "akuma-bkl"
version = "0.1.0"
edition = "2024"
description = "The Big Kernel Lock protocol: RwSpinlock, KernelLock, hold-tag attribution, and the per-thread dropped-window ledger — plus the host model checker for all of it"

[lints]
workspace = true

[features]
# Akuma's shared-kernel SMP under this lock (`bkl-smp`, cfg `kernel_bkl_smp`).
# Both Akuma kernels always turn it on; Taoxichuan never does (it serializes under
# its own lock, proposals/ONE_BIG_KERNEL_LOCK.md); host tests build the off arms.
# The cfg is what turns
# `KernelLock` from a set of zero-overhead no-ops into a real lock. Off, every
# `enter_kernel`/`leave_kernel` call in the tree compiles to nothing.
bkl-smp = ["akuma-primitives/bkl-smp"]

[dependencies]
# The whole dependency list. `MAX_THREADS`, `current_tid`, `disable_preemption`,
# `enable_preemption`, `irq_save_mask`/`irq_restore`, `PreemptGuard` and
# `safe_print!` all live in the leaf already — which is why extracting this crate
# needed exactly one hook (`yield_now`) rather than the four-item vtable the plan
# in AKUMA_EXEC_SPLIT_AGAIN.md §3.4 budgeted for.
akuma-primitives = { path = "../akuma-primitives" }
# `nr::` constants for the syscall opt-out seed and structural deny list, so the
# table names syscalls instead of bare numbers. Zero dependencies of its own, so
# this cannot cycle back through the BKL.
akuma-syscalls-linux = { path = "../akuma-syscalls-linux" }
spinning_top = "0.3"

[package]
name = "akuma-exec"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# Mirrors the bin's `no-tests`: absence of it means `kernel_tests` is ON. The
# `pmm` module's boot-suite forwarders are gated on that cfg, and without this
# they compile out of a crate the bin then cannot find them in.
no-tests = []
# Profile discriminator forwarded from the bin crate's `extreme` feature
# (build_extreme_size.sh). Lets this crate's build.rs emit
# `cfg(kernel_profile_extreme)` so threading can trim the warm-stack floor and
# right-size kernel stacks for the extreme low-memory target. NOT a syscall gate.
extreme = ["akuma-primitives/extreme", "akuma-elf/extreme"]

# Real (shared-kernel) SMP, forwarded from the bin crate's `smp-shared` feature.
# Lets this crate's build.rs emit `cfg(kernel_smp_shared)` so the Big Kernel Lock
# (`bkl`) is active; with it off, `bkl` compiles to zero-overhead no-ops and the
# default/other builds are unaffected. See docs/reference/subsystems/smp-shared.md.
smp-shared = ["akuma-primitives/smp-shared", "akuma-bkl/smp-shared", "akuma-mmu/smp-shared", "akuma-elf/smp-shared"]

# Disable BKL usage for network operations (Phase 2 testing).
# When enabled, network syscalls skip BKL acquisition and use the new
# fine-grained network locks instead. Other subsystems still use BKL.
# Used for testing network BKL-free operations before full BKL removal.
no-bkl-network = ["akuma-primitives/no-bkl-network"]

# Disable BKL usage for VFS operations (Phase 4 of
# docs/archive/BKL_FINE_GRAINED_LOCKING_PLAN.md), forwarded from the bin crate.
# Upgrades PreemptGuard to also mask local IRQs for fs-internal spinlock holds
# (ext2 state/block_cache, BLOCK_DEVICE, MOUNT_TABLE), so a BKL-free core can
# never be caught holding an inner spinlock while a nested IRQ hard-spins on
# the BKL (AB-BA wedge — same shape as `no-bkl-network`). Only meaningful with
# `smp-shared`.
no-bkl-vfs = ["akuma-primitives/no-bkl-vfs"]

# Run `fork_process`'s CoW share/demote pass WITHOUT the Big Kernel Lock (Phase 3 of
# docs/archive/BKL_FINE_GRAINED_LOCKING_PLAN.md), forwarded from the bin crate. Makes
# this crate's build.rs emit `cfg(kernel_no_bkl_process)`, activating `ProcessBklGuard`
# (process/bkl_guard.rs) and the chunked `as_lock` holds it depends on. Only meaningful
# with `smp-shared`.
no-bkl-process = []

# Mirrors the bin crate's `syscall-debug-info`. OFF by default.
#
# `lifecycle_trace_on()` was a pure RUNTIME read (`config().syscall_debug_info_enabled`),
# so its 43 call sites kept their format strings in `.rodata` and their formatting
# code in `.text` in every build, and paid a load + branch each. Making the gate
# `cfg!(feature = "debug-info") && config()...` lets the whole thing constant-fold
# away when the feature is off, while keeping the runtime toggle when it is on.
debug-info = ["akuma-mmu/debug-info"]

[dependencies]
# The safe-to-execute AArch64 instructions (barriers, cache/TLB maintenance,
# core parking, DAIF, read-only system registers) behind safe `#[inline(always)]`
# functions, so the trivially-dischargeable `unsafe` blocks live in one crate
# instead of at every call site. Zero dependencies of its own.
akuma-cpu = { path = "../akuma-cpu" }
akuma-primitives = { path = "../akuma-primitives" }
# The BKL protocol + spinlocks, extracted 2026-08-30
# (docs/archive/AKUMA_EXEC_SPLIT_AGAIN.md §3.4). This crate re-exports it as
# `akuma_exec::{sync, bkl}` so its ~120 call sites here and the 121 in `src/` are
# unchanged, and registers the one hook it needs (`threading::yield_now`) in
# `threading::init`.
akuma-bkl = { path = "../akuma-bkl" }
# Page tables, UserAddressSpace, ASIDs and the TTBR free gate, extracted
# 2026-08-30 (docs/archive/AKUMA_EXEC_SPLIT_AGAIN.md §3.5). Re-exported as
# `akuma_exec::mmu` so the ~388 `akuma_exec::mmu::*` call sites in `src/` are
# unchanged. This crate registers its two scheduler hooks in `init`.
akuma-mmu = { path = "../akuma-mmu" }
# The ELF loader, extracted 2026-08-30 (AKUMA_EXEC_SPLIT_AGAIN.md §3.2).
# Re-exported as `akuma_exec::elf_loader`; this crate registers its four VFS
# hooks in `init`.
akuma-elf = { path = "../akuma-elf" }
akuma-pmm = { path = "../akuma-pmm" }
# Region bookkeeping: `MmapRegion`, `PhysFrame`, the CoW-inherit and munmap-detach
# algebra, and the PTE permission vocabulary. Sits BELOW this crate so a future
# `akuma-syscalls-mem` can name `MmapRegion` without depending on all of exec.
akuma-mmap = { path = "../akuma-mmap" }
akuma-syscalls-linux = { path = "../akuma-syscalls-linux" }
spinning_top = "0.3"
lock_api = "0.4"
log = { version = "0.4", default-features = false }
akuma-terminal = { path = "../akuma-terminal" }
akuma-isolation = { path = "../akuma-isolation" }
embedded-io-async = { version = "0.6", default-features = false }

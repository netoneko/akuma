[package]
name = "akuma-exec"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
leak-instr = ["akuma-mmu/leak-instr"]
# Mirrors the bin's `no-tests`: absence of it means `kernel_tests` is ON. The
# `pmm` module's boot-suite forwarders are gated on that cfg, and without this
# they compile out of a crate the bin then cannot find them in.
no-tests = []
# The ELF loader (`akuma-elf`, and the `elf` crate under it): `Process::from_elf*`,
# `replace_image*`, the `spawn_process*` / `exec*` helpers built on them, and the
# `elf_loader` re-export. Off, the amd64 kernels, which load binaries their own
# way and reach only `install_image`, compile ~4,600 fewer audit lines.
# Enabled by the AArch64 kernel's crates (`akuma-syscalls-glue/exec`,
# `akuma-kernel-glue`, `akuma-exceptions`, the bin).
elf-loader = ["dep:akuma-elf", "dep:embedded-io-async"]

# Akuma's shared-kernel SMP under `akuma-bkl` (`bkl-smp`, cfg `kernel_bkl_smp`): the
# Big Kernel Lock (`bkl`) is active; with it off, `bkl` compiles to zero-overhead
# no-ops. See docs/reference/subsystems/smp-shared.md.
# Both Akuma kernels always turn it on; Taoxichuan never does (it serializes under
# its own lock, proposals/ONE_BIG_KERNEL_LOCK.md); host tests build the off arms.
#
# Also turns on the BKL-free fork page-copy (`ProcessBklGuard`, process/bkl_guard.rs),
# the separate `no-bkl-process` feature until 2026-11-11; A/B is its runtime toggle,
# `akuma_bkl::policy`.
bkl-smp = ["akuma-primitives/bkl-smp", "akuma-bkl/bkl-smp", "akuma-mmu/bkl-smp", "akuma-elf?/bkl-smp", "akuma-threading/bkl-smp", "akuma-el0-entry/bkl-smp"]

# Mirrors the bin crate's `syscall-debug-info`. OFF by default.
#
# `lifecycle_trace_on()` was a pure RUNTIME read (`config().syscall_debug_info_enabled`),
# so its 43 call sites kept their format strings in `.rodata` and their formatting
# code in `.text` in every build, and paid a load + branch each. Making the gate
# `cfg!(feature = "debug-info") && config()...` lets the whole thing constant-fold
# away when the feature is off, while keeping the runtime toggle when it is on.
debug-info = ["akuma-mmu/debug-info"]

[dependencies]
# The fd table's state machine: lowest-free allocation, the dup/dup2/dup3/
# F_DUPFD numbering rules, the close-on-exec sweep and fork's copy (epoll
# stripping as a stated policy, not an accident), host-tested with their
# effects returned instead of performed. This crate keeps the locks, the
# `FileDescriptor` payload and the kernel-side reference bumps/release.
akuma-fdtable = { path = "../akuma-fdtable" }
# The safe-to-execute AArch64 instructions (barriers, cache/TLB maintenance,
# core parking, DAIF, read-only system registers) behind safe `#[inline(always)]`
# functions, so the trivially-dischargeable `unsafe` blocks live in one crate
# instead of at every call site. Zero dependencies of its own.
akuma-cpu = { path = "../akuma-cpu" }
# The unsafe-free half: trap-frame/thread-slot types and stack-sizing policy.
# Re-exported as `threading::types`, so this crate's call sites are unchanged.
akuma-exec-core = { path = "../akuma-exec-core" }
akuma-primitives = { path = "../akuma-primitives" }
akuma-syscalls-log = { path = "../akuma-syscalls-log" }
# The BKL protocol + spinlocks, extracted 2026-08-30
# (docs/archive/AKUMA_EXEC_SPLIT_AGAIN.md §3.4). This crate re-exports it as
# `akuma_exec::{sync, bkl}` so its ~120 call sites here and the 121 in `src/` are
# unchanged, and registers the one hook it needs (`threading::yield_now`) in
# `threading::init`.
akuma-bkl = { path = "../akuma-bkl" }
# Page tables, UserAddressSpace, ASIDs and the TTBR free gate, extracted
# 2026-08-30 (docs/archive/AKUMA_EXEC_SPLIT_AGAIN.md §3.5). Re-exported as
# `akuma_exec::mmu` so the ~388 `akuma_exec::mmu::*` call sites in `src/` are
# unchanged. This crate registers its two scheduler hooks in `init`.
akuma-mmu = { path = "../akuma-mmu" }
# The ELF loader, extracted 2026-08-30 (AKUMA_EXEC_SPLIT_AGAIN.md §3.2).
# Re-exported as `akuma_exec::elf_loader`; this crate registers its four VFS
# hooks in `init`.
akuma-elf = { path = "../akuma-elf", optional = true }
akuma-pmm = { path = "../akuma-pmm" }
# Region bookkeeping: `MmapRegion`, `PhysFrame`, the CoW-inherit and munmap-detach
# algebra, and the PTE permission vocabulary. Sits BELOW this crate so a future
# `akuma-syscalls-mem` can name `MmapRegion` without depending on all of exec.
akuma-mmap = { path = "../akuma-mmap" }
akuma-threading = { path = "../akuma-threading" }
# The lock-free per-slot `*mut Process` store under the process table: the
# FREE/ACTIVE/RETIRED state array, the reuse generation, the retire timestamp,
# and every deref. Extracted so `process/table.rs` holds no `unsafe`. Generic —
# it never names `Process`.
akuma-slot-table = { path = "../akuma-slot-table" }
# The EL0 entry `eret`: `enter_user_mode` (register-load + `eret` asm) and its
# SPSR gate `enter_user_mode_checked`. Re-exported as
# `akuma_exec::process::{enter_user_mode, enter_user_mode_checked}` so this
# crate's call sites and `akuma-syscalls-glue`'s one are unchanged.
akuma-el0-entry = { path = "../akuma-el0-entry" }
# The EL0 copy boundary (asm loop + fault trampoline + copy_from/to_user). Held
# every user-copy `unsafe` this crate used to carry; re-exported below as
# `process::user_access`. `process::lazy_prefault` registers its demand-paging
# half back into it at `init`.
akuma-user-access = { path = "../akuma-user-access" }
akuma-syscalls-linux = { path = "../akuma-syscalls-linux" }
spinning_top = "0.3"
lock_api = "0.4"
log = { version = "0.4", default-features = false }
akuma-tty = { path = "../akuma-tty" }
akuma-isolation = { path = "../akuma-isolation", default-features = false }
embedded-io-async = { version = "0.6", default-features = false, optional = true }

[package]
name = "akuma-pmm"
version = "0.1.0"
edition = "2024"
description = "Physical memory manager: bitmap allocator, frame tracking, UAF quarantine, CoW/free ledgers"

[lints]
workspace = true

[dependencies]
akuma-primitives = { path = "../akuma-primitives" }
# Safe wrappers for `dc cvac` / `dsb ish` and the `CTR_EL0` cache-line size, used
# by the `frame` module's zero-and-clean. Removes the `asm!` from this crate
# entirely; what `unsafe` is left is raw-frame access, not instructions.
akuma-cpu = { path = "../akuma-cpu" }
spinning_top = "0.3"

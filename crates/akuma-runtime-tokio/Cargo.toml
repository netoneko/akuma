[package]
name = "akuma-runtime-tokio"
version = "0.1.0"
edition = "2024"
description = "The syscall surface a tokio program needs, as one dependency of a composition root on either architecture: the allow-list of calls glue serves, the hooks a tokio kernel installs, and the dispatch of an allow-listed call to glue. Each kernel's front decodes its own numbers. Features mirror tokio's."

[lints]
workspace = true

[features]
default = ["net"]
# tokio `net`: TCP/UDP and AF_UNIX sockets, over glue's smoltcp socket table.
net = ["akuma-syscalls-glue/smoltcp"]
# tokio `process`: reaping (`wait4`/`waitid`) over the child channels `akuma-exec`
# registers at fork, and `pidfd_open` (tokio's reaper polls a pidfd and falls back
# to SIGCHLD without one). Spawning, `kill` and signal delivery stay the kernel's.
process = ["akuma-syscalls-glue/sc-pidfd"]
# Not a tokio feature: what a shell and its tools call and no tokio program does
# (job control, the other ids, limits and accounting, `sync`, the clock and
# hostname setters). A kernel whose images run busybox or bash turns it on.
# The cut is B10's census (`docs/archive/TAOXICHUAN_B10_SYSCALL_CENSUS.md`).
shell = []

[dependencies]
# The bodies. epoll and eventfd are not optional: mio's `Poll` and `Waker` are
# every tokio runtime's first two syscalls.
akuma-syscalls-glue = { path = "../akuma-syscalls-glue", default-features = false, features = ["sc-epoll", "sc-eventfd"] }
# Which call a number is, on either ABI, and its asm-generic number for glue.
akuma-syscalls-abi = { path = "../akuma-syscalls-abi" }
# The asm-generic numbers, for the calls Linux numbered the same on both ABIs.
akuma-syscalls-linux = { path = "../akuma-syscalls-linux" }
# The mount table's hooks (`install` sets the tokio kernel's answers).
akuma-vfs-glue = { path = "../akuma-vfs-glue" }
# Pipe wakes go to a thread by number.
akuma-exec = { path = "../akuma-exec" }
# The RNG hook and the boot-registered cell for the kernel's callbacks.
akuma-primitives = { path = "../akuma-primitives" }

[package]
name = "akuma-kernel-glue"
version = "0.1.0"
edition = "2024"
description = "The unsafe half of the bin crate: boot assembly, secondary-core bring-up, the UART console, the platform/machine description, the rump sysproxy client, and the kernel_main/async-main orchestration that ties every other crate together. Depends on akuma-kernel-core; src/ keeps only the crate-root-mandatory items (global allocator, alloc-error handler, panic handler, the _start entry stub) plus the boot self-test suite."

[dependencies]
akuma-alloc = { path = "../akuma-alloc" }
akuma-bkl = { path = "../akuma-bkl" }
# Not used directly by any module here, only needed for the
# `platform-firecracker` feature forward below (re-exported through
# `akuma_kernel_core::config` for actual use).
akuma-config = { path = "../akuma-config" }
akuma-cpu = { path = "../akuma-cpu" }
# Boot assembly, the secondary trampoline and the linker symbols. Split out so
# THIS crate can carry `#![forbid(unsafe_code)]`; see that crate's header.
akuma-entry = { path = "../akuma-entry" }
akuma-exceptions = { path = "../akuma-exceptions" }
# `elf-loader`: herd, sshd and the rump server start through `spawn_process*`.
akuma-exec = { path = "../akuma-exec", features = ["elf-loader"] }
akuma-ext2 = { path = "../akuma-ext2" }
akuma-fdt = { path = "../akuma-fdt" }
akuma-gic = { path = "../akuma-gic" }
akuma-kernel-core = { path = "../akuma-kernel-core" }
akuma-machine-facts = { path = "../akuma-machine-facts" }
akuma-mem-policy = { path = "../akuma-mem-policy" }
# The boot command line (`/chosen/bootargs`), kept once; `init=`/`initargs=` read through `akuma_params::init`.
akuma-params = { path = "../akuma-params" }
akuma-net = { path = "../akuma-net", default-features = false }
akuma-pmm = { path = "../akuma-pmm" }
akuma-primitives = { path = "../akuma-primitives" }
akuma-psci = { path = "../akuma-psci" }
# Kernel-side sysproxy client (rumpsp wire + Linux<->NetBSD translation). Only
# the `rump` feature needs it, mirroring the root package.
akuma-rump = { path = "../akuma-rump", optional = true }
akuma-syscalls-glue = { path = "../akuma-syscalls-glue", default-features = false }
akuma-timer = { path = "../akuma-timer" }
akuma-vfs-glue = { path = "../akuma-vfs-glue" }
akuma-virtio = { path = "../akuma-virtio" }
akuma-vectors-aarch64 = { path = "../akuma-vectors-aarch64" }
akuma-switch = { path = "../akuma-switch" }
akuma-exec-core = { path = "../akuma-exec-core" }
# The AArch64 root kernel's two choices in the shared scheduler, which amd64 makes the other way:
# a thread yielding with the BKL dropped takes it for the switch (its dropped-BKL windows), and a
# dead slot is recycled only by the collector, whose cleanup callback is this kernel's teardown.
akuma-threading = { path = "../akuma-threading", features = ["yield-takes-bkl", "collector-recycles"] }
log = { version = "0.4", default-features = false }
spinning_top = "0.3"

[features]
leak-instr = ["akuma-alloc/leak-instr", "akuma-exec/leak-instr"]
# PMM pressure instrumentation (`[PMM-BUDGET]`). Forwards to akuma-pmm, which
# owns the counters, and to akuma-kernel-core for the `fpcache::len` re-export
# the line needs. OFF by default.
pmm-instr = ["akuma-pmm/pmm-instr", "akuma-kernel-core/pmm-instr", "akuma-ext2/pmm-instr"]
# Mirrors the root package's own toggles of the same name — see
# `akuma-kernel-core/Cargo.toml` for why each needs its own copy here rather
# than relying on root's build.rs (build scripts are per-package).
no-tests = ["akuma-kernel-core/no-tests", "akuma-entry/no-tests"]
bkl-smp = [
    "akuma-exec/bkl-smp",
    "akuma-vfs-glue/bkl-smp",
    "akuma-gic/bkl-smp",
    "akuma-net/bkl-smp",
    "akuma-primitives/bkl-smp",
    "akuma-syscalls-glue/bkl-smp",
    "akuma-kernel-core/bkl-smp",
    "akuma-entry/bkl-smp",
    "akuma-ext2/bkl-smp",
]
net-profile = ["akuma-net/net-profile", "akuma-kernel-core/net-profile"]
bkl-profile = ["akuma-kernel-core/bkl-profile"]
smoltcp = ["akuma-net/smoltcp", "akuma-syscalls-glue/smoltcp", "akuma-kernel-core/smoltcp"]
sound = ["akuma-virtio/sound"]
platform-firecracker = ["akuma-config/platform-firecracker", "akuma-entry/platform-firecracker", "akuma-kernel-core/platform-firecracker", "akuma-virtio/platform-firecracker"]
rump = ["akuma-net/rump", "dep:akuma-rump", "akuma-syscalls-glue/rump"]
rump-default = ["rump"]
sc-eventfd = ["akuma-syscalls-glue/sc-eventfd"]
sc-pidfd = ["akuma-syscalls-glue/sc-pidfd"]
sc-epoll = ["akuma-syscalls-glue/sc-epoll"]

[lints]
workspace = true

[package]
name = "akuma-net"
version = "0.1.0"
edition = "2024"

[features]
# Default on so plain `cargo build`/`cargo test -p akuma-net` keep the smoltcp
# native stack. The kernel disables it for the devbox (rump-only) by depending on
# this crate with `default-features = false` and NOT re-enabling `smoltcp`.
default = ["smoltcp"]
# Device-level NIC instrumentation (`nicstat`): per-packet RX/TX/poll timing and
# byte counts, plus how long blocking socket waits park in `blocking_relax`.
# MEASUREMENT BUILDS ONLY — never ship it. Off by default and every recorder is
# an empty inline body when off, so a normal build is byte-for-byte unchanged
# (same discipline as the kernel's `bkl-profile`). Forwarded from the kernel's
# feature of the same name; the kernel prints the windowed delta as `[NICSTAT]`.
net-profile = ["akuma-net-nic/net-profile"]
# Akuma's shared-kernel SMP (`bkl-smp`). Gates the `PreemptGuard` critical-section preemption
# guards (runtime.rs): under the Big Kernel Lock the base NETWORK/SOCKET_TABLE
# spinlocks must never be held across a context switch. A no-op otherwise, so
# builds without it are byte-for-byte unchanged. See
# docs/reference/subsystems/smp-shared.md.
bkl-smp = []
# The native smoltcp TCP/IP stack: the smoltcp_net/socket/dns/http modules and
# everything with smoltcp types in its signatures. Optional so a rump-only build
# (devbox) can compile it out entirely. The rump path (rump_tap + the kernel
# sysproxy client) is smoltcp-free and stays available without this. The DNS
# client, the wait loop and the async stream trait are used only by those modules.
smoltcp = ["dep:smoltcp", "dep:akuma-dns", "dep:akuma-net-yarn", "dep:embedded-io-async"]
# Raw L2 packet path (a second virtio-net NIC exposed as /dev/net/tap0) for the
# kernel's `rump` feature. Adds crate::rump_tap (the hardware half); the
# device-independent orchestration lives in the host-tested `akuma-rump` crate.
# Smoltcp-free — usable with `smoltcp` off.
rump = ["dep:akuma-rump", "akuma-net-nic/rump"]
# The Realtek RTL8169/8168 `ExternalDevice` variant — amd64 bare metal.
rtl8169 = ["akuma-net-nic/rtl8169"]

[lints]
workspace = true

[dependencies]
# Host-testable rump tap orchestration; pulled in only by the `rump` feature.
akuma-rump = { path = "../akuma-rump", optional = true }
# `PreemptGuard`, which this crate re-exports. It started life HERE, was lifted to
# `akuma-exec` so the VFS BKL-drop path could share it — costing this crate a
# dependency on the whole execution crate — and now lives in the dependency-free
# leaf, so the sharing is free.
akuma-primitives = { path = "../akuma-primitives" }
# The DNS A-record client: wire format and the resolver-walk loop, over effects
# this crate wires to its UDP sockets (`dns::resolve_ipv4`).
akuma-dns = { path = "../akuma-dns", optional = true }
# The virtio-net device: DMA buffers, the NIC wrapper, and smoltcp's `Device`
# impls. Every `unsafe` in networking lives there, which is why it is a crate.
akuma-net-nic = { path = "../akuma-net-nic" }
# The `wait_until` readiness state machine, extracted so its five
# incident-driven rules have host tests instead of only a devbox boot.
# See crates/akuma-net-yarn/src/lib.rs.
akuma-net-yarn = { path = "../akuma-net-yarn", optional = true }
# The virtio-net driver and the MMIO probe (`smoltcp_net::init` finds NIC0).
akuma-virtio = { path = "../akuma-virtio" }
smoltcp = { version = "0.12.0", default-features = false, features = ["proto-ipv4", "socket-tcp", "socket-udp", "medium-ethernet", "alloc", "async", "socket-dhcpv4"], optional = true }
embedded-io-async = { version = "0.6", default-features = false, optional = true }
spinning_top = "0.3"
# NOT `max_level_off`: that feature elides every `log::` macro at COMPILE time,
# which made `smoltcp_net::init` silent and a hang inside it invisible (see
# src/klog.rs and docs/archive/AKUMA_FIRECRACKER_KVM.md §5.1). Filtering is done
# at runtime by the sink instead. `release_max_level_info` still drops
# debug!/trace! statically, so smoltcp's per-packet tracing costs nothing.
# This crate's own code calls no `log::` macro: the dependency is here for that
# feature, which cargo unifies onto every crate's `log` (it is the only crate in
# the tree that sets it). A build in which cargo reports it as an unused
# dependency is right about the code and wrong about the purpose; keep it.
log = { version = "0.4", default-features = false, features = ["release_max_level_info"] }


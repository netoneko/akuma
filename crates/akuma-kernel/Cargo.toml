[package]
name = "akuma-kernel"
version = "0.1.0"
edition = "2024"
description = "The full Akuma kernel's arch-neutral front: the entry! macro, and the machine half the target selects (akuma-kernel-amd64 or the AArch64 akuma-kernel-glue)."

[lints]
workspace = true

# The machine half, chosen by the target. `target_os = "none"` too: `cfg(target_arch)` alone is
# the *host's* under `cargo test`, and neither kernel's entry exists for a host.
[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
akuma-kernel-amd64 = { path = "../akuma-kernel-amd64" }

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
akuma-kernel-glue = { path = "../akuma-kernel-glue" }

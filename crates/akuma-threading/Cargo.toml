[package]
name = "akuma-threading"
version = "0.1.0"
edition = "2024"
description = "The preemptive scheduler: fixed-size thread pool, lock-free per-thread state arrays, context switch, park/wake, per-thread stacks + overflow detection, and the thread_start / SGI trampolines. All of akuma-exec's scheduler unsafe, behind one crate boundary."

[lints]
workspace = true

# Sits BELOW `akuma-exec` (re-exported as `akuma_exec::threading`). It does not
# name `Process`: the trap-frame/slot types + `UserContext` are in
# `akuma-exec-core`, and the seven process-layer callbacks are `ProcessHooks`,
# registered from `akuma_exec::init`. No dependency reaches back to `akuma-exec`.
[dependencies]
akuma-primitives = { path = "../akuma-primitives" }
akuma-exec-core = { path = "../akuma-exec-core" }
akuma-cpu = { path = "../akuma-cpu" }
akuma-mmu = { path = "../akuma-mmu" }
akuma-pmm = { path = "../akuma-pmm" }
akuma-bkl = { path = "../akuma-bkl" }
akuma-mmap = { path = "../akuma-mmap" }
akuma-stack = { path = "../akuma-stack" }
akuma-trap-aarch64 = { path = "../akuma-trap-aarch64" }
akuma-switch = { path = "../akuma-switch" }
spinning_top = "0.3"

[features]
bkl-smp = ["akuma-primitives/bkl-smp", "akuma-bkl/bkl-smp", "akuma-mmu/bkl-smp"]
# A thread that yields without `akuma_bkl` held takes it for the switch and gives it back on
# resume. The AArch64 root kernel (its dropped-BKL windows), through `akuma-kernel-glue`; see
# `x86_yield_now`.
yield-takes-bkl = []
# A dead thread's slot is recycled only by the collector (`cleanup_terminated*`, which runs the
# kernel's `set_cleanup_callback` teardown and the full per-slot scrub), never claimed straight from
# `TERMINATED`. The AArch64 root kernel, whose process teardown is that callback; amd64 tears down on
# the dying thread and claims directly. See `x86_claim_slot`.
collector-recycles = []

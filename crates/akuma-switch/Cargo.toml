[package]
name = "akuma-switch"
version = "0.1.0"
edition = "2024"
description = "The scheduler's machine edge: the context table, the context-switch and thread-entry assembly, the TPIDR writes, and the writers that seed a fresh stack. Everything akuma-threading needed `unsafe` for, behind safe checked functions, so that crate can forbid it."

[lints]
workspace = true

# Sits BELOW `akuma-threading`. It does not know the scheduler's policy: it owns bytes (the `Context`
# table, a fresh stack's first frame), instructions (the switch, `msr tpidr*`) and the two `ON_CPU`
# statics the vector asm's `rust_switch_finished` clears.
[dependencies]
akuma-primitives = { path = "../akuma-primitives" }
akuma-exec-core = { path = "../akuma-exec-core" }
akuma-bkl = { path = "../akuma-bkl" }
akuma-stack = { path = "../akuma-stack" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
akuma-trap-aarch64 = { path = "../akuma-trap-aarch64" }

[features]
# aarch64: the hooked cooperative scheduler path instead of the SGI one (see akuma-threading).
hooked = []

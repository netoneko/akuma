[package]
name = "akuma-config"
version = "0.1.0"
edition = "2024"
description = "The kernel's compile-time tunables, as consts every crate can fold against"

[dependencies]
# Only for the `MAX_THREADS` re-export, which is defined in `preempt` because the
# per-slot statics are indexed by it.
akuma-primitives = { path = "../akuma-primitives" }
# `compute_user_stack_size`'s policy, shared with amd64 (config flag sweep, 2026-11-11). Pure, no
# deps of its own, so this stays a leaf dependency.
akuma-mem-policy = { path = "../akuma-mem-policy" }

[features]
# All forwarded from the bin, which owns the real definitions. They must arrive,
# or a gated const silently compiles its other arm — see build.rs.
platform-firecracker = []
syscall-debug-info = []

[lints]
workspace = true

[package]
name = "akuma-virtio"
version = "0.1.0"
edition = "2024"
description = "Shared virtio scaffolding for no_std kernels: the DMA HAL, MMIO device probing, and the virtio-mmio drivers"

[lints]
workspace = true

[dependencies]
# virtio-sound only (`sound`): blk and net are driven in-tree over
# `akuma-virtqueue`. With it go zerocopy, safe-mmio, bitflags 2 and thiserror.
virtio-drivers = { version = "0.13", default-features = false, optional = true }
# The split virtqueue, the register map and the blk/net wire formats.
akuma-virtqueue = { path = "../akuma-virtqueue" }
spinning_top = "0.3"
# Only for the `Transport` trait bounds on read/write_config_space, which
# virtio-drivers 0.13 states in terms of zerocopy traits. Must match the version
# virtio-drivers itself uses, or the bounds refer to different traits.
zerocopy = { version = "0.8", default-features = false, optional = true }
# The DMA `Hal` needs kernel phys<->virt translation, the probe needs the virtio
# MMIO window base, and `block` needs `PreemptGuard`. All three used to come from
# `akuma-exec`, which meant `akuma-net -> akuma-virtio -> akuma-exec` kept the net
# crate compiling the execution crate even after its own direct edge went away.
akuma-primitives = { path = "../akuma-primitives" }
# The rng driver's virtqueue and staging buffer are `DmaArray` statics.
akuma-dma = { path = "../akuma-dma" }

[features]
# The virtio-snd driver. Off by default: it needs virtio-drivers' `alloc`
# feature, which gates that crate's `sound` module. Forwarded from the kernel's
# own `sound` feature.
sound = ["dep:virtio-drivers", "virtio-drivers/alloc", "dep:zerocopy"]

# The machine has no virtio-sound device, so `sound` must be *subtracted* even
# though it is in the kernel's default feature set.
#
# Cargo features are additive and a platform cannot turn one off, which is why
# `src/main.rs` used to shadow this crate's real `audio` with a third copy of the
# stub, selected by a `kernel_audio` cfg its build.rs computed as
# `sound && !platform-firecracker`. Taking the platform as a feature here puts
# that subtraction next to the driver it subtracts, and the copy is gone.
platform-firecracker = []

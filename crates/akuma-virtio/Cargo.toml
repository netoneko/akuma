[package]
name = "akuma-virtio"
version = "0.1.0"
edition = "2024"
description = "Shared virtio scaffolding for no_std kernels: the DMA HAL, MMIO device probing, and the virtio-mmio drivers"

[lints]
workspace = true

[dependencies]
# The `Hal` trait this crate implements, plus the transport/device types the
# probe helper and the drivers are written against. Must stay on the same
# version the kernel and akuma-net use, or the `Hal` impl here does not satisfy
# *their* `virtio_drivers::Hal` bound — the types would be from distinct crates.
virtio-drivers = { version = "0.7", default-features = false }
spinning_top = "0.3"
# The DMA `Hal` needs kernel phys<->virt translation, the probe needs the virtio
# MMIO window base, and `block` needs `PreemptGuard`. All three used to come from
# `akuma-exec`, which meant `akuma-net -> akuma-virtio -> akuma-exec` kept the net
# crate compiling the execution crate even after its own direct edge went away.
akuma-primitives = { path = "../akuma-primitives" }

[features]
# The virtio-snd driver. Off by default: it needs virtio-drivers' `alloc`
# feature, which gates that crate's `sound` module. Forwarded from the kernel's
# own `sound` feature.
sound = ["virtio-drivers/alloc"]

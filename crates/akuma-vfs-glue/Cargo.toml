[package]
name = "akuma-vfs-glue"
version = "0.1.0"
edition = "2024"
description = "The kernel-side VFS layer: mount table, per-box namespaces, and the /proc filesystem"

[dependencies]
# The tunables, as consts to fold against rather than a struct handed over.
akuma-config = { path = "../akuma-config" }
# The filesystem traits, path helpers and `MountTable` this layer instantiates.
akuma-vfs = { path = "../akuma-vfs" }
# `Namespace` — the per-box mount view `with_fs` resolves through.
akuma-isolation = { path = "../akuma-isolation" }
# Process/thread state `/proc` reports on, and the ext2 backing store's inode pins.
akuma-exec = { path = "../akuma-exec" }
akuma-ext2 = { path = "../akuma-ext2" }
# The virtio block devices ext2 mounts sit on (`crate::block` was already a
# re-export of this).
akuma-virtio = { path = "../akuma-virtio" }
# `/proc/meminfo` and friends.
akuma-pmm = { path = "../akuma-pmm" }
# The kernel heap, for `/proc/meminfo`'s `Slab:` row and nothing else. That row
# is the only reading in the system that can see the whole-file-cache bug class:
# `free`'s numbers come from the PMM and did not move across a 135 MB excursion
# into it (`docs/archive/AKUMA_AMD64_CHROMIUM_KERNEL_WORK.md` § "And a method correction").
akuma-alloc = { path = "../akuma-alloc" }
akuma-fpcache = { path = "../akuma-fpcache" }
# Uptime for `/proc/uptime`; `safe_print!`/`tprint!`; `Spinlock`.
akuma-primitives = { path = "../akuma-primitives" }
# The `/proc/<pid>/{stat,status,cmdline,statm,maps}` byte formats, and since
# 2026-10-16 the **tree** — `akuma_procfs::tree::{resolve, list}`, the one
# answer to which names exist under `/proc` and what kind each is, host-tested
# by a simulation that walks the whole tree. `proc::ProcFilesystem` supplies the
# process facts and keeps the renderers.
#
# **Corrected 2026-10-16:** this comment said `ProcFilesystem` was "still not
# mounted" on amd64 and that the amd64 kernel "renders `/proc` from its own
# process tables". Both stopped being true at 5b slice 3, when amd64 began
# registering every process with `akuma-exec` and mounting this filesystem
# (`amd64/src/fs.rs::init_vfs`); its own synthetic `/proc` in `fd.rs` was
# deleted in 4b batch 2c. **One `/proc` implementation serves both kernels**
# (docs/archive/AKUMA_PROC_TREE_UNIFICATION.md).
akuma-procfs = { path = "../akuma-procfs" }
akuma-timer = { path = "../akuma-timer" }
# `/proc/net/tcp` lists the socket table. `default-features = false` matches the
# binary: the rump-only devbox compiles smoltcp out and still needs this crate.
akuma-net = { path = "../akuma-net", default-features = false }
# `register_backstop` — the waiter-side recycler pass `fs::init` installs.
akuma-locks-rw = { path = "../akuma-locks-rw" }
spinning_top = "0.3"

# `/proc/<pid>/syscalls` and `/proc/sysvipc/msg`. These two are why the layer
# could not leave `src/` until 2026-09-01: they used to be `crate::syscall::…`,
# and `src/syscall/` reads 37 symbols back out of here — a cycle Cargo cannot
# express. See docs/archive/SRC_SYSCALL_EXTRACTION.md Blocker 1.
akuma-syscalls-log = { path = "../akuma-syscalls-log" }
# The `/proc/net/dev` column layout, shared with the ioctl path and the amd64
# port so `busybox ifconfig`'s strict parser sees one format.
akuma-syscalls-net = { path = "../akuma-syscalls-net" }
akuma-syscalls-ipc = { path = "../akuma-syscalls-ipc", optional = true }

[features]
# All four are forwarded from the bin, which owns the real definitions. They gate
# exactly what they gated when this code was `src/vfs/`: `extreme-size` builds
# --no-default-features and must not gain a byte of container, reboot-sync or
# SysV-IPC code from the crate split.
sc-sysv-ipc = ["dep:akuma-syscalls-ipc"]
sc-containers = []
# Discriminates extreme-size from size in build.rs; forwarded from the bin.
extreme = []
sc-reboot = []
# So build.rs can emit `kernel_smp_shared` — see its header for why that matters.
smp-shared = []

[lints]
workspace = true

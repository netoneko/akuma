[package]
name = "akuma-primitives"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# Real (shared-kernel) SMP. Without it `PreemptGuard` is a zero-sized no-op and
# the preemption counters are never touched. With it the guard also masks local
# IRQs for the hold, which keeps a BKL-free core from being caught holding an
# inner spinlock while a nested IRQ hard-spins on the BKL (the SMP=4 AB-BA wedge).
# See `preempt::PreemptGuard`. That half was the separate `no-bkl-network` /
# `no-bkl-vfs` features until 2026-11-11.
bkl-smp = []

# No dependencies, by design. This is the leaf every other crate may depend on,
# so anything added here is added to the whole tree's dependency closure. If a
# primitive needs a crate, it does not belong here.
[dependencies]
# The boot-registration cells (`OnceCopy`/`Registered`/`TakeOnce`), split out
# 2026-08-30 — they were this crate's last non-platform `unsafe`. Re-exported
# from `lib.rs`, so the nine crates that use them are unchanged. This is this
# crate's only dependency, and it is on a crate that itself has none.
# The safe-to-execute AArch64 instructions (barriers, cache/TLB maintenance,
# core parking, DAIF, read-only system registers) behind safe `#[inline(always)]`
# functions, so the trivially-dischargeable `unsafe` blocks live in one crate
# instead of at every call site. Zero dependencies of its own.
akuma-cpu = { path = "../akuma-cpu" }
akuma-not-even-once = { path = "../akuma-not-even-once" }

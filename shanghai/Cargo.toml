[package]
name = "shanghai"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
# The sample syscall middleware (`src/middleware.rs`, B22). Off by default: the default Shanghai has none.
middleware = ["akuma-tokio-kernel/middleware", "dep:akuma-primitives"]
# The "no dynamic loading" demo (the `akuma-mw-no-dynamic-loading` crate): refuse a file-backed PROT_EXEC mmap, mprotect(+X) and an execve with an LD_*
# variable. Implies `middleware` (it adds an `Execve` arm to the table's `pre` hook) and `no-dynamic-elf` (the elf crate refuses dynamic images first, with the same EACCES; the policy's `Image` arm is then a reference copy) and is off by default, with or without `middleware`.
no-dynamic-loading = ["middleware", "no-dynamic-elf", "dep:akuma-mw-no-dynamic-loading"]
# "Signed code only" (the `akuma-mw-signed-exec` crate): an image runs only if its SHA-256 is on the `mw.signed.allow=` allowlist for its path or a
# detached `<path>.sig` verifies under an `mw.signed.key=` key scoped to it; every other way of making code (dynamic images, file-backed
# PROT_EXEC mappings, mprotect(+X)) is refused. Reads its lists from the boot command line, so a kernel with no `mw.signed.*` word runs nothing
# (init included). Implies `middleware`; off by default.
signed-exec = ["middleware", "dep:akuma-mw-signed-exec"]
# The build-time alternative: the elf crate refuses every dynamically linked image with EPERM. No middleware, no hook, no dispatch arm;
# covers images only (not a mapping made by hand). Off by default, independent of the two above.
no-dynamic-elf = ["akuma-tokio-kernel/refuse-dynamic-elf"]

[dependencies]
akuma-tokio-kernel = { path = "../crates/akuma-tokio-kernel", features = ["no-tests"] }
akuma-primitives = { path = "../crates/akuma-primitives", optional = true }
# The "no dynamic loading" policy and guard (B22), a crate of its own; this kernel's one table names its two functions.
akuma-mw-signed-exec = { path = "../crates/akuma-mw-signed-exec", optional = true }
akuma-mw-no-dynamic-loading = { path = "../crates/akuma-mw-no-dynamic-loading", optional = true }

[[bin]]
name = "shanghai"
path = "src/main.rs"

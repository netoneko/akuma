[package]
name = "taoxichuan"
version = "0.1.0"
edition = "2024"
description = "Taoxichuan: the minimal composed Akuma amd64 kernel — the minimal-self-hosting experiment's composition root, one stage at a time. Stage 1: boot as a kvm0/Firecracker PVH guest, ext2 root on virtio-blk, reach init spawn, banner on the console, zero faults."

# Not in `default-members`: like `akuma-amd64`, this is an x86_64-only bin the
# default (aarch64) build must never reach.
[lints]
workspace = true

[features]
# The same opt-in `akuma-amd64` has: compile any boot self-tests out. Stage 1
# has none yet; the feature exists so the pinned build command
# (`kbuild -j 4 --features no-tests`) is the same for every kernel.
no-tests = []
# Name every syscall that answers a negative errno on the console (`[err] nr=N -E`).
trace-err = []

[dependencies]
# ---- The stage-1 crate lines, in boot order ---------------------------------
#
# The boot kit: PVH trampoline (boot.s — its `global_asm!` lives in the crate),
# the physmap, kernel page tables, heap + PMM bring-up. One crate where
# `amd64/src` used to be the only home of all four.
akuma-boot-amd64 = { path = "../crates/akuma-boot-amd64" }
# The console: COM1, minimal. The banner's only dependency at this stage.
akuma-comconsole = { path = "../crates/akuma-comconsole" }
# The GDT/TSS descriptors this kernel loads (one core, no userspace yet — the
# TSS exists so the table is the finished shape, not because ring 3 runs).
akuma-gdt = { path = "../crates/akuma-gdt" }
# The IDT (table + lidt) and the trap entry stubs; the fault handlers that make
# a wrong kernel *reportable* — a #PF prints `[Fault]` and halts instead of
# triple-faulting the guest into silence.
akuma-idt-amd64 = { path = "../crates/akuma-idt-amd64" }
akuma-trap-amd64 = { path = "../crates/akuma-trap-amd64" }
# The machine's own description of itself: the PVH handoff, the memory map, the
# virtio-mmio command line.
akuma-ryzen-amd64 = { path = "../crates/akuma-ryzen-amd64" }
# The heap allocator (installed here as the global allocator) and the frame
# allocator `paging` and `virtio` allocate through.
akuma-alloc = { path = "../crates/akuma-alloc" }
akuma-pmm = { path = "../crates/akuma-pmm" }
# The leaf crate every shared crate talks through: the console hook
# (`safe_print!`), the physmap limit, the virtio window.
akuma-primitives = { path = "../crates/akuma-primitives" }
# virtio-mmio block: the root disk's transport and driver, polled.
akuma-virtio = { path = "../crates/akuma-virtio" }
# ext2 on that disk: the root filesystem, and the `Filesystem` vocabulary it
# implements. No VFS mount table yet — that is a later stage's line.
akuma-ext2 = { path = "../crates/akuma-ext2" }
akuma-vfs = { path = "../crates/akuma-vfs" }
# cr0/cr2/cr3/cr4 reads (fault reports, the WP bit), `invlpg`, `park`.
akuma-cpu = { path = "../crates/akuma-cpu" }
# The copy-on-write write-fault decision (live PTE writable? marked? share count?).
akuma-cow = { path = "../crates/akuma-cow" }
# The mmap slab's hole table (first-fit under the bump cursor), host-tested.
akuma-mmap = { path = "../crates/akuma-mmap" }
# rt_sigaction's table and rt_sigprocmask's algebra, host-tested.
akuma-syscalls-signal = { path = "../crates/akuma-syscalls-signal" }
# The FPU save area's sizes, offsets and power-on image (shared with the amd64 kernel).
akuma-fpu-amd64 = { path = "../crates/akuma-fpu-amd64" }
# The CoW fork's per-entry decisions (skip/refuse/descend/copy/share) and free order, host-tested on a fake tree.
akuma-user-tree = { path = "../crates/akuma-user-tree" }
# sockaddr_in decode/encode and the net_err convention (shared with the amd64 kernel).
akuma-syscalls-net = { path = "../crates/akuma-syscalls-net" }
# ---- The stage-2 crate line -------------------------------------------------
#
# Ring 3: the ELF slice parser, the Linux initial stack, the syscall MSR
# setup and both crossings (`sysretq` in, the naked `syscall` stub back).
# `PteProt`/`MemAttr` for the user mappings arrive via `akuma-boot-amd64`'s
# `paging` re-export.
akuma-ring3-amd64 = { path = "../crates/akuma-ring3-amd64" }
# The pure PT_INTERP / entry decisions (composition step 3/3b): the same
# core akuma-elf (the amd64 kernel's loader) calls. This kernel maps the
# interpreter itself; the crate only decides.
akuma-elf-exec = { path = "../crates/akuma-elf-exec" }
# ---- The stage-3 crate line -------------------------------------------------
#
# The fd *decisions* (lowest-free allocation, close, the flags sets), extracted
# from `amd64/src/fd.rs` long before this kernel existed and host-tested with
# zero dependencies: this kernel keeps a few fixed slots of it per task and
# supplies the effects itself (an open description here is a path on the ext2
# root, nothing to reference-count).
akuma-fdtable = { path = "../crates/akuma-fdtable" }
# ---- The stage-8 crate line (trim step 2) -----------------------------------
#
# The wire shapes the dispatcher used to hand-write byte by byte (`st[24..28]`
# style offsets in fill_stat64, the table-writer statfs, the getdents64 record
# encoder, the utsname fields, the timespec/timeval writers): the shared
# Linux-ABI structs with their layout assertions, and the x86_64 number table.
# The full kernels consume both; this kernel copies amd64's call shape (fill
# the asm-generic struct, `stat::to_x86_64` re-lays it, bytes to the task).
akuma-syscalls-linux = { path = "../crates/akuma-syscalls-linux" }
akuma-syscalls-abi = { path = "../crates/akuma-syscalls-abi" }
# Stage 8 (M3): select(2)'s fd-set marshalling for apk's fetcher, pulled not
# hand-written - the crate doc records the exceptfds bug this class of hand
# roll has already caused once in this tree.
akuma-syscalls-poll = { path = "../crates/akuma-syscalls-poll" }
# Stage 12: the epoll family's WAIT LOOP, pulled not hand-written — yarn's
# `WaitMachine` under `WaitPolicy::epoll` decides each lap's park deadline,
# the inclusive zero-timeout and the timeout-before-signal tie-break; this
# kernel supplies the effects (probe, sleep_until park, EINTR check). A leaf
# crate: zero dependencies of its own.
akuma-net-yarn = { path = "../crates/akuma-net-yarn" }
# pn S2: membarrier's command decode (the barrier itself is an effect here).
akuma-syscalls-mem = { path = "../crates/akuma-syscalls-mem" }
# pn S4: futex decisions (op decode, key namespace, waiter table, deadline).
akuma-syscalls-sync = { path = "../crates/akuma-syscalls-sync" }
# Stage 8 session Q: eventfd2 for libcurl's wakeup fd. The state machine is
# the extracted pure crate (also under akuma-syscalls-glue now); this kernel
# adds only the fd-table entry and the read/write/poll/close routing.
akuma-syscalls-eventfd = { path = "../crates/akuma-syscalls-eventfd" }
# ---- The stage-4 crate line -------------------------------------------------
#
# The network stack: the AF_INET socket table and the smoltcp interface
# (`akuma-net`, decisions, host-tested, zero unsafe) over the virtio-net
# device and its DMA arenas (`akuma-net-nic`, every unsafe in networking).
# Both build for `x86_64-unknown-none` unchanged — `akuma-amd64` has never
# carried them anywhere. What this kernel supplies is the `NetRuntime`
# callback table (taoxichuan/src/net.rs): a TSC clock calibrated against the
# PIT, an RDRAND-backed RNG, and the no-op collapses a one-core,
# no-interrupt, no-scheduler target makes of the park/wake hooks.
akuma-net = { path = "../crates/akuma-net" }

# Stage 8 M3: pipe2(2)'s table — end refcounts, the 64 KiB FIFO, the
# read/write/EOF rules. Pulled, not written: host-tested, and the amd64
# kernel consumes the same crate through its fd.rs.
akuma-pipes = { path = "../crates/akuma-pipes" }
# M4 slice 3 (session pd): the fork pull's remaining halves — the isolation
# namespace every Process field carries, and the x86 UserAddressSpace walker
# fork_process builds the child's address space with.
akuma-isolation = { path = "../crates/akuma-isolation" }
akuma-mmu = { path = "../crates/akuma-mmu" }
# The Process fields' lock type (amd64 and akuma-exec both build on it).
spinning_top = "0.3"
# TerminalState (the Process field's line-discipline cell) lives here.
akuma-tty = { path = "../crates/akuma-tty" }
# Stage 8 M4 session pb: the exec/threading ladder pulled for the preemption
# foundation (linkage proved; the exec_runtime twin lands next session), and
# the LAPIC timer face extracted from amd64/src/lapic.rs so both kernels share
# one implementation. akuma-port rides along: this kernel now masks the legacy
# PICs before arming the timer, exactly as amd64's lapic::init does.
akuma-exec = { path = "../crates/akuma-exec" }
akuma-threading = { path = "../crates/akuma-threading" }
akuma-lapic-amd64 = { path = "../crates/akuma-lapic-amd64" }
# The machine half of the scheduler (switch / can_run / FP state), shared with the metal kernel.
akuma-sched-amd64 = { path = "../crates/akuma-sched-amd64" }
akuma-user-walk = { path = "../crates/akuma-user-walk" }
akuma-pte-amd64 = { path = "../crates/akuma-pte-amd64" }
akuma-port = { path = "../crates/akuma-port" }

[[bin]]
name = "taoxichuan"
path = "src/main.rs"

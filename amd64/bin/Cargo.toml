[package]
name = "akuma-amd64"
version = "0.0.9"
edition = "2024"
description = "The amd64 Akuma kernel binary: akuma_kernel::entry!() over akuma-kernel-amd64"

[lints]
workspace = true

# Every feature is the machine half's (`amd64/Cargo.toml` says what each does), forwarded so that
# `cargo build -p akuma-amd64 --features X` keeps working. A feature added there needs its line
# here; one missing is a cargo error naming it, not a silent no-op.
[features]
default = ["akuma-kernel-amd64/default"]
smp-shared = ["akuma-kernel-amd64/smp-shared"]
fs-cache = ["akuma-kernel-amd64/fs-cache"]
ring0-preempt = ["akuma-kernel-amd64/ring0-preempt"]
syscall-debug-info = ["akuma-kernel-amd64/syscall-debug-info"]
pmm-forensics = ["akuma-kernel-amd64/pmm-forensics"]
mm-forensics = ["akuma-kernel-amd64/mm-forensics"]
sc-epoll = ["akuma-kernel-amd64/sc-epoll"]
sc-eventfd = ["akuma-kernel-amd64/sc-eventfd"]
sc-timerfd = ["akuma-kernel-amd64/sc-timerfd"]
sc-pidfd = ["akuma-kernel-amd64/sc-pidfd"]
sc-aio = ["akuma-kernel-amd64/sc-aio"]
sc-sysv-ipc = ["akuma-kernel-amd64/sc-sysv-ipc"]
sc-containers = ["akuma-kernel-amd64/sc-containers"]
no-tests = ["akuma-kernel-amd64/no-tests"]

[dependencies]
akuma-kernel = { path = "../../crates/akuma-kernel" }
akuma-kernel-amd64 = { path = "..", default-features = false }

[[bin]]
name = "akuma-amd64"
path = "src/main.rs"
test = false
bench = false

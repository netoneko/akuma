[package]
name = "akuma-amd64"
version = "0.0.9"
edition = "2024"
description = "The amd64 Akuma kernel binary: akuma_kernel::entry!() over akuma-kernel-amd64"

[lints]
workspace = true

# Every feature but the driver ones is the machine half's (`amd64/Cargo.toml` says what each
# does), forwarded so that `cargo build -p akuma-amd64 --features X` keeps working. A feature
# added there needs its line here; one missing is a cargo error naming it, not a silent no-op.
[features]
default = ["akuma-kernel-amd64/default", "all-drivers"]

# Device drivers (`crates/akuma-drivers-amd64`), one feature per driver. A driver left out is
# not compiled and its boot-time probe does nothing: the machine half sees the class as absent.
# `all-drivers` is in `default`, so the default (bare-metal) image is unchanged. A smaller set
# needs `--no-default-features`, because cargo features only add.
all-drivers = ["akuma-drivers-amd64/all"]
hda = ["akuma-drivers-amd64/hda"]
touchpad = ["akuma-drivers-amd64/touchpad"]
ring0-preempt = ["akuma-kernel-amd64/ring0-preempt", "akuma-kernel-tests-amd64/ring0-preempt"]
syscall-debug-info = ["akuma-kernel-amd64/syscall-debug-info"]
pmm-forensics = ["akuma-kernel-amd64/pmm-forensics"]
mm-forensics = ["akuma-kernel-amd64/mm-forensics"]
linux-extra-syscalls = ["akuma-kernel-amd64/linux-extra-syscalls"]
sc-epoll = ["akuma-kernel-amd64/sc-epoll"]
sc-eventfd = ["akuma-kernel-amd64/sc-eventfd"]
sc-timerfd = ["akuma-kernel-amd64/sc-timerfd"]
sc-pidfd = ["akuma-kernel-amd64/sc-pidfd"]
sc-aio = ["akuma-kernel-amd64/sc-aio"]
sc-containers = ["akuma-kernel-amd64/sc-containers"]
no-tests = ["akuma-kernel-amd64/no-tests", "akuma-kernel-tests-amd64/no-tests"]

[dependencies]
akuma-kernel = { path = "../../crates/akuma-kernel" }
akuma-kernel-amd64 = { path = "..", default-features = false }
# The drivers, registered by `main.rs`'s `before_main`. Which ones is the features above.
akuma-drivers-amd64 = { path = "../../crates/akuma-drivers-amd64" }
# The boot suite. Empty under `no-tests`, where `main.rs` does not name it either.
akuma-kernel-tests-amd64 = { path = "../../crates/akuma-kernel-tests-amd64" }

[[bin]]
name = "akuma-amd64"
path = "src/main.rs"
test = false
bench = false

[package]
name = "akuma-kernel-amd64"
version = "0.0.9"
edition = "2024"
description = "The amd64 Akuma kernel, as a library: everything but the entry symbols, which akuma-kernel's entry! puts in the bin (amd64/bin, package akuma-amd64)"
# Exports the linker script's path to the bin (`build.rs`): a dependency's `rustc-link-arg`
# never reaches a binary that depends on it.
links = "akuma_kernel_amd64"

[lints]
workspace = true

[features]
default = ["linux-extra-syscalls"]
# The seven families together: what a Linux program expects beyond the core set.
# In `default`. Six families stay individually settable; SysV message queues are
# only the group's (see below). Same name and members as the AArch64 kernel's
# group, whose `sc-reboot` is deliberately outside it.
#
# SysV message queues: `msgget`/`msgctl`/`msgsnd`/`msgrcv`, the only quarter of
# SysV IPC `akuma-syscalls-glue` implements (no shared memory, no semaphores).
# `struct msqid_ds` is byte-identical between x86_64 and aarch64 musl, so it
# needs no ABI-boundary translation. `akuma-vfs-glue/sc-sysv-ipc` adds
# `/proc/sysvipc/msg`: this kernel mounts that crate's `ProcFilesystem` as its
# `/proc` (`src/fs.rs`), and the listing reads the same `akuma-syscalls-ipc`
# state the syscalls write. Until 2026-11-11 this was a separate `sc-sysv-ipc`
# feature that did not forward to `akuma-vfs-glue`, on a stale belief that
# `/proc` was not mounted here, so amd64 had the queues but no listing.
linux-extra-syscalls = [
    "sc-aio", "sc-containers", "sc-timerfd", "sc-eventfd", "sc-pidfd", "sc-epoll",
    "akuma-syscalls-glue/sc-sysv-ipc", "akuma-vfs-glue/sc-sysv-ipc",
]
# Preempt ring 0. Syscalls run with `IF` set once the BKL is taken, and the timer
# switches a thread in kernel code when `akuma_threading::el1_preemptible` allows it
# (preemption not disabled, scheduler pool unlocked, thread RUNNING) **and this core
# does not hold the BKL**: the shared crates' dropped-BKL windows (`no-bkl-*` above),
# which AArch64 already preempts. A BKL-held section is not preempted, because this
# target's own kernel code was written for a ring 0 that never switches involuntarily.
# OFF by default until its gates pass; `docs/archive/AMD64_RING0_PREEMPTION.md`.
ring0-preempt = []

# The compile-time syscall debug mode the AArch64 kernel has (root
# `Cargo.toml`'s `syscall-debug-info`): glue's per-arm `[syscall]` lines and the
# `[FORK-DBG]`/`[TRAMP]` fork/exec/thread-spawn lifecycle traces
# (`docs/reference/subsystems/config-flags.md` § Tracing). OFF by default; the
# same four crates as on AArch64, since glue const-asserts that
# `akuma-config` and `akuma-syscalls` agree. For "which syscall failed and on
# what path", the runtime `strace_err` command-line flag is the lighter tool
# (`usermode.rs`'s `SYSCALL_TRACE_ERRORS`).
syscall-debug-info = [
    "dep:akuma-syscalls", "akuma-syscalls/debug-info",
    "dep:akuma-syscalls-time", "akuma-syscalls-time/debug-info",
    "akuma-exec/debug-info", "akuma-config/syscall-debug-info",
]

# PMM forensics for the SMP corruption hunt. OFF by default and meant to be
# turned on for a hunt build, the way `akuma-pmm`'s own `pmm-instr` is.
#
# It turns on the three `PmmConfig` booleans this target has always passed as
# `false`: the UAF quarantine (`[PMM-UAF]` — a freed frame is poisoned, parked
# and verified on the way out), the premature-free check (`[PMM-PREMATURE]` — a
# frame freed while a live address space still maps it) and the CoW ledger,
# which is what lets either report name the culprit instead of only the thread.
# The quarantine also enables the **resurrection** detector (`[PMM-RESURRECT]`):
# a `cow_ref_inc` that takes the first reference to a frame still parked in
# quarantine, i.e. a freed frame about to be handed out as live data.
#
# Why it is worth having here. On AArch64 this exact instrument is what cracked
# the `-j4` self-host corruption after six mechanisms had been eliminated by
# guessing: `sys_munmap` was freeing the frame its *region record* named rather
# than the one the live PTE held, ~11,000 times per build
# (`docs/archive/SELFHOST_ZERO_PAGE_HUNT.md` §8). The amd64 failure measured
# 2026-09-18 — `rustc` killed by `#PF ... cr2=0x34`, a near-NULL read, and the
# bare-metal one at `cr2=0x00004d5f4e4f4964`, ASCII — is that same
# reads-serving-wrong-bytes family.
#
# Cost, which is why it is not default: every free poisons a page and parks it
# in a 512-entry ring instead of returning it, and the premature-free check
# walks for a surviving mapper on every free.
pmm-forensics = []

# Placement forensics for `sys_mmap`, off by default and meant for a hunt build
# the way `pmm-forensics` is.
#
# It answers one question the rest of the kernel cannot be asked cheaply: **is
# the address `mmap` just chose actually free?** Every automatic placement is
# checked, before anything is populated, against three things that must all
# agree that it is:
#
# * no existing **region record** overlaps it (`[MM-OVERLAP]`),
# * no **present PTE** already covers it (`[MM-LIVEPTE]`),
# * the region list `find_free_va_scan_from` binary-searches is genuinely
#   **sorted** (`[MM-UNSORTED]`) — the placer's `partition_point` and its
#   "the first region starting past `cand + len` proves the gap" shortcut are
#   both wrong on an unsorted list, and the O(1) guard in the scan only
#   inspects the last two entries.
#
# Why this is worth a feature. A placement that overlaps a live mapping is
# silent at the moment it happens and surfaces much later as the *program's*
# memory being wrong — on this target, as musl's mallocng `hlt`ing on its own
# corrupt in-band metadata with no kernel diagnostic of any kind
# (`docs/archive/AKUMA_AMD64_SELFHOST_BUILD_SLOWNESS.md` §14). It is the exact
# shape `pmm-forensics` cannot see, because every frame involved is correctly
# owned and correctly refcounted; only the *address* is wrong.
#
# Cost, which is why it is not default: one region-list pass and one range walk
# per `mmap`, on a path `rustc` takes ~58 000 times per crate.
mm-forensics = []

# `epoll_create1`/`epoll_ctl`/`epoll_pwait`. Forwards to glue's own gate of
# the same name — `crates/akuma-syscalls-abi`'s table names the numbers on
# both architectures unconditionally, but the *implementation*
# (`akuma_syscalls_glue::poll::sys_epoll_*`) and the `EpollFd`
# fd-table-teardown hook it needs (`exec_runtime.rs`'s `epoll_destroy`) stay
# behind this feature exactly as they do for the AArch64 kernel. Default-on:
# `mio`'s epoll backend — what every non-`use-dev-tty` crossterm build and
# the `tokio`/`bun` reactors reach for — needs both this and `sc-eventfd`.
sc-epoll = ["akuma-syscalls-glue/sc-epoll"]
# `eventfd2`, `mio`'s own cross-thread interrupt for a blocking `epoll_pwait`.
# See `sc-epoll` just above; the two are default-on together for the same
# reason.
sc-eventfd = ["akuma-syscalls-glue/sc-eventfd"]
# `timerfd_create`/`timerfd_settime`/`timerfd_gettime`. `struct itimerspec` is
# the same 32-byte layout on every architecture (no `struct epoll_event`-style
# x86_64 packing wart), so unlike epoll this family needed no ABI-boundary fix
# — only the three numbers and the dispatch arms.
sc-timerfd = ["akuma-syscalls-glue/sc-timerfd"]
# `pidfd_open`. Forwards to glue's gate; `pidfd_send_signal` is not wired —
# glue has no implementation of it yet (`sys_pidfd_open` is the only function
# in `akuma-syscalls-glue::pidfd`), so it stays a plain `ENOSYS` gap rather
# than a feature to turn on. `pidfd_open`/`pidfd_send_signal` are numbered
# **identically** on x86_64 and asm-generic (both post-Linux-5.1 syscalls,
# unified across architectures on purpose) and so have no
# `akuma-syscalls-abi` row — see that crate's module doc, rule 3 — and are
# dispatched by their one shared number directly in `amd64/src/usermode.rs`.
sc-pidfd = ["akuma-syscalls-glue/sc-pidfd"]
# `io_setup`/`io_destroy`/`io_submit`/`io_cancel`/`io_getevents` — Linux
# native AIO. `io_submit`/`io_cancel`/`io_getevents` are stubs in glue (no
# real I/O is ever submitted; the ring always reports empty), but
# `io_setup` is not: it allocates a real page and maps it into the calling
# process's address space via `akuma_exec::process::vm_alloc_mmap`/
# `with_address_space` — the same shared-address-space API this target's own
# CoW fork already goes through, not the native `crate::mm` path
# `Mmap`/`Munmap`/`Madvise`/`Mremap` use, so this is worth re-checking if the
# two ever appear to disagree about a region.
sc-aio = ["akuma-syscalls-glue/sc-aio"]
# `mount`(165)/`umount2`(166) — real Linux syscalls, gated behind
# `akuma-syscalls-glue`'s `sc-containers` (the same feature that also compiles
# `register_box`/`kill_box`/`reattach`/`mount_in_ns`, the "box" lifecycle
# calls — see that crate's `container.rs`). Forwards to
# `akuma-vfs-glue/sc-containers` too: `container::sys_mount`'s `fstype ==
# "proc"` arm builds `akuma_vfs_glue::proc::ProcFilesystem`, and without the
# forward `cargo check` on the standalone crate fails "item configured out"
# (root `Cargo.toml` already does this for the AArch64 binary; amd64's own
# manifest had just never defined the forwarding feature). `ProcFilesystem`
# itself compiles for `x86_64-unknown-none` (has since B3) and is this kernel's
# mounted `/proc`, so this needed no `#[cfg]` carve-out inside
# `container.rs`.
#
# **Only `Mount`/`Umount2` got an amd64 dispatch arm.**
# `register_box`/`kill_box`/`reattach`(316-318)/`mount_in_ns`(325) are
# Akuma-private numbers reached through `usermode.rs`'s `AKUMA_PRIVATE_BASE`
# match, which has no arms for them — so turning this feature on does not
# make them reachable, and it should stay that way until amd64 has a "box"
# concept of its own to give them meaning: every process here is hardcoded
# `box_id: 0` (`net.rs`, `usermode.rs`), so `register_box`'s registration and
# `mount_in_ns`'s per-box namespace composition have nothing to attach to.
# `caller_may_mount` (box 0 only) always passes here as a result, matching
# the single-box world this target already is.
# `docs/archive/AKUMA_AMD64_SC_CONTAINERS_MOUNT.md`.
sc-containers = ["akuma-syscalls-glue/sc-containers", "akuma-vfs-glue/sc-containers", "akuma-isolation/containers"]
# Compile the boot self-test suite **out**.
#
# The same opt-in the AArch64 kernel has (root `Cargo.toml`), and it means the
# same thing here: the bin stops linking `akuma-kernel-tests-amd64` (the boot
# suite) and every `*_test`/`smoke_test` function left in `amd64/src`
# disappears, leaving a kernel that boots straight into `init`.
# The devbox and `extreme-size` targets build with it on the other
# architecture; on this one it is what makes the line count honest, because
# `scripts/cloc_akuma.py` attributes an item to the *test* bucket exactly when
# its `cfg` cannot hold in a `no-tests` world. Before this feature existed
# `amd64/src` measured **0.0% test** against ~4 000 lines of boot suite.
#
# The initialisation the suite performs inline — the LAPIC, the console fd and
# the syscall MSRs — is `boot::late_init`, which this build calls instead. See
# the suite's header (`crates/akuma-kernel-tests-amd64/src/suite.rs`) for the
# rule that keeps the two in step.
no-tests = ["akuma-kernel-core/no-tests", "akuma-exec/no-tests", "akuma-syscalls-glue/no-tests"]

[dependencies]
# Stage A of the amd64 bring-up: the kernel's own memory management, running on
# x86_64. Both of these already built for `x86_64-unknown-none` before this
# target existed — they are neutral code, and wiring them up is the test of that
# claim. Note they reach `akuma-cpu` through `akuma-primitives`; since
# 2026-09-08 `akuma-cpu` is also a direct dependency — `daif`'s x86 arms
# (`cli`/`sti`/`pushfq`) are real, and `paging.rs`/`exec_runtime.rs` consume
# them directly instead of private copies.
akuma-alloc = { path = "../crates/akuma-alloc" }
# The boot kit — boot.s, the physmap, the kernel's own page tables, heap+PMM
# bring-up — pulled as a crate since the Taoxichuan stage-1 extraction
# (2026-10-24) so the composed kernel (`taoxichuan/`) and this one share one
# boot block instead of two copies that drift. `phys.rs`, the walker half of
# `paging.rs` and the policy half of `mem.rs` are re-export shims onto it.
akuma-boot-amd64 = { path = "../crates/akuma-boot-amd64" }
akuma-pmm = { path = "../crates/akuma-pmm" }
akuma-cpu = { path = "../crates/akuma-cpu" }
akuma-affinity = { path = "../crates/akuma-affinity" }
# The Big Kernel Lock (`smp.rs`'s `bkl_enter`/`bkl_leave` forward here).
akuma-bkl = { path = "../crates/akuma-bkl" }
akuma-sched-amd64 = { path = "../crates/akuma-sched-amd64" }
# Syscall identity across architectures. Proposal item 5's shape, and the amd64
# port is why it exists: `akuma-syscalls-linux::nr` is asm-generic (aarch64)
# numbering, and x86_64 Linux numbers everything differently.
akuma-syscalls-abi = { path = "../crates/akuma-syscalls-abi" }
# Shared boot self-test harness. Gives the tally the amd64 target lacked: a
# [FAIL] used to print and the boot then finished announcing success.
akuma-lapic-amd64 = { path = "../crates/akuma-lapic-amd64" }
akuma-selftest = { path = "../crates/akuma-selftest" }
# Parsing GRUB's information block. A crate, with tests, because the first
# version of this parser lived in amd64/src/multiboot2.rs and had a one-byte
# offset error that could only be found by rebooting the machine.
akuma-multiboot2 = { path = "../crates/akuma-multiboot2" }
# The Realtek RTL8169/8168/8111 driver, for the onboard NIC of the bare-metal
# reference machine. Nothing calls it yet — that needs PCI enumeration — but it
# belongs to this target, which is the only one with the part.
akuma-net-rtl8169 = { path = "../crates/akuma-net-rtl8169" }
# PCI configuration-space parsing — the header, BAR decode and capability list,
# host-tested against config space read off the bare-metal reference machine.
# `src/pci.rs` is the `0xCF8`/`0xCFC` mechanism half; this is the parsing.
akuma-pci = { path = "../crates/akuma-pci" }
# Legacy port I/O as typed devices (COM1, CMOS, 8259, 8254, i8042, PCI config,
# reset control, debugcon): the only crate that executes `in`/`out`.
akuma-port = { path = "../crates/akuma-port" }
# The GDT/TSS as data: descriptors, the TSS descriptor packing, and the
# syscall/sysret selector arithmetic (compile-time asserted).
akuma-gdt = { path = "../crates/akuma-gdt" }
# Linux `reboot(2)` ABI decode, shared with the aarch64 kernel's `sc-reboot`.
# `src/pci.rs`'s sibling `src/reboot.rs` adds the x86 reset that `akuma-boot`'s
# own `system_reset` (a PSCI `smc`) cannot do here.
akuma-boot = { path = "../crates/akuma-boot", default-features = false }
# **C1 step 6**: the tree's one ELF loader. `src/loader.rs` used to parse and
# place images itself — through the same vetted `elf` 0.7 crate this one uses,
# so there was one parser and two placers. There is one of each now: this crate
# does the loading and `loader.rs` keeps only the initial-stack half (see that
# module's header for why the layout stayed). Already in the link graph through
# `akuma-syscalls-glue`; named here because this crate calls it, and because
# `exec_runtime.rs` has to register its four VFS callbacks.
akuma-elf = { path = "../crates/akuma-elf" }
# The pure PT_INTERP / entry decisions, shared with taoxichuan (the
# composition root). `finish()`'s cross-target decision rides the same fn.
akuma-elf-exec = { path = "../crates/akuma-elf-exec" }
# The virtio-blk driver, used unmodified. What this target supplies is the three
# machine facts it cannot discover — where the transport is, how the slots are
# spaced, and how to translate an address — via `akuma-primitives::addr`.
akuma-virtio = { path = "../crates/akuma-virtio" }
# `set_virtio_window`, `set_print_hook`, and the phys<->virt translation the
# virtio HAL uses. Reached transitively already; named here because this crate
# now calls it directly.
akuma-primitives = { path = "../crates/akuma-primitives" }
# The fd table's parts (`Names`/`FlagSet`) that `KERNEL_TABLE`'s static is
# made of; the state machine itself comes in through `akuma-exec`.
akuma-fdtable = { path = "../crates/akuma-fdtable" }
# Page tables in memory + the amd64 walker; and the entry format it walks.
akuma-pagetable = { path = "../crates/akuma-pagetable" }
akuma-pte-amd64 = { path = "../crates/akuma-pte-amd64" }
akuma-idt-amd64 = { path = "../crates/akuma-idt-amd64" }
akuma-trap-amd64 = { path = "../crates/akuma-trap-amd64" }
# The machine description: the PVH handoff block, the virtio-MMIO command line,
# and ACPI. Host-tested against bytes measured on both machines, which is why
# `hvm.rs`, `cmdline.rs` and `acpi.rs` are no longer modules here.
akuma-ryzen-amd64 = { path = "../crates/akuma-ryzen-amd64" }
akuma-machine-facts = { path = "../crates/akuma-machine-facts" }
# The neutral spine both kernels share (multiarch W1): today amd64 consumes its
# `klog` (the `log` crate sink). The AArch64-only modules (`console`, `timer`,
# `platform`, `ntp_boot`, `irq::register_handler`) and their GIC/boot deps are
# target-gated out of this build; no feature is enabled here.
# Shared-kernel SMP under `akuma-bkl` (`bkl-smp`) is not optional: this kernel's BKL
# is `akuma_bkl`'s (`smp.rs`), whose entry points are no-ops without it - a build
# without it would run four cores with no lock at all, which `smp.rs` refuses at
# compile time (`akuma_bkl::ACTIVE`). It also runs the shared crates' syscall
# families in the BKL's dropped windows (network, VFS, fork's page copy, mm,
# drivers), as the AArch64 kernel does; A/B is the runtime toggles in
# `akuma_bkl::policy`. Without the VFS window every glue fs syscall here ran
# BKL-held, so one stalled xHCI transfer spun its full one-second timeout holding
# the BKL (`docs/archive/AKUMA_AMD64_USB_XHCI.md` § 2026-09-11). Was the
# `smp-shared` feature, required, until 2026-11-11.
akuma-kernel-core = { path = "../crates/akuma-kernel-core", features = ["bkl-smp"] }
akuma-user-tree = { path = "../crates/akuma-user-tree" }
# The filesystem, used unmodified. Its whole interface to a disk is a two-method
# `BlockDevice` trait, which is exactly what `akuma-virtio` exposes — see
# `src/fs.rs` for how short the adaptation is.
akuma-ext2 = { path = "../crates/akuma-ext2", features = ["bkl-smp"] }
# The `Filesystem` trait `Ext2Filesystem` implements, plus `FsError`/`Metadata`
# and the `MS_*` flag words a mount record carries.
akuma-vfs = { path = "../crates/akuma-vfs" }
# **C1 step 4a**: the kernel-side VFS *instance* — the global mount table, the
# path walk (CWD, `..`, symlinks), the synthetic `/dev` and `/etc/mtab` nodes.
# `src/fs.rs` carried its own `Spinlock<Option<MountTable>>` and a `with_fs`
# that held that lock across disk I/O; the table is this crate's now, which is
# the same instance `akuma-syscalls-glue::fs` resolves through — the
# prerequisite for folding the VFS syscall arms
# (`docs/archive/AKUMA_SELF_HOSTING_AMD64.md` § C1 step 4). Already in the link
# graph through `akuma-syscalls-glue`; named here because this crate calls it.
akuma-vfs-glue = { path = "../crates/akuma-vfs-glue", features = ["bkl-smp"] }
spinning_top = "0.3"
# The tree's tuning knobs, for `MMAP_EAGER_MAX_PAGES` — how many pages a mapping
# may have before it is demand-paged instead of populated at `mmap` time. Read
# from here rather than restated locally so the two kernels cannot be tuned
# differently by accident; it is the only thing this target takes from the crate.
akuma-config = { path = "../crates/akuma-config" }
# Only for `syscall-debug-info`'s feature forwarding: glue depends on both, and
# a feature can only be switched on through a crate this one names.
akuma-syscalls = { path = "../crates/akuma-syscalls", optional = true }
akuma-syscalls-time = { path = "../crates/akuma-syscalls-time", optional = true }
# `mmap`'s mapping-kind decode and `MAP_FIXED` validation — a pure function of
# the argument bits, host-tested, with seven pinned divergences from Linux. Used
# rather than re-derived so this target cannot drift from the AArch64 kernel on
# exactly the arguments where Linux compatibility is subtle.
akuma-syscalls-mem = { path = "../crates/akuma-syscalls-mem" }
# The shared flag tables the decode is written against.
akuma-syscalls-linux = { path = "../crates/akuma-syscalls-linux" }
# The read-only interface-introspection marshalling (`SIOCGIF*`,
# `/proc/net/dev`) — the byte layout `busybox ifconfig` reads, shared with the
# aarch64 kernel so the two cannot drift on the `struct ifreq` stride.
akuma-syscalls-net = { path = "../crates/akuma-syscalls-net" }
# The console history ring behind `dmesg` (`syslog(2)` action decode + the
# wrap/skip arithmetic), shared with the AArch64 kernel's `console::dmesg_*`.
# `src/serial.rs` used to hand-roll this as a `static mut [u8; 64 * 1024]` with
# four raw-pointer helpers; its one arithmetic bug made a 4 KiB staging buffer
# the silent ceiling on a 64 KiB `dmesg`, on the one machine whose console has
# no scrollback. The ring is host-tested; what stays here is the lock.
akuma-dmesg = { path = "../crates/akuma-dmesg" }
akuma-power = { path = "../crates/akuma-power" }
akuma-kacho = { path = "../crates/akuma-kacho" }
# The `/proc/<pid>/{stat,status,cmdline}` byte formats, shared with the AArch64
# kernel's `ProcFilesystem`. That filesystem *compiles* here since C1 step 4a
# brought `akuma-vfs-glue` in, but it is not mounted: it renders from
# `akuma-exec`'s process table and this target registers no processes there, so
# mounting it would replace a working synthetic `/proc` with an empty machine.
# The formats are shared either way, and the formats are where a divergence is
# invisible: `ps` finds `utime` by counting to field 14 of a 44-field line.
akuma-procfs = { path = "../crates/akuma-procfs" }
# The FPU save area's sizes, offsets, power-on image and `sanitize` rule (shared with taoxichuan).
akuma-fpu-amd64 = { path = "../crates/akuma-fpu-amd64" }
# The per-process frame ledger — which physical frames a process holds and how
# many VAs map each, with the two-counts rule and 14 host tests. Replaced this
# target's `FrameSet`, a 2048-entry flat array with no refcounts whose ceiling
# was reachable from a shell (`sh: can't fork: Out of memory`). The refcount is
# also CoW's teardown prerequisite. Shared with the AArch64 kernel's
# `UserAddressSpace`, so the two targets account for user frames identically.
akuma-user-space = { path = "../crates/akuma-user-space" }
# `PhysFrame`, the ledger's currency.
akuma-mmap = { path = "../crates/akuma-mmap" }
# The shared file-page cache: one physical frame per `(mount, inode, offset)`,
# however many processes map it. Adopted 2026-09-13 with demand-paged file
# mappings — the two are one change, since a cache is only reachable from a path
# that fills pages one at a time.
akuma-fpcache = { path = "../crates/akuma-fpcache" }
# Its writable sibling (2026-10-03): one frame per page of a writable
# `MAP_SHARED` file mapping, shared by every process that maps it, for as long
# as any does — the coherence SQLite's WAL index needs. `src/shmpages.rs`.
akuma-fpcache-rw = { path = "../crates/akuma-fpcache-rw" }
# `/dev/fb0`'s decisions (ioctl answers, FBIOPUT acceptance, single owner,
# mmap bounds), host-tested. `src/fbdev.rs` is the device.
akuma-fbdev = { path = "../crates/akuma-fbdev" }
# The shared MMU crate. Its x86 `UserAddressSpace` is **the** user-space page
# table on this target since C1 step 5a: `mm.rs`, `idt.rs`, `loader.rs`,
# `usermode.rs` and `fd.rs` all map through it, and `paging.rs` lost its own
# `AddressSpace` (it keeps the kernel's own mappings, which this crate does not
# do on either architecture). It also owns the permission vocabulary and the
# encoder both walkers share, so `x86_prot_matches_amd64_encoding` pins one
# implementation rather than an agreement between two.
# `docs/archive/AKUMA_AMD64_STEP5A_ONE_WALKER.md`.
akuma-mmu = { path = "../crates/akuma-mmu" }
# The copy-on-write write-fault decision — four outcomes from (live PTE, CoW
# marker, share count), host-tested. Shared with the AArch64 kernel so both
# distinguish "already repaired", "read-only on purpose", "sole owner" and
# "genuinely shared" the same way; each of those four is a real incident in this
# tree, and getting one wrong is silent in every direction.
akuma-cow = { path = "../crates/akuma-cow" }
# `global_namespace()` — the `Namespace` every `akuma_exec::Process` carries.
# There are no boxes on this target, so every registered process names the one
# global namespace, exactly as `Process::from_image` does on AArch64.
akuma-isolation = { path = "../crates/akuma-isolation", default-features = false }
# The console line discipline: canonical mode, echo, backspace, Ctrl+D, and
# `map_cr_to_nl`. Hand-rolling a console reader hits the CR-vs-NL bug on the
# first Enter keypress; this crate is the tree's answer and is dependency-free.
akuma-tty = { path = "../crates/akuma-tty" }
# `FileDescriptor` and `KernelFile` — the tree's descriptor types. The unsafe-free
# core of `akuma-exec`, behind only `akuma-primitives`/`akuma-mmap`/
# `akuma-syscalls-linux`, all of which build for this target.
akuma-exec-core = { path = "../crates/akuma-exec-core" }
# The networking stack: smoltcp, the AF_INET socket table and DNS. Used
# unmodified; `src/net.rs` supplies the twelve `NetRuntime` hooks.
akuma-net = { path = "../crates/akuma-net", features = ["rtl8169"] }
# The SNTP wire protocol + boot-time retry loop (`src/clock.rs`, 2026-09-05) —
# pure, host-tested, `#![no_std]`, zero dependencies. Extracted out of
# `akuma-syscalls-time` specifically so this target could reach it without also
# needing that crate's `akuma-exec` dependency, which does not build here.
akuma-sntp = { path = "../crates/akuma-sntp" }
# The CMOS real-time clock's decode (2026-10-12): seeds the wall clock at
# boot so a machine with no network — the QEMU rehearsals, a wifi boot before
# the join — still stamps inodes with the right year; SNTP corrects it after.
akuma-cmos-rtc = { path = "../crates/akuma-cmos-rtc" }
# The pure byte-FIFO half of a pipe (buffer, 64 KiB cap, closable write end, the
# empty-vs-EOF rule), host-tested. `sys_spawn` wires a child's stdio to these;
# `src/pipe.rs` is the `static` array + lock around it. The tree's full kernel
# pipe is `akuma-syscalls-glue`, which does not build for this target.
akuma-pipe = { path = "../crates/akuma-pipe" }
akuma-pipes = { path = "../crates/akuma-pipes" }
# The `select(2)`/`pselect6` fd-set marshalling and the readiness vocabulary
# (`akuma_syscalls_poll::fdset`), host-tested — the same module the AArch64
# kernel marshals its poll family through. First consumer on this target was
# `sys_select` (`fd.rs`): `apk` waits for socket writability through `select`
# and wedged its TLS fetch while the syscall was `ENOSYS`.
akuma-syscalls-poll = { path = "../crates/akuma-syscalls-poll" }
# The futex family's pure logic: the op decode, the `(tgid, uaddr)` key
# namespace, the waiter table, the deadline algebra and the `WAKE_OP` opcode.
# Wired 2026-09-06 with `clone(CLONE_VM)` — see `src/futex.rs`.
#
# Only the *decisions* are shared. The AArch64 kernel half is
# `akuma-syscalls-glue::sync`, 947 lines of which 22 references are
# `akuma_exec::threading` — that crate's park/wake, thread states and
# `tpidr_el1`. `cargo check -p akuma-syscalls-glue --target x86_64-unknown-none`
# fails on `UserAddressSpace::ttbr0`, `invalidate_icache_for_page_va` and the
# rest of the aarch64 page-table walker, so reusing the kernel half means
# porting `akuma-mmu` first (§11.4's dependency, not §11.2's). That split is
# the crate's own stated design: "the kernel performs every effect", and here
# the effect is parking a thread on a scheduler the two targets do not share.
akuma-syscalls-sync = { path = "../crates/akuma-syscalls-sync" }
# The process family's pure decisions (clone kinds, exit scope, wait status, execve's budget).
akuma-syscalls-proc = { path = "../crates/akuma-syscalls-proc" }
# The user-copy primitive: `copy_from_user_safe` and its x86_64 `rep movsb`
# loop, plus `user_copy_fixup`, which `idt.rs`'s page-fault path consults to
# turn a fault inside that loop into a returned EFAULT instead of a halt. The
# first arch-neutral crate on this target whose *mechanism* had to be built
# here rather than ported (`docs/archive/AKUMA_USER_ACCESS_X86_FIXUP.md`).
akuma-user-access = { path = "../crates/akuma-user-access" }
# The scheduler. `amd64/src/sched.rs` was an independent one until 2026-09-07 —
# its own thread table, states, context switch, picker and park/wake — which
# meant this target ran a second, weaker copy of a state machine this crate had
# already hardened against a decade of AArch64 incidents (slot generations,
# CAS'd state transitions). `sched.rs` is now the machine half only: the CR3,
# TSS, MSR, `fxsave` and lock-depth effects the scheduler is not allowed to
# know about, registered as `X86ArchHooks`.
# `docs/archive/AKUMA_SELF_HOSTING_AMD64.md` calls this A1.
akuma-threading = { path = "../crates/akuma-threading" }
# Orphaned-lock recovery for ext2. Only `register_backstop` is named here — the
# lock type itself is `akuma-ext2`'s business — and only because the backstop is
# a **waiter-side** rescue: a thread blocked on a mount whose writer died drives
# the very slot sweep that frees it, which is the half the idle loop's collector
# cannot cover (it does not run while the box is busy). See
# `crate::fs::install_reap_hooks`.
akuma-locks-rw = { path = "../crates/akuma-locks-rw" }
# **C1**: the shared syscall dispatcher and its per-family implementations —
# the crate this target's `usermode.rs` is being folded into
# (`docs/archive/AKUMA_AMD64_C1_DISPATCH_VOCABULARY.md`, step 3 onward).
# `default-features = false` on principle, matching the AArch64 bin: glue's
# `default` is `smoltcp` and a profile that does not want the stack must not
# gain it by accident. This target does want it — `akuma-net` is already here
# with smoltcp on — so it is named explicitly.
# The process/thread/exec runtime glue dispatches through. Named directly
# because `exec_runtime.rs` builds its `ExecRuntime`/`ExecConfig` tables —
# without that registration the first syscall folded into glue panics in
# `akuma_exec::runtime::config()`, which is a `Registered` cell.
akuma-exec = { path = "../crates/akuma-exec", features = ["bkl-smp"] }
# `exec`: box's `SPAWN_EXT` (private 315) is glue's `sys_spawn_ext`, which loads
# through `akuma-exec`'s ELF loader. Row 8 of the tokio dependency analysis
# (`3e2bb725`) put that path behind the feature and left it off here, so every
# `box run` answered "failed to spawn" until 2026-11-01. Taoxichuan has no box
# and keeps it off.
akuma-syscalls-glue = { path = "../crates/akuma-syscalls-glue", default-features = false, features = ["smoltcp", "exec", "akuma-native", "bkl-smp"] }
# The x86-only syscall bodies both x86 kernels share; so far `kill` (moved from `signal.rs`).
akuma-syscalls-glue-amd64 = { path = "../crates/akuma-syscalls-glue-amd64" }

# The bin is `amd64/bin` (package `akuma-amd64`, which forwards every feature above), so
# `-p akuma-amd64` and `target/x86_64-unknown-none/*/akuma-amd64` mean what they always meant.
[lib]
path = "src/lib.rs"

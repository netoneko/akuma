[package]
name = "akuma-amd64"
version = "0.1.0"
edition = "2024"
description = "amd64 (x86_64) boot target: PVH -> long mode -> the arch-neutral crates"

[lints]
workspace = true

[dependencies]
# Stage A of the amd64 bring-up: the kernel's own memory management, running on
# x86_64. Both of these already built for `x86_64-unknown-none` before this
# target existed — they are neutral code, and wiring them up is the test of that
# claim. Note they reach `akuma-cpu` through `akuma-primitives`, and on x86 the
# barrier/park wrappers are real while `daif`/`tlb`/`sysreg` are still stubs; see
# `docs/archive/AKUMA_FIRECRACKER_AMD64.md` §1.3 for what that costs.
akuma-alloc = { path = "../crates/akuma-alloc" }
akuma-pmm = { path = "../crates/akuma-pmm" }

[[bin]]
name = "akuma-amd64"
path = "src/main.rs"
